<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الرابطة التساهمية | درس تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#eef2fb;--bgt:rgba(238,242,251,.88);--sf:#fff;--ink:#141a2e;--mu:#5a6482;--ln:#dbe1f0;--ac:#5b5bf0;--ac2:#06b6d4;--bl:#eceeff;--gr:#e4f8f0;--pu:#f3ecff;--am:#fff3d4;--ok:#0f9d58;--bad:#d93a46;--okb:#dcf7e8;--badb:#fde3e6;--sh:0 10px 30px rgba(70,80,160,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080c1a;--bgt:rgba(8,12,26,.88);--sf:#121a31;--ink:#e8ecfa;--mu:#9aa6c6;--ln:#26304f;--ac:#8b8bff;--bl:#1a2146;--gr:#0f2c2b;--pu:#271c4a;--am:#3a2f12;--ok:#4fe0a0;--bad:#ff8a93;--okb:#0f3325;--badb:#471a21;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080c1a;--bgt:rgba(8,12,26,.88);--sf:#121a31;--ink:#e8ecfa;--mu:#9aa6c6;--ln:#26304f;--ac:#8b8bff;--bl:#1a2146;--gr:#0f2c2b;--pu:#271c4a;--am:#3a2f12;--ok:#4fe0a0;--bad:#ff8a93;--okb:#0f3325;--badb:#471a21;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:500 16px/1.85 Tajawal,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(1000px 480px at 90% -8%,rgba(91,91,240,.2),transparent),radial-gradient(800px 420px at -8% 8%,rgba(6,182,212,.16),transparent),var(--bg);background-attachment:fixed}
.w{max-width:1100px;margin:auto;padding:12px 14px 44px}
.hd{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;background:linear-gradient(115deg,#241472,#5b5bf0 58%,#06b6d4);color:#fff;border-radius:28px;padding:24px 28px;box-shadow:var(--sh)}.hd>*{position:relative}
.hd h1{margin:2px 0;font:800 2.1rem/1.3 Cairo,Tajawal,sans-serif}.hd p{margin:0;opacity:.9}.tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:0 12px;font-size:.82rem;font-weight:700}
.fl{position:absolute;inset:0}.fl i{position:absolute;bottom:-24px;border-radius:50%;background:rgba(255,255,255,.35);animation:up linear infinite}
.nb{position:sticky;top:0;z-index:5;background:var(--bgt);backdrop-filter:blur(12px);margin:10px -14px 0;padding:6px 14px 0;border-bottom:1px solid var(--ln)}
.gp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0}.gp>b{color:var(--mu);font-size:.85rem;min-width:150px}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:.1rem .85rem;font:700 .88rem Tajawal,sans-serif;cursor:pointer;transition:.2s}.ch button:hover{border-color:var(--ac)}
.ch button.on{background:linear-gradient(110deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(91,91,240,.4)}.ch button.q{border-style:dashed}
.pr{height:4px;background:var(--ln);border-radius:9px;margin:6px 0 0;overflow:hidden}.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:16px 20px;margin:14px 0;box-shadow:var(--sh);animation:fi .5s both}
.pn.bl{background:var(--bl)}.pn.gr{background:var(--gr)}.pn.pu{background:var(--pu)}.pn.am{background:var(--am)}
.pn h3{margin:0 0 8px;font:800 1.15rem Cairo,Tajawal,sans-serif}.pn h3:before{content:"";display:inline-block;width:9px;height:1.1em;border-radius:6px;background:linear-gradient(var(--ac),var(--ac2));margin-inline-end:9px;vertical-align:-3px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:0 16px}
.mu{color:var(--mu);font-size:.9rem}.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.gb,.nv button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:.3rem 1rem;font:700 .95rem Tajawal,sans-serif;cursor:pointer;transition:.2s}.gb:hover{border-color:var(--ac)}.gb.pri,.nv button{background:linear-gradient(110deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}.gb:disabled{opacity:.45}
.sw{display:flex;gap:8px;align-items:center;font-weight:700}input[type=range]{accent-color:var(--ac)}
figure{margin:8px 0}figure img{display:block;max-width:100%;border-radius:14px;margin:auto;background:#fff}figcaption{text-align:center;color:var(--mu);font-size:.85rem}
.brt{animation:br 4s ease-in-out infinite}
.stp{display:flex;align-items:center;gap:8px;margin:4px 0}.stp span{min-width:110px;font-weight:700}.stp button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);font:800 1.1rem sans-serif;cursor:pointer}.stp b{min-width:2ch;text-align:center;font-size:1.2rem}
.bar{background:var(--ln);border-radius:8px;height:18px;margin:6px 0;overflow:hidden;direction:ltr}.bar i{display:block;height:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem;text-align:center;border-radius:12px;overflow:hidden}th{background:linear-gradient(110deg,var(--ac),var(--ac2));color:#fff;padding:7px}td{padding:7px;border:1px solid var(--ln);background:var(--sf)}tr.on td{background:var(--am)}
.iso{display:inline-flex;align-items:center;direction:ltr;font-weight:800;font-size:1.7rem;color:var(--ac)}.iso i{display:flex;flex-direction:column;font-style:normal;font-size:.75rem;line-height:1.1;margin-inline-end:3px;text-align:end}
.rl{background:var(--am);border:2px solid #e0b43a;border-radius:14px;padding:8px 14px;font-weight:800;text-align:center;margin:10px 0}
.idc{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;background:#fff8d6;color:#3b3200;border:2px solid #e0b43a;border-radius:14px;padding:10px 14px;max-width:340px;margin:auto}.idc span{font-size:.82rem}.idc b{font-size:1.1rem}.idc b.big{font-size:1.7rem;direction:ltr;text-align:start}
#zt{display:grid;grid-template-columns:repeat(18,minmax(30px,1fr));gap:3px;overflow-x:auto;direction:ltr;margin:8px 0}#zt button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:7px;padding:1px 0;font:800 .85rem Tajawal;cursor:pointer;line-height:1.2;transition:transform .2s}#zt small{display:block;font-size:.65rem;color:var(--mu)}#zt button.on{background:var(--ac);color:#fff;transform:scale(1.15)}#zt button.on small{color:#fff}
.lst li{animation:fi .5s both;margin:4px 0}#sg{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}#sg i{width:12px;height:12px;border-radius:50%;animation:pop .3s both}
.bx>div{margin:8px 0;font-weight:700;font-size:.9rem}.bx i{display:block;height:12px;border-radius:6px;background:#ef4444;margin-top:3px;transition:width 1s}
.cmp{background:var(--am);border-radius:14px;padding:8px 14px;font-weight:700;text-align:center;direction:ltr;overflow-x:auto}.stk{display:flex;height:26px;border-radius:99px;overflow:hidden;margin:8px 0;direction:ltr}.stk span{color:#fff;font:700 .78rem/26px Tajawal;text-align:center;transition:width .2s;white-space:nowrap;overflow:hidden}
.rw2{margin:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}input.num,#sl{border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:.3rem .7rem;font:700 1rem Tajawal;min-width:200px}input.num.ok,#sl.ok{border-color:var(--ok);background:var(--okb)}input.num.no,#sl.no{border-color:var(--bad);background:var(--badb)}
.fq{background:linear-gradient(135deg,var(--pu),var(--bl));border:2px dashed var(--ac);border-radius:20px;padding:12px 18px;margin:14px 0}.fq:before{content:"✦ لنتأكد من الفهم";display:block;color:var(--ac);font-weight:800;font-size:.85rem}.fq.qz:before{content:none}.fq.qz{border-style:solid;border-color:var(--ln);background:var(--sf);box-shadow:var(--sh)}
.fo-w{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}.fo{border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:14px;padding:.45rem .9rem;font:700 .95rem Tajawal,sans-serif;cursor:pointer;text-align:start;transition:.15s}.fo:hover{border-color:var(--ac);transform:translateY(-2px)}
.fo.ok{border-color:var(--ok);background:var(--okb)}.fo.no{border-color:var(--bad);background:var(--badb)}.fe{display:none;margin-top:8px;padding:8px 12px;border-radius:12px;font-size:.92rem}.fq[data-d] .fe{display:block}.fq.g .fe{background:var(--okb)}.fq.x .fe{background:var(--badb)}
.sc{font-size:1.4rem;font-weight:800;text-align:center;padding:16px;border-radius:18px;background:var(--okb);margin:14px 0}
.nv{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
@keyframes fi{from{opacity:0;transform:translateY(12px)}}@keyframes pop{from{transform:scale(.2);opacity:0}}@keyframes br{50%{transform:scale(1.05)}}@keyframes pl{50%{opacity:.9}}@keyframes up{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-260px);opacity:0}}
.pl{animation:pl 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pp{animation:pop .6s both;transform-box:fill-box;transform-origin:center}.inf{background:var(--am);border-radius:14px;padding:10px 14px;margin-top:8px;font-size:.95rem}
.lab{display:flex;gap:10px;flex-wrap:wrap}.cell{flex:1 1 180px;text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px}.blob{margin:10px auto;width:74px;height:60px;border-radius:10px;transition:all 1s}.blob.m{width:140px;height:12px;border-radius:50%}.plate{height:16px;border-radius:8px;margin:8px 0;transition:background .3s}
svg text{font-family:Tajawal,sans-serif}table .gb{font-size:.85rem}

   const ln=Math.min(60,6+Math.abs(f)*35);if(ln>8){x.strokeStyle=f>0?'#ef4444':'#2563eb';x.fillStyle=x.strokeStyle;x.lineWidth=4;[[L,-1],[Rr,1]].forEach(([px,s])=>{const dir=f>0?s:-s,y=128,a0=px,a1=px+dir*ln;x.beginPath();x.moveTo(a0,y);x.lineTo(a1,y);x.stroke();x.beginPath();x.moveTo(a1+dir*8,y);x.lineTo(a1,y-6);x.lineTo(a1,y+6);x.fill()});x.fillStyle=f>0?'#ef4444':'#2563eb';x.fillText(f>0?'محصلة تنافر':'محصلة تجاذب',cx,156)}else{x.fillStyle='#16a34a';x.fillText('توازن',cx,156)}
   x.strokeStyle='#94a3b8';x.lineWidth=1.5;x.beginPath();x.moveTo(70,170);x.lineTo(70,350);x.lineTo(725,350);x.stroke();x.setLineDash([4,4]);x.beginPath();x.moveTo(70,Y(0));x.lineTo(725,Y(0));x.stroke();x.setLineDash([]);x.fillStyle='#64748b';x.textAlign='left';x.fillText('طاقة صفر (ذرتان متباعدتان)',420,Y(0)-6);x.textAlign='center';x.fillText('المسافة بين النواتين (pm)',400,368);
   x.strokeStyle='#8b5cf6';x.lineWidth=3;x.beginPath();for(let q=60;q<=400;q+=2){const yy=Y(U(q));q==60?x.moveTo(X(q),yy):x.lineTo(X(q),yy)}x.stroke();
   x.fillStyle='#16a34a';x.beginPath();x.arc(X(r0),Y(-De),5,0,7);x.fill();x.fillText('أقل طاقة',X(r0)+8,Y(-De)+22);
   x.fillStyle='#f59e0b';x.beginPath();x.arc(X(d),Y(U(d)),8,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()})}},
{t:'تركيب لويس والقاعدة الثمانية',h:()=>`
<div class="pn"><h3>ابنِ الجزيء بنفسك</h3><div class="ch" id="mc"></div><svg id="lw" viewBox="-235 -205 470 410" style="width:100%;max-width:520px;display:block;margin:auto"></svg><div class="ctl"><button class="gb pri" id="bn">🔗 كوّن الرابطة</button><label class="sw"><input type="checkbox" id="ls">أظهر الرابطة كخط (تركيب لويس)</label></div><div class="inf" id="li"></div><p class="mu">🟠 إلكترونات الذرة المركزية · 🔵 إلكترونات الذرات المرتبطة بها. كل ذرة تصل إلى 8 إلكترونات (الهيدروجين 2).</p></div>
<div class="pn pu"><h3>كم رابطة تكوّن الذرة؟ (عدد التكافؤ ← الحاجة)</h3><table><tr><th>المجموعة</th><th>إلكترونات التكافؤ</th><th>تحتاج</th><th>عدد الروابط الأحادية</th><th>أمثلة</th></tr>${[[17,7,1,'HF,HCl,F2'],[16,6,2,'H2O,H2S,O2'],[15,5,3,'NH3,PH3,N2'],[14,4,4,'CH4,SiH4,CCl4']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[2]}</b></td><td>${r[3].split(',').map(m=>`<button class="gb" style="padding:.1rem .6rem" data-m="${m}">${MOL.find(z=>z[0]==m)[1].split(' ')[0]}</button>`).join(' ')}</td></tr>`).join('')}</table><p class="mu">مثال 4-1: HF — ذرة H تعطي إلكترونًا وذرة F تحتاج إلكترونًا، فتتكوّن رابطة أحادية. جرّب مسائل الكتاب: PH₃ وH₂S وHCl وCCl₄ وSiH₄.</p></div>
${FQ('كم رابطة تساهمية أحادية تكوّنها ذرة الكلور (المجموعة 17)؟','رابطة واحدة',['رابطتان','ثلاث روابط','أربع روابط'],'الكلور له 7 إلكترونات تكافؤ ويحتاج إلكترونًا واحدًا.')}${FQ('كم زوجًا من الإلكترونات غير المترابطة على ذرة الكبريت في H₂S؟','زوجان',['زوج واحد','ثلاثة أزواج','لا شيء'],'S: 6 − 2 رابطتين = 4 إلكترونات = زوجان.')}${FQ('كم زوج إلكترونات مشترك في جزيء CH₄؟','4 أزواج',['2','3','8'],'الكربون يكوّن أربع روابط أحادية مع أربع ذرات هيدروجين.')}`,
 i:()=>{let mi=4,b=0,ln=0,M;
  const build=()=>{const m=MOL[mi],c=m[2],Lg=m[3],Od=m[4],n=Lg.length,S=[[1],[0,1],[0,1,3],[0,1,2,3]][n-1];
   const A=[{s:c,v:VAL[c],b:[],p:n==1?[-43,0]:[0,0],q:n==1?[-95,0]:[0,0]}];
   Lg.forEach((s,i)=>{const d=DR[S[i]],c0=A[0],sr=n==1?190:165;A.push({s,v:VAL[s],b:[],p:[c0.p[0]+d[0]*86,c0.p[1]+d[1]*86],q:[c0.q[0]+d[0]*sr,c0.q[1]+d[1]*sr]});c0.b.push([S[i],Od[i],i+1]);A[i+1].b.push([S[i]^1,Od[i],0])});
   const D=[];
   A.forEach((a,ai)=>{const col=ai?'#2563eb':'#f59e0b';let k=0,used=0;const slot=()=>{const t=-1.5708+(k++)*6.2832/a.v;return[a.q[0]+27*Math.cos(t),a.q[1]+27*Math.sin(t)]};
    a.b.forEach(([d,o,j])=>{const B=A[j],ax=B.p[0]-a.p[0],ay=B.p[1]-a.p[1],l=Math.hypot(ax,ay),ux=ax/l,uy=ay/l,mx=(a.p[0]+B.p[0])/2,my=(a.p[1]+B.p[1])/2;for(let r=0;r<o;r++){const off=(r-(o-1)/2)*11;D.push({sep:slot(),bon:[mx-ux*4.5-uy*off,my-uy*4.5+ux*off],col,m:1})}used+=o});
    const bs=a.b.map(z=>z[0]),LP=(a.v-used)/2,o0=LP==1&&bs.length==1?[bs[0]^1,2,3]:[2,3,bs.length==1?bs[0]^1:-1,0,1],ord=o0.filter((z,i)=>z>=0&&!bs.includes(z)&&o0.indexOf(z)==i);
    for(let p=0;p<LP;p++){const d=DR[ord[p]];for(let e=-1;e<=1;e+=2)D.push({sep:slot(),bon:[a.p[0]+d[0]*26-d[1]*5*e,a.p[1]+d[1]*26+d[0]*5*e],col,m:0})}
    a.e=2*used+2*LP;a.lp=LP});
   let s='<g id="ln" style="opacity:0;transition:opacity .6s">';
   A[0].b.forEach(([d,o,j])=>{const B=A[j],ax=B.p[0]-A[0].p[0],ay=B.p[1]-A[0].p[1],l=Math.hypot(ax,ay),px=-ay/l,py=ax/l;for(let r=0;r<o;r++){const off=(r-(o-1)/2)*9;s+=`<line x1="${A[0].p[0]+px*off}" y1="${A[0].p[1]+py*off}" x2="${B.p[0]+px*off}" y2="${B.p[1]+py*off}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>`}});s+='</g>';
   A.forEach(a=>{s+=`<g class="at" style="transition:transform 1.2s;transform:translate(${a.q[0]}px,${a.q[1]}px)"><circle r="17" fill="${CO[a.s]}"/><text y="5" text-anchor="middle" font-weight="800" font-size="15" fill="${TC[a.s]||'#fff'}">${a.s}</text><text class="ct" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="var(--mu)"></text></g>`});
   D.forEach(d=>{s+=`<circle class="dt" r="3.6" fill="${d.col}" stroke="#fff" stroke-width="1" style="transition:transform 1.2s,opacity .5s;transform:translate(${d.sep[0]}px,${d.sep[1]}px)"/>`});
   $('#lw').innerHTML=s;M={A,D};
   const ty=[...new Set(A.map(a=>a.s))],bn=A[0].b.reduce((t,z)=>t+z[1],0),lp=A.reduce((t,a)=>t+a.lp,0);
   $('#li').innerHTML=`<b>${m[1]}</b> — `+ty.map(z=>`${z}: ${VAL[z]} إلكترونات تكافؤ ← تحتاج ${(z=='H'?2:8)-VAL[z]}`).join(' · ')+`<br>أزواج مشتركة: <b>${bn}</b> · أزواج غير مترابطة: <b>${lp}</b>`};
  const upd=()=>{document.querySelectorAll('#lw .at').forEach((g,i)=>{const a=M.A[i],p=b?a.p:a.q,n=b?a.e:a.v,ok=b&&(n==8||(a.s=='H'&&n==2)),t=g.querySelector('.ct');g.style.transform=`translate(${p[0]}px,${p[1]}px)`;t.textContent=n+' e⁻';t.setAttribute('fill',ok?'#16a34a':'var(--mu)')});
   document.querySelectorAll('#lw .dt').forEach((c,i)=>{const d=M.D[i],p=b?d.bon:d.sep;c.style.transform=`translate(${p[0]}px,${p[1]}px)`;c.style.opacity=ln&&b&&d.m?0:1});$('#ln').style.opacity=ln&&b?1:0;$('#bn').textContent=b?'↺ افصل الذرات':'🔗 كوّن الرابطة'};
  const pick=i=>{mi=i;b=0;document.querySelectorAll('#mc button').forEach((x,j)=>x.classList.toggle('on',j===i));build();upd()};
  $('#mc').innerHTML=MOL.map((m,i)=>`<button data-i="${i}">${m[1]}</button>`).join('');$('#mc').onclick=e=>{const x=e.target.closest('button');if(x)pick(+x.dataset.i)};
  $('#bn').onclick=()=>{b=!b;upd()};$('#ls').onchange=e=>{ln=e.target.checked;upd()};
  document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{pick(MOL.findIndex(z=>z[0]==x.dataset.m));$('#bn').scrollIntoView({behavior:'smooth',block:'center'})});pick(4)}},
{t:'الروابط المتعددة: σ و π',h:()=>`
<div class="pn"><h3>كيف تتداخل المستويات؟</h3><div class="ch" id="bo"></div><svg id="sp" viewBox="0 0 600 270" style="width:100%;max-width:640px;display:block;margin:auto"></svg><div class="inf" id="sx"></div></div>
<div class="g2"><div class="pn bl"><h3>القاعدة</h3><p>• <b>رابطة سيجما σ</b>: تداخل <b>رأسي</b> (رأس لرأس) بين s وs أو s وp أو p وp، فتزداد الكثافة الإلكترونية على خط الربط. كل رابطة أحادية سيجما.<br>• <b>رابطة باي π</b>: تداخل مستويات p الفرعية <b>المتوازية</b> (جنبًا إلى جنب) فتقع إلكتروناتها أعلى الخط وأسفله.<br>• الرابطة المتعددة = سيجما واحدة + رابطة باي واحدة أو أكثر.</p></div><div class="pn"><figure><img src="${IM.eth}" alt=""><figcaption>الشكل 9-4: الرابطة المتعددة في الإيثين C₂H₄</figcaption></figure></div></div>
<div class="pn"><figure><img src="${IM.orb}" alt=""><figcaption>الشكل 7-4: روابط سيجما في CH₄ وNH₃ وH₂O</figcaption></figure></div>
${FQ('الرابطة التساهمية الثنائية تتكوّن من','سيجما واحدة وباي واحدة',['سيجما واحدة فقط','باي واحدة فقط','سيجما وثلاث باي'],'العدد الكلي للروابط 2: واحدة σ والباقي π.')}${FQ('الرابطة الثلاثية (كما في N₂) تتكوّن من','سيجما واحدة وباي اثنتين',['ثلاث سيجما','سيجما اثنتين وباي واحدة','ثلاث باي'],'σ واحدة دائمًا، والباقي π.')}${FQ('تتكوّن روابط باي من تداخل مستويات p','المتوازية جنبًا إلى جنب',['رأسًا لرأس','مع مستوى s فقط','مع النواة'],'التداخل الرأسي يعطي σ، والجانبي يعطي π.')}`,
 i:()=>{const L=['أحادية','ثنائية','ثلاثية'],E=['H–H · HF · H₂O','O=O · H₂C=CH₂','N≡N · H–C≡C–H'];let o=1;
  const d=()=>{document.querySelectorAll('#bo button').forEach((b,i)=>b.classList.toggle('on',i+1===o));
   let s='<defs><marker id="m1"/></defs>'+`<g class="pp" style="animation-delay:0s"><ellipse cx="255" cy="135" rx="62" ry="38" fill="#8b5cf6" opacity=".45"/><ellipse cx="345" cy="135" rx="62" ry="38" fill="#8b5cf6" opacity=".45"/></g>`;
   if(o>=2)s+=`<g class="pp" style="animation-delay:.6s"><ellipse cx="300" cy="72" rx="78" ry="26" fill="#06b6d4" opacity=".55"/><ellipse cx="300" cy="198" rx="78" ry="26" fill="#06b6d4" opacity=".55"/></g>`;
   if(o>=3)s+=`<g class="pp" style="animation-delay:1.2s"><ellipse cx="300" cy="104" rx="52" ry="11" fill="#14b8a6" opacity=".6" stroke="#0f766e" stroke-dasharray="4 3"/><ellipse cx="300" cy="166" rx="52" ry="11" fill="#14b8a6" opacity=".6" stroke="#0f766e" stroke-dasharray="4 3"/></g>`;
   s+=`<circle cx="228" cy="135" r="20" fill="#475569"/><circle cx="372" cy="135" r="20" fill="#475569"/><text x="228" y="140" text-anchor="middle" fill="#fff" font-weight="800">X</text><text x="372" y="140" text-anchor="middle" fill="#fff" font-weight="800">X</text><line x1="248" x2="352" y1="135" y2="135" stroke="#fff" stroke-width="2.5" opacity=".7"/>`;
   s+=`<g font-size="14" font-weight="700"><text x="300" y="255" text-anchor="middle" fill="#8b5cf6">■ σ تداخل رأسي</text>${o>=2?'<text x="110" y="60" fill="#0891b2">■ π تداخل جانبي</text>':''}${o>=3?'<text x="110" y="90" fill="#0f766e">■ π ثانية (في اتجاه آخر)</text>':''}</g>`;
   $('#sp').innerHTML=s;$('#sx').innerHTML=`رابطة <b>${L[o-1]}</b>: <b>${o}</b> زوج مشترك = ${bd('1σ + '+(o-1)+'π')}<br>أمثلة: ${bd(E[o-1])}`};
  $('#bo').innerHTML=L.map((l,i)=>`<button data-o="${i+1}">رابطة ${l}</button>`).join('');$('#bo').onclick=e=>{const b=e.target.closest('button');if(b){o=+b.dataset.o;d()}};d()}},
{t:'طول الرابطة وقوتها',h:()=>`
<div class="pn"><h3>فكّك الرابطة وقِس الطاقة اللازمة</h3><div class="ch" id="kc"></div><svg id="ks" viewBox="0 0 600 190" style="width:100%;max-width:640px;display:block;margin:auto"></svg><div class="ctl" dir="ltr"><span class="mu">رابطة سليمة</span><input type="range" id="kp" min="0" max="100" value="0" style="flex:1"><span class="mu">مفكّكة</span></div><div class="bar"><i id="kb" style="width:0"></i></div><p id="kt" style="font-weight:800;margin:4px 0"></p></div>
<div class="g2"><div class="pn bl"><h3>الجدولان 1-4 و2-4</h3><table><tr><th>الجزيء</th><th>النوع</th><th>الطول (×10⁻¹⁰ m)</th><th>طاقة التفكك (kJ/mol)</th></tr><tr><td>F₂</td><td>أحادية</td><td>1.43</td><td>159</td></tr><tr><td>O₂</td><td>ثنائية</td><td>1.21</td><td>498</td></tr><tr><td>N₂</td><td>ثلاثية</td><td>1.10</td><td>945</td></tr></table><div class="rl">كلما قصر طول الرابطة زادت قوتها وزادت طاقة تفككها</div><p class="mu">طول الرابطة: المسافة بين نواتي الذرتين المترابطتين، وتتحدد بحجم الذرتين وعدد الأزواج المشتركة.</p></div>
<div class="pn gr"><h3>قارن بالأشرطة</h3><div class="bx" id="kx"></div></div></div>
<div class="pn am"><h3>🇸🇦 فخر سعودي</h3><p>فاز العالم السعودي البروفيسور عمر ياغي بجائزة نوبل في الكيمياء لعام 2025 تقديرًا لإسهاماته الرائدة في تأسيس علم الكيمياء الشبكية وتطوير الأطر المعدنية العضوية (MOFs) والأطر العضوية التساهمية (COFs)، وهي أطر تُبنى بروابط تساهمية.</p></div>
${FQ('أي الجزيئات الآتية أقصر رابطة وأقواها؟','N₂ (الثلاثية)',['O₂ (الثنائية)','F₂ (الأحادية)','كلها متساوية'],'الرابطة الثلاثية أقصر (1.10) وأقوى (945 kJ/mol).')}${FQ('توقّع: أي الروابط أقوى (طاقة تفكك أكبر)؟ H–C≡C–H أم H₂C=CH₂ (في الرابطة بين الكربونين)','الثلاثية في H–C≡C–H',['الثنائية في H₂C=CH₂','متساويتان','لا يمكن التوقع'],'عدد أزواج أكبر ← أقصر وأقوى.')}`,
 i:()=>{let k='F2',p=0;const B={F2:{n:'F₂',t:'أحادية',L:1.43,E:159,o:1,c:'#22c55e'},O2:{n:'O₂',t:'ثنائية',L:1.21,E:498,o:2,c:'#ef4444'},N2:{n:'N₂',t:'ثلاثية',L:1.10,E:945,o:3,c:'#3b82f6'}};
  const d=()=>{const m=B[k],ds=m.L*100*(1+p/100*1.7),a=300-ds/2,b=300+ds/2;let s='';
   for(let r=0;r<m.o;r++){const y=95+(r-(m.o-1)/2)*11;s+=`<line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="${m.c}" stroke-width="5" stroke-linecap="round" opacity="${Math.max(0,1-p/60)}"/>`}
   s+=`<circle cx="${a}" cy="95" r="34" fill="${m.c}"/><circle cx="${b}" cy="95" r="34" fill="${m.c}"/><g fill="#fff" font-weight="800" font-size="20" text-anchor="middle"><text x="${a}" y="102">${m.n[0]}</text><text x="${b}" y="102">${m.n[0]}</text></g>`;
   s+=`<line x1="${a}" x2="${b}" y1="160" y2="160" stroke="var(--mu)" stroke-width="2"/><text x="300" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">المسافة بين النواتين ≈ ${(ds/100).toFixed(2)}×10⁻¹⁰ m</text>`;
   $('#ks').innerHTML=s;$('#kb').style.width=p+'%';$('#kb').style.background=m.c;const e=Math.round(m.E*p/100);$('#kt').textContent=p>=100?`✓ تفككت الرابطة: طاقة التفكك = ${m.E} kJ/mol`:`طاقة مبذولة حتى الآن: ${e} kJ/mol (من ${m.E})`;
   document.querySelectorAll('#kc button').forEach(x=>x.classList.toggle('on',x.dataset.k===k))};
  $('#kc').innerHTML=Object.keys(B).map(z=>`<button data-k="${z}">${B[z].n} (${B[z].t})</button>`).join('');$('#kc').onclick=e=>{const b=e.target.closest('button');if(b){k=b.dataset.k;d()}};$('#kp').oninput=e=>{p=+e.target.value;d()};
  $('#kx').innerHTML=Object.keys(B).map(z=>`<div><b>${B[z].n}</b> الطول ${B[z].L}<i style="width:${B[z].L/1.43*100}%;background:${B[z].c}"></i>طاقة التفكك ${B[z].E}<i style="width:${B[z].E/945*100}%;background:${B[z].c};opacity:.65"></i></div>`).join('');d()}},
{t:'الطاقة والروابط',h:()=>`
<div class="pn"><h3>اكسر الروابط ثم كوّن روابط جديدة</h3><canvas id="en"></canvas><div class="g2" style="margin-top:8px"><label class="sw">طاقة كسر روابط المتفاعلات<input type="range" id="eb" min="0" max="1000" step="10" value="700" style="flex:1" dir="ltr"><b id="ebv" style="min-width:70px"></b></label><label class="sw">طاقة تكوّن روابط النواتج<input type="range" id="ef" min="0" max="1000" step="10" value="1000" style="flex:1" dir="ltr"><b id="efv" style="min-width:70px"></b></label></div><div class="ctl"><button class="gb" id="p1">🔥 مثال طارد (احتراق)</button><button class="gb" id="p2">❄ مثال ماص</button></div><p id="ec" style="font-weight:800;margin:4px 0"></p><p class="mu" style="margin:0">القيم توضيحية لتفهم الفكرة وليست من الكتاب (بوحدة kJ).</p></div>
<div class="g2"><div class="pn gr"><h3>القاعدة</h3><p>• كسر الروابط <b>يمتص</b> طاقة، وتكوّن الروابط <b>يُطلق</b> طاقة.<br>• <b>التفاعل الماص للطاقة</b>: الطاقة اللازمة لتفكيك روابط المتفاعلات أكبر من الناتجة عن تكوّن روابط النواتج.<br>• <b>التفاعل الطارد للطاقة</b>: الطاقة المنبعثة عند تكوّن روابط النواتج أكبر من اللازمة للتفكيك.</p></div><div class="pn"><figure><img src="${IM.coal}" alt="" style="max-width:220px"><figcaption>الشكل 11-4: احتراق الفحم يكسر روابط C–C وO–O ويكوّن CO₂ مع حرارة وضوء، فهو تفاعل طارد</figcaption></figure></div></div>
${FQ('يكون التفاعل طاردًا للطاقة عندما','الطاقة المنبعثة عند تكوّن الروابط أكبر من اللازمة لكسرها',['الطاقة اللازمة للكسر أكبر من المنبعثة','لا تتكوّن روابط','لا تُكسر روابط'],'الفائض يُطلق حرارة وضوءًا مثل احتراق الفحم.')}${FQ('تفكيك رابطة تساهمية يحتاج إلى','طاقة (تُمتص)',['لا طاقة','انبعاث طاقة','تكوّن رابطة'],'طاقة تفكك الرابطة قيمة موجبة.')}`,
 i:()=>{const x=C2('en',760,380),R=200,sc=.14;let t=0;const eb=$('#eb'),ef=$('#ef');
  const info=()=>{const b=+eb.value,f=+ef.value,n=b-f;$('#ebv').textContent=b+' kJ';$('#efv').textContent=f+' kJ';$('#ec').innerHTML=(n>0?'⬆ تفاعل <b style="color:#ea580c">ماص للطاقة</b>':n<0?'⬇ تفاعل <b style="color:#2563eb">طارد للطاقة</b>':'لا تغيّر صافٍ في الطاقة')+` — ${bd('ΔE = '+b+' − '+f+' = '+(n>0?'+':'')+n+' kJ')}`};
  eb.oninput=ef.oninput=info;$('#p1').onclick=()=>{eb.value=700;ef.value=1000;info()};$('#p2').onclick=()=>{eb.value=1000;ef.value=600;info()};info();
  run(()=>{const b=+eb.value,f=+ef.value,P=R-b*sc,Q=P+f*sc;t=(t+.004)%1.3;x.clearRect(0,0,760,380);x.textAlign='center';x.font='700 14px Tajawal,sans-serif';
   const bar=(a,y,c,l)=>{x.fillStyle=c;x.fillRect(a,y-4,140,8);x.fillStyle='#334155';x.fillText(l,a+70,y+22)};bar(90,R,'#64748b','المتفاعلات');bar(300,P,'#f59e0b','ذرات منفردة');bar(510,Q,Q>R?'#ea580c':'#2563eb','النواتج');
   x.setLineDash([4,4]);x.strokeStyle='#94a3b8';x.beginPath();x.moveTo(230,R);x.lineTo(300,P);x.moveTo(440,P);x.lineTo(510,Q);x.stroke();x.setLineDash([]);
   const ar=(px,y0,y1,c,l)=>{x.strokeStyle=x.fillStyle=c;x.lineWidth=4;x.beginPath();x.moveTo(px,y0);x.lineTo(px,y1);x.stroke();const s=y1<y0?1:-1;x.beginPath();x.moveTo(px,y1);x.lineTo(px-7,y1+s*12);x.lineTo(px+7,y1+s*12);x.fill();x.fillText(l,px,(y0+y1)/2-6)};
   if(b>0)ar(270,R,P,'#ea580c','امتصاص '+b);if(f>0)ar(475,P,Q,'#2563eb','انبعاث '+f);
   ar(700,R,Q,Q>R?'#ea580c':'#2563eb','ΔE '+(b-f>0?'+':'')+(b-f));
   let bx,by;if(t<.4){const u=t/.4;bx=160+u*140;by=R+(P-R)*u}else if(t<.8){const u=(t-.4)/.4;bx=370+u*140;by=P+(Q-P)*u}else{bx=580;by=Q}
   x.fillStyle='#ef4444';x.beginPath();x.arc(bx,by-12,9,0,7);x.fill()})}},
{t:'المختبر: مقارنة درجات الانصهار',h:()=>`
<div class="pn"><h3>سخّن ثلاث مواد ولاحظ</h3><div class="lab" id="lb"></div><div class="plate" id="pl"></div><div class="ctl" dir="ltr"><button class="gb pri" id="hp">🔥 ابدأ التسخين</button><input type="range" id="ht" min="0" max="5" step="0.01" value="0" style="flex:1"><b id="hv" style="min-width:150px"></b></div><p class="mu" style="margin:0">درجات الانصهار وسرعة التسخين تقريبية للتوضيح. هذه محاكاة لتجربة «مقارنة درجات الانصهار» في الكتاب.</p></div>
<div class="pn gr"><h3>الاستنتاج</h3><p>المركبات التساهمية (السكر، شمع البارافين) تنصهر عند درجات منخفضة نسبيًا، أما المركب الأيوني (ملح الطعام NaCl) فدرجة انصهاره مرتفعة جدًا ولم ينصهر في زمن التجربة. فنوع الرابطة يحدد خواص المركب.</p></div>
${FQ('أي المواد انصهر أولًا؟','شمع البارافين',['السكر','ملح الطعام','انصهرت معًا'],'الشمع تساهمي بقوى ضعيفة بين الجزيئات فينصهر عند درجة منخفضة.')}${FQ('المادة التي لم تنصهر ويُستنتج أنها مركب أيوني هي','ملح الطعام NaCl',['السكر','الشمع','الماء'],'المركبات الأيونية درجات انصهارها مرتفعة جدًا.')}${FQ('تكون درجة انصهار المركبات التساهمية عادةً','أقل من المركبات الأيونية',['أعلى من الأيونية','متساوية معها','لا تنصهر أبدًا'],'هذا هو أثر نوع الرابطة في درجة الانصهار.')}`,
 i:()=>{const M=[['شمع البارافين C₂₃H₄₈','تساهمي',50,'#f1f5f9','#fde68a'],['السكر C₁₂H₂₂O₁₁','تساهمي',186,'#fff','#c2832c'],['ملح الطعام NaCl','أيوني',801,'#e2e8f0','#e2e8f0']];
  $('#lb').innerHTML=M.map((m,i)=>`<div class="cell"><div class="blob" id="bl${i}" style="background:${m[3]};border:1px solid #cbd5e1"></div><b>${m[0]}</b><div class="mu">${m[1]} · ينصهر ≈ ${m[2]}°C</div><div id="st${i}" style="font-weight:800"></div></div>`).join('');
  const T=t=>25+250*(1-Math.exp(-t/1.8)),upd=t=>{const c=T(t);$('#ht').value=t;$('#hv').textContent=`${t.toFixed(1)} د · ${Math.round(c)} °C`;$('#pl').style.background=`linear-gradient(90deg,hsl(${Math.max(0,40-c/8)},90%,${35+c/12}%),#ef4444)`;
   M.forEach((m,i)=>{const on=c>=m[2],b=$('#bl'+i);b.classList.toggle('m',on);if(on)b.style.background=m[4];$('#st'+i).textContent=on?'منصهر ✓':'صلب';$('#st'+i).style.color=on?'var(--ok)':'var(--mu)'})};
  $('#ht').oninput=e=>{clearInterval(TM);upd(+e.target.value)};
  $('#hp').onclick=()=>{clearInterval(TM);let t=+$('#ht').value>=5?0:+$('#ht').value;TM=setInterval(()=>{t+=.04;if(t>=5){t=5;clearInterval(TM)}upd(t)},50)};upd(0)}},
{t:'تقويم: الرابطة التساهمية',h:()=>QZ([
['الرابطة التساهمية تنتج عن','مشاركة الذرتين بزوج إلكتروني أو أكثر','انتقال إلكترون من ذرة إلى أخرى','تجاذب أيونين متعاكسين','اندماج نواتين','هذه هي الرابطة التساهمية.'],
['تتكوّن الروابط التساهمية عادةً بين ذرات','اللافلزات','الفلزات فقط','الفلز واللافلز','الغازات النبيلة','المشاركة تحدث بين اللافلزات.'],
['عند أفضل مسافة بين نواتي الذرتين تكون','محصلة التجاذب أكبر من محصلة التنافر','محصلة التنافر أكبر','القوى معدومة','الطاقة أعلى ما يمكن','عندها تكون الطاقة أقل ما يمكن.'],
['كم إلكترونًا تحتاج ذرة الفلور لتحقق القاعدة الثمانية؟','1','2','7','0','للفلور 7 إلكترونات تكافؤ.'],
['عدد الأزواج غير المترابطة على الأكسجين في H₂O','2','1','4','0','O: 6 − 2 = 4 إلكترونات = زوجان.'],
['جزيء CH₄ فيه','أربع روابط أحادية','رابطتان ثنائيتان','رابطة ثلاثية','ثلاث روابط أحادية','الكربون يحتاج 4 إلكترونات.'],
['الرابطة الثلاثية تتكوّن من','سيجما واحدة وباي اثنتين','ثلاث سيجما','سيجما اثنتين وباي واحدة','ثلاث باي','σ واحدة والباقي π.'],
['كلما قصر طول الرابطة','زادت قوتها','ضعفت','لم تتغير','صارت أيونية','علاقة عكسية بين الطول والقوة.'],
['ترتيب طاقة التفكك للجزيئات','N₂ > O₂ > F₂','F₂ > O₂ > N₂','O₂ > N₂ > F₂','متساوية','945 > 498 > 159 kJ/mol.'],
['التفاعل الطارد للطاقة يحدث عندما','الطاقة المنبعثة من تكوّن الروابط أكبر من اللازمة لكسرها','الطاقة اللازمة للكسر أكبر','لا تتكوّن روابط','لا تُكسر روابط','الفائض يُطلق طاقة.']],'اختبر نفسك: الرابطة التساهمية')}];
const GT=[[0,1,2,3],[4,5,6,7]];
GT.forEach((g,k)=>$('#c'+k).innerHTML=g.map(i=>`<button data-i="${i}" class="${SC[i].t.startsWith('تقويم')?'q':''}">${SC[i].t}</button>`).join(''));
let cur=0;function go(i){cur=i;cancelAnimationFrame(RAF);clearInterval(TM);$('#app').innerHTML=SC[i].h();SC[i].i&&SC[i].i();document.querySelectorAll('.ch button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));$('#pb').style.width=(i+1)/SC.length*100+'%';$('#pg').textContent=`${i+1} / ${SC.length}`;$('#pv').style.visibility=i?'':'hidden';$('#nx').style.visibility=i<SC.length-1?'':'hidden';window.scrollTo({top:0})}
document.querySelector('.w').addEventListener('click',e=>{const b=e.target.closest('.ch button');if(b)go(+b.dataset.i)});$('#pv').onclick=()=>go(cur-1);$('#nx').onclick=()=>go(cur+1);(()=>{const f=$('#fl');for(let i=0;i<18;i++){const e=document.createElement('i'),z=4+Math.random()*12;e.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;f.appendChild(e)}})();go(0);
</script></body></html>
