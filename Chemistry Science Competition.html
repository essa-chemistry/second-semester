/* ======================= الفصل 7: الغازات ======================= */
{n:7,name:'الغازات',color:'#0f86c4',badge:['🎈','خبير الغازات'],levels:[
{id:'7-1',title:'قوانين الغازات',sub:'قانون بويل، قانون شارل، قانون جاي-لوساك، القانون العام للغازات',steps:[
 {t:'info',h:'المختبر الافتراضي للغازات',body:'<p>اختر القانون، ثم حرّك المؤشر ولاحظ الكمية التي تبقى ثابتة:</p>',widget:'gaslaw',after:'<div class="key"><b>قانون بويل</b>: يتناسب حجم كمية محددة من الغاز <b>عكسيًّا</b> مع الضغط عند ثبوت درجة الحرارة.<br><b>قانون شارل</b>: يتناسب حجم كمية محددة من الغاز <b>طرديًّا</b> مع درجة الحرارة بالكلفن عند ثبوت الضغط.<br><b>قانون جاي-لوساك</b>: يتناسب ضغط كمية محددة من الغاز <b>طرديًّا</b> مع درجة الحرارة بالكلفن عند ثبوت الحجم.<br>تذكّر: <span class="f">T(K) = T(°C) + 273</span></div>'},
 {t:'num',h:'بويل',body:'<p>عينة من غاز حجمها <span class="f">4.00 L</span> عند ضغط <span class="f">100 kPa</span>. ما حجمها إذا أصبح الضغط <span class="f">200 kPa</span> عند درجة الحرارة نفسها؟</p>',a:2,tol:0.01,unit:'L',exp:'V₂ = P₁V₁ ÷ P₂ = 100 × 4.00 ÷ 200 = <b>2.00 L</b>'},
 {t:'mcq',ch:1,h:'لماذا الكلفن؟',body:'<p>غاز حجمه 2.0 L عند 10 °C. طالب قال: «إذا رفعنا درجة الحرارة إلى 20 °C يتضاعف الحجم إلى 4.0 L». ما الخطأ؟</p>',opts:['يجب التحويل إلى الكلفن: 283 K ← 293 K، فيزداد الحجم زيادة طفيفة فقط','لا خطأ، الحجم يتضاعف','الحجم يقل إلى النصف','الحجم لا يتغير أبدًا مع درجة الحرارة'],a:0,exp:'V₂ = 2.0 × 293 ÷ 283 ≈ 2.07 L. قوانين الغازات تعمل بدرجة الحرارة المطلقة (الكلفن) فقط.'},
 {t:'num',h:'شارل',body:'<p>بالون حجمه <span class="f">3.00 L</span> عند <span class="f">27.0 °C</span>. ما حجمه عند <span class="f">77.0 °C</span> وتحت الضغط نفسه؟</p>',a:3.5,tol:0.01,unit:'L',exp:'T₁ = 300 K، T₂ = 350 K ← V₂ = 3.00 × 350 ÷ 300 = <b>3.50 L</b>',hint:'حوّل الدرجتين إلى الكلفن بإضافة 273.'},
 {t:'num',h:'جاي-لوساك',body:'<p>ضغط غاز في وعاء مغلق صلب <span class="f">1.50 atm</span> عند <span class="f">300 K</span>. ما ضغطه عند <span class="f">360 K</span>؟</p>',a:1.8,tol:0.005,unit:'atm',exp:'P₂ = 1.50 × 360 ÷ 300 = <b>1.80 atm</b>'},
 {t:'mcq',ch:1,h:'علبة الرذاذ',body:'<p>يُكتب على علب الرذاذ: «لا تعرّض العلبة للحرارة». أيّ قانون يفسّر خطورة تسخينها؟</p>',opts:['قانون جاي-لوساك: الحجم ثابت، فيزداد الضغط بارتفاع درجة الحرارة وقد تنفجر','قانون بويل','قانون جراهام','قانون دالتون'],a:0,exp:'حجم العلبة لا يتغير، فارتفاع درجة الحرارة يرفع الضغط داخلها.'},
 {t:'info',h:'القانون العام للغازات',body:'<div class="key">يجمع القوانين الثلاثة في علاقة واحدة لكمية ثابتة من الغاز:<br><span class="f">P₁V₁ ÷ T₁ = P₂V₂ ÷ T₂</span></div>'},
 {t:'num',ch:1,h:'كل شيء يتغير',body:'<p>غاز حجمه <span class="f">5.00 L</span> عند <span class="f">1.00 atm</span> و <span class="f">273 K</span>. ما حجمه عند <span class="f">2.00 atm</span> و <span class="f">546 K</span>؟</p>',a:5,tol:0.01,unit:'L',exp:'V₂ = P₁V₁T₂ ÷ (P₂T₁) = 1.00 × 5.00 × 546 ÷ (2.00 × 273) = <b>5.00 L</b>. تضاعف الضغط فقل الحجم إلى النصف، وتضاعفت درجة الحرارة فتضاعف الحجم؛ فبقي الحجم كما هو!'},
 {t:'sort',h:'ما الثابت في كل قانون؟',body:'',cats:['بويل','شارل','جاي-لوساك'],items:[['درجة الحرارة وكمية الغاز',0],['الضغط وكمية الغاز',1],['الحجم وكمية الغاز',2]],exp:'بويل: T و n ثابتان. شارل: P و n ثابتان. جاي-لوساك: V و n ثابتان.'}
]},
{id:'7-2',title:'قانون الغاز المثالي',sub:'مبدأ أفوجادرو، الحجم المولاري، PV = nRT، الغاز الحقيقي',steps:[
 {t:'info',h:'مبدأ أفوجادرو',body:'<div class="key"><b>مبدأ أفوجادرو</b> (1811م): الحجوم المتساوية من الغازات المختلفة تحتوي العدد نفسه من الجسيمات عند درجة الحرارة والضغط نفسيهما.<br><b>الحجم المولاري</b>: حجم 1 mol من أي غاز في <b>الظروف المعيارية STP</b> (0.00 °C و 1.00 atm) = <span class="f">22.4 L</span></div>'},
 {t:'num',h:'من الحجم إلى المولات',body:'<p>كم مولًا من غاز الأكسجين في <span class="f">11.2 L</span> في الظروف المعيارية STP؟</p>',a:0.5,tol:0.005,unit:'mol',exp:'11.2 ÷ 22.4 = <b>0.500 mol</b>'},
 {t:'num',h:'من المولات إلى الحجم',body:'<p>ما حجم الوعاء اللازم لاحتواء <span class="f">0.0459 mol</span> من غاز النيتروجين في الظروف المعيارية STP؟</p>',a:1.03,tol:0.01,unit:'L',exp:'0.0459 × 22.4 = <b>1.03 L</b>'},
 {t:'mcq',ch:1,h:'بالونان',body:'<p>بالون فيه <span class="f">22.4 L</span> من الهيليوم، وآخر فيه <span class="f">22.4 L</span> من ثاني أكسيد الكربون، وكلاهما في الظروف المعيارية. أيّ العبارات صحيحة؟</p>',opts:['في كل منهما العدد نفسه من الجزيئات (1 mol)، لكن بالون CO₂ أثقل','بالون الهيليوم يحتوي جزيئات أكثر','لهما الكتلة نفسها','بالون CO₂ يحتوي جزيئات أكثر لأن جزيئاته أكبر'],a:0,exp:'حسب مبدأ أفوجادرو العدد متساوٍ، لكن 1 mol من CO₂ كتلته 44 g و 1 mol من He كتلته 4 g فقط.'},
 {t:'info',h:'قانون الغاز المثالي',body:'<div class="key"><span class="f">PV = nRT</span><br>P: الضغط، V: الحجم (L)، n: عدد المولات، T: درجة الحرارة (K)، R: ثابت الغاز المثالي<br><span class="f">R = 0.0821 L·atm/mol·K = 8.314 L·kPa/mol·K = 62.4 L·mm Hg/mol·K</span></div><p>اختر قيمة R التي تتفق وحدة الضغط فيها مع وحدة الضغط في المسألة.</p>'},
 {t:'num',h:'احسب الضغط',body:'<p>ما ضغط <span class="f">2.00 mol</span> من غاز في وعاء حجمه <span class="f">10.0 L</span> عند <span class="f">300 K</span>؟ (<span class="f">R = 0.0821</span>)</p>',a:4.93,tol:0.02,unit:'atm',exp:'P = nRT ÷ V = 2.00 × 0.0821 × 300 ÷ 10.0 = <b>4.93 atm</b>'},
 {t:'num',h:'احسب عدد المولات',body:'<p>كم مولًا من الغاز في إطار حجمه <span class="f">12.0 L</span> وضغطه <span class="f">2.46 atm</span> عند <span class="f">300 K</span>؟</p>',a:1.2,tol:0.01,unit:'mol',exp:'n = PV ÷ RT = 2.46 × 12.0 ÷ (0.0821 × 300) = <b>1.20 mol</b>'},
 {t:'mcq',ch:1,h:'متى يبتعد الغاز عن المثالية؟',body:'<p>في أيّ الظروف يسلك الغاز الحقيقي سلوكًا <b>يختلف كثيرًا</b> عن الغاز المثالي؟</p>',opts:['الضغط المرتفع جدًّا ودرجة الحرارة المنخفضة جدًّا','الضغط المنخفض ودرجة الحرارة المرتفعة','الظروف المعيارية دائمًا','عند أي ضغط إذا كان الغاز غير قطبي'],a:0,exp:'عند الضغط المرتفع تتقارب الجسيمات فيصبح حجمها مهمًّا، وعند درجة الحرارة المنخفضة تبطؤ فتظهر قوى التجاذب. والجزيئات القطبية تنحرف أكثر.'},
 {t:'num',ch:1,h:'كتلة مولية مجهولة',body:'<p>عينة غاز كتلتها <span class="f">8.00 g</span> تشغل <span class="f">5.60 L</span> في الظروف المعيارية STP. ما كتلته المولية؟</p>',a:32,tol:0.1,unit:'g/mol',exp:'n = 5.60 ÷ 22.4 = 0.250 mol ← M = 8.00 ÷ 0.250 = <b>32.0 g/mol</b> (قد يكون O₂).',hint:'احسب عدد المولات من الحجم المولاري أولًا.'}
]},
{id:'7-3',title:'الحسابات المتعلقة بالغازات',sub:'النسب الحجمية في المعادلات، الحسابات بين الحجم والكتلة',steps:[
 {t:'info',h:'المعاملات = نسب حجمية',body:`<div class="key">عند درجة الحرارة والضغط نفسيهما، تمثّل معاملات المعادلة الموزونة <b>نسب الحجوم</b> بين الغازات المتفاعلة والناتجة (حسب مبدأ أفوجادرو).</div><p style="text-align:center">${E('2H2(g) + O2(g) -> 2H2O(g)')}</p><p style="text-align:center">2 L &nbsp;+&nbsp; 1 L &nbsp;→&nbsp; 2 L</p>`},
 {t:'num',h:'احتراق الهيدروجين',body:`<p>${E('2H2(g) + O2(g) -> 2H2O(g)')}: كم لترًا من <span class="f">O₂</span> يلزم لتفاعل <span class="f">5.00 L</span> من <span class="f">H₂</span> تمامًا (عند الظروف نفسها)؟</p>`,a:2.5,tol:0.01,unit:'L',exp:'5.00 L H₂ × (1 ÷ 2) = <b>2.50 L O₂</b>'},
 {t:'num',h:'احتراق الميثان',body:`<p>${E('CH4(g) + 2O2(g) -> CO2(g) + 2H2O(g)')}: ما حجم <span class="f">O₂</span> اللازم لحرق <span class="f">2.0 L</span> من الميثان؟</p>`,a:4,tol:0.01,unit:'L',exp:'2.0 × 2 = <b>4.0 L O₂</b>'},
 {t:'num',h:'إنتاج الأمونيا',body:`<p>${E('N2(g) + 3H2(g) -> 2NH3(g)')}: ما حجم <span class="f">NH₃</span> الناتج من <span class="f">3.00 L</span> من <span class="f">H₂</span> مع نيتروجين كافٍ؟</p>`,a:2,tol:0.01,unit:'L',exp:'3.00 × (2 ÷ 3) = <b>2.00 L NH₃</b>'},
 {t:'mcq',ch:1,h:'متى لا تصلح النسب الحجمية؟',body:`<p>في التفاعل ${E('CaCO3(s) -> CaO(s) + CO2(g)')}، هل يمكن استخدام المعاملات بوصفها نسبًا حجمية بين CaCO₃ و CO₂؟</p>`,opts:['لا؛ النسب الحجمية تصلح بين المواد الغازية فقط','نعم، لكل المواد في أي معادلة','نعم، لأن المعاملات متساوية','لا، لأن المعادلة غير موزونة'],a:0,exp:'CaCO₃ مادة صلبة، فلا ينطبق عليها مبدأ أفوجادرو. نحسب بالمولات والكتلة المولية.'},
 {t:'info',h:'من الكتلة إلى الحجم',body:'<div class="key">كتلة المادة ← <b>÷ الكتلة المولية</b> ← مولات المادة ← <b>× النسبة المولية</b> ← مولات الغاز ← <b>× 22.4 L</b> (في STP) أو <b>PV = nRT</b> ← حجم الغاز</div>'},
 {t:'num',ch:1,h:'كتلة ← حجم',body:`<p>${E('2CO(g) + O2(g) -> 2CO2(g)')}: إذا تفاعل <span class="f">42.7 g</span> من CO (28.01 g/mol) تمامًا في الظروف المعيارية STP، فما حجم <span class="f">CO₂</span> الناتج؟</p>`,a:34.1,tol:0.15,unit:'L',exp:'42.7 ÷ 28.01 = 1.524 mol CO ← 1.524 mol CO₂ (نسبة 2 : 2) ← × 22.4 = <b>34.1 L</b>',hint:'حوّل الكتلة إلى مولات، ثم استخدم النسبة المولية، ثم الحجم المولاري.'},
 {t:'num',ch:1,h:'حجم ← كتلة',body:`<p>${E('2H2(g) + O2(g) -> 2H2O(g)')}: كم جرامًا من الماء ينتج من تفاعل <span class="f">4.48 L</span> من <span class="f">O₂</span> في STP مع هيدروجين كافٍ؟ (H₂O = 18.02 g/mol)</p>`,a:7.21,tol:0.04,unit:'g',exp:'4.48 ÷ 22.4 = 0.200 mol O₂ ← × 2 = 0.400 mol H₂O ← × 18.02 = <b>7.21 g</b>'}

const R={};

  w.innerHTML='<div class="opts">'+ord.map(i=>`<button class="opt" data-i="${i}"><span>${st.opts[i]}</span></button>`).join('')+'</div>';
  const bs=$$('.opt',w);bs.forEach(b=>b.onclick=()=>{if(locked)return;sel=+b.dataset.i;bs.forEach(x=>x.classList.toggle('sel',x===b));bs.forEach(x=>x.classList.remove('bad'));ch()});
  const mark=(i,c)=>bs.find(b=>+b.dataset.i===i).classList.add(c);
  return{ready:()=>sel>=0,check(){locked=true;const ok=sel===st.a;mark(sel,ok?'ok':'bad');return ok},
    unlock(){locked=false},reveal(){locked=true;bs.forEach(b=>b.classList.remove('bad','sel'));mark(st.a,'ok')}}};

  const bs=$$('.opt',w);bs.forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));bs.forEach(x=>x.classList.remove('bad'));ch()});
  return{ready:()=>sel.size>0,check(){locked=true;const ok=sel.size===st.a.length&&st.a.every(i=>sel.has(i));
      if(!ok)bs.forEach(b=>{const i=+b.dataset.i;if(sel.has(i)&&!st.a.includes(i))b.classList.add('bad')});else bs.forEach(b=>{if(sel.has(+b.dataset.i))b.classList.add('ok')});
      return ok?true:{ok:false,hint:st.hint||'اخترت إجابة غير صحيحة، أو فاتتك إجابة صحيحة. فكّر في كل خيار على حدة.'}},
    unlock(){locked=false},reveal(){locked=true;bs.forEach(b=>{const i=+b.dataset.i;b.classList.remove('bad');b.classList.toggle('sel',st.a.includes(i));b.classList.toggle('ok',st.a.includes(i))})}}};
R.sort=(w,st,ch)=>{const items=shuffle(st.items.map((it,i)=>({h:it[0],c:it[1],i})));const ans={};let locked=false;
  w.innerHTML='<div class="sort">'+items.map(it=>`<div class="srow" data-i="${it.i}"><div class="sitem">${it.h}</div><div class="schips">${st.cats.map((c,j)=>`<button class="chip" data-j="${j}">${c}</button>`).join('')}</div></div>`).join('')+'</div>';
  $$('.srow',w).forEach(r=>{const i=+r.dataset.i;$$('.chip',r).forEach(b=>b.onclick=()=>{if(locked||r.classList.contains('ok'))return;ans[i]=+b.dataset.j;$$('.chip',r).forEach(x=>x.classList.toggle('sel',x===b));r.classList.remove('bad');ch()})});

R.num=(w,st,ch)=>{w.innerHTML=`<div class="numwrap"><input class="num" inputmode="decimal" placeholder="?" autocomplete="off"><span class="unit">${st.unit||''}</span></div>`;

  return{ready:()=>!isNaN(toNum(inp.value)),check(){const ok=Math.abs(toNum(inp.value)-st.a)<=st.tol+1e-9;inp.classList.add(ok?'ok':'bad');inp.readOnly=true;return ok},
    unlock(){inp.readOnly=false;inp.classList.remove('bad');inp.select()},reveal(){inp.value=st.a;inp.readOnly=true;inp.classList.remove('bad');inp.classList.add('ok')}}};
R.sci=(w,st,ch)=>{w.innerHTML=`<div class="numwrap"><span class="x10"><input class="num m" inputmode="decimal" placeholder="?" autocomplete="off" style="width:120px;margin-top:0"><span style="margin-top:8px">× 10</span><input class="num sm e" inputmode="numeric" placeholder="?" autocomplete="off" style="font-size:1rem;width:70px;padding:4px"></span><span class="unit">${st.unit||''}</span></div><p class="multi-tip" style="margin-top:8px">اكتب العدد بالترميز العلمي، مثل: 6.02 × 10<sup>23</sup></p>`;
  const m=$('.m',w),e=$('.e',w);[m,e].forEach(i=>i.oninput=()=>{m.classList.remove('bad');e.classList.remove('bad');ch()});
  const val=()=>toNum(m.value)*Math.pow(10,toNum(e.value));
  return{ready:()=>!isNaN(toNum(m.value))&&!isNaN(toNum(e.value)),check(){const v=val(),ok=Math.abs(v-st.a)/st.a<=(st.tol||0.012);[m,e].forEach(i=>{i.classList.add(ok?'ok':'bad');i.readOnly=true});return ok},
    unlock(){[m,e].forEach(i=>{i.readOnly=false;i.classList.remove('bad')})},reveal(){const ex=Math.floor(Math.log10(st.a));m.value=(st.a/Math.pow(10,ex)).toFixed(2);e.value=ex;[m,e].forEach(i=>{i.readOnly=true;i.classList.remove('bad');i.classList.add('ok')})}}};
R.build=(w,st,ch)=>{const tiles=shuffle(st.tiles.map((t,i)=>({t,i})));let picked=[],locked=false;const rtl=st.rtl?' rtl':'';
  w.innerHTML=`<div class="slots${rtl}"></div><div class="bank${rtl}">${tiles.map(o=>`<button class="tile" data-i="${o.i}">${st.rtl?o.t:fx(o.t)}</button>`).join('')}</div>`;
  const slots=$('.slots',w);
  const draw=()=>{slots.innerHTML=picked.length?picked.map((i,k)=>`<button class="tile" data-k="${k}" data-n="${k+1}">${st.rtl?st.tiles[i]:fx(st.tiles[i])}</button>`).join(''):`<span class="ph">${st.rtl?'اضغط العبارات بالأسفل بالترتيب الصحيح':'اضغط البطاقات بالأسفل لتركيب المعادلة'}</span>`;
    $$('.bank .tile',w).forEach(b=>b.classList.toggle('used',picked.includes(+b.dataset.i)));
    $$('.tile',slots).forEach(b=>b.onclick=()=>{if(locked)return;picked.splice(+b.dataset.k,1);slots.classList.remove('bad');draw();ch()})};
  $$('.bank .tile',w).forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;if(picked.includes(i))return;picked.push(i);slots.classList.remove('bad');draw();ch()});
  draw();
  return{ready:()=>picked.length>0,check(){locked=true;const seq=picked.map(i=>st.tiles[i]).join('|');const ok=st.answers.some(a=>a.join('|')===seq);slots.classList.add(ok?'ok':'bad');return ok},
    unlock(){locked=false},reveal(){locked=true;const used=new Set();picked=st.answers[0].map(t=>{const i=st.tiles.findIndex((x,j)=>x===t&&!used.has(j));used.add(i);return i});draw();slots.classList.remove('bad');slots.classList.add('ok')}}};
R.balance=(w,st,ch)=>{const sp=[...st.react.map(f=>({f,side:0})),...st.prod.map(f=>({f,side:1}))];sp.forEach(s=>{s.at=parse(s.f);s.c=1});
  const els=[];sp.forEach(s=>Object.keys(s.at).forEach(e=>{if(!els.includes(e))els.push(e)}));let locked=false;
  const term=(s,k)=>`<span class="sp"><span class="step"><button data-k="${k}" data-d="1">▲</button><b class="c${k}"></b><button data-k="${k}" data-d="-1">▼</button></span><span>${fx(s.f)}</span></span>`;
  let h='';sp.forEach((s,k)=>{if(k>0)h+=`<span>${s.side!==sp[k-1].side?' → ':' + '}</span>`;h+=term(s,k)});
  w.innerHTML=`<div class="bal"><div class="beq">${h}</div><div class="atab"></div><div class="mview"><div class="mside l"></div><div class="marrow">→</div><div class="mside r"></div></div></div>`;
  const molHTML=s=>{let a='';for(const e in s.at)for(let n=0;n<s.at[e];n++)a+=atomDot(e);return`<span class="mol">${a}</span>`};
  const cnt=side=>{const o={};sp.filter(s=>s.side===side).forEach(s=>{for(const e in s.at)o[e]=(o[e]||0)+s.at[e]*s.c});return o};
  const draw=()=>{sp.forEach((s,k)=>{const b=$('.c'+k,w);b.textContent=s.c;b.classList.toggle('one',s.c===1)});
    const L0=cnt(0),R0=cnt(1);
    $('.atab',w).innerHTML=els.map(e=>`<span class="acell ${L0[e]===R0[e]?'eqd':'neq'}">${atomDot(e)} <b>${L0[e]||0}</b> | <b>${R0[e]||0}</b> ${L0[e]===R0[e]?'✓':''}</span>`).join('');
    $('.mside.l',w).innerHTML=sp.filter(s=>s.side===0).map(s=>molHTML(s).repeat(s.c)).join('');
    $('.mside.r',w).innerHTML=sp.filter(s=>s.side===1).map(s=>molHTML(s).repeat(s.c)).join('')};
  $$('.step button',w).forEach(b=>b.onclick=()=>{if(locked)return;const s=sp[+b.dataset.k];s.c=Math.max(1,Math.min(9,s.c+ +b.dataset.d));draw();ch()});
  draw();
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  return{ready:()=>true,check(){locked=true;const L0=cnt(0),R0=cnt(1);const bal=els.every(e=>L0[e]===R0[e]);const g=sp.reduce((a,s)=>gcd(a,s.c),0);
      if(bal&&g===1)return true;return{ok:false,hint:bal?'المعادلة موزونة، لكن المعاملات ليست في أبسط نسبة. اقسمها على عامل مشترك.':'ما زالت بعض العناصر غير متساوية (الخانات الحمراء). عدّل المعاملات.'}},
    unlock(){locked=false},reveal(){locked=true;sp.forEach((s,k)=>s.c=st.a[k]);draw()}}};

/* ============ GAME LOGIC ============ */
const ORDER=[];CH.forEach(c=>c.levels.forEach(l=>{l.ch=c;ORDER.push(l)}));
const LV=id=>ORDER.find(l=>l.id===id);
const idxOf=id=>ORDER.findIndex(l=>l.id===id);
const unlocked=i=>S.unlockAll||i===0||!!S.done[ORDER[i-1].id];
const starsHTML=n=>[0,1,2].map(k=>`<span class="${k<n?'':'off'}">★</span>`).join('');
const totalXP=()=>Object.values(S.done).reduce((a,d)=>a+(d.xp||0),0);
const RANKS=[[0,'كيميائي مبتدئ','🧪'],[250,'مستكشف المادة','🔍'],[600,'محلّل بارع','⚗️'],[1100,'باحث في الذرّة','⚛️'],[1600,'خبير التفاعلات','🔥'],[2100,'عالِم كيمياء','🏅']];
function rankOf(xp){let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null}}return{r,nx}}
const chDone=c=>c.levels.every(l=>S.done[l.id]);

  document.onkeydown=null;
  const xp=totalXP(),{r,nx}=rankOf(xp);const totalStars=Object.values(S.done).reduce((a,d)=>a+d.stars,0),nDone=Object.keys(S.done).length;
  const cur=ORDER.findIndex((l,i)=>!S.done[l.id]&&unlocked(i));
  let z=0;
  app.innerHTML=`<div class="home">
   <div class="topbar"><div class="brand"><span class="logo">C2</span>رحلة الكيمياء ٢-١</div><button class="iconbtn" id="gear" aria-label="الإعدادات">⚙</button></div>
   <div class="hero"><h1>${S.name?`أهلًا ${esc(S.name)} 👋<br>`:''}الفصل الدراسي الأول كاملًا في ${ORDER.length} مستوى</h1><p>جرّب، توقّع، ثم فكّر بعمق. أسئلة 🧠 تمنحك نقاطًا مضاعفة، وفي نهاية كل فصل تحدٍّ 🏆 بثلاثة قلوب.</p></div>
   <div class="rankcard"><div class="rt"><div><small>رتبتك</small><div class="rname">${r[2]} ${r[1]}</div></div><div style="text-align:left"><small>نقاطك</small><div class="rname f">⚡ ${xp}</div></div></div>

   <div class="badges">${CH.map(c=>`<span class="badge ${chDone(c)?'got':''}"><i>${c.badge[0]}</i>${c.badge[1]}</span>`).join('')}</div>

function report(){const xp=totalXP();const lines=[`رحلة الكيمياء ٢-١ — تقرير تقدّم`,`الطالب: ${S.name||'—'}`,`النقاط: ${xp} — الرتبة: ${rankOf(xp).r[1]}`,`المستويات المكتملة: ${Object.keys(S.done).length}/${ORDER.length}`,`النجوم: ${Object.values(S.done).reduce((a,d)=>a+d.stars,0)}/${ORDER.length*3}`,''];
  ORDER.forEach(l=>{const d=S.done[l.id];lines.push(`${d?'✓':'·'} ${l.boss?'🏆':l.id} ${l.title}${d?' '+'★'.repeat(d.stars)+'☆'.repeat(3-d.stars):''}`)});

  m.onclick=e=>{if(e.target===m)m.remove()};
  $('.sv',m).onclick=()=>{S.name=$('input',m).value.trim().slice(0,40);$$('.sw',m).forEach(b=>S[b.dataset.k]=b.classList.contains('on'));save();applyMotion();m.remove();home()};
  $('.rs',m).onclick=e=>{if(!armed){armed=true;e.target.textContent='اضغط مرة أخرى للتأكيد';return}S.done={};save();m.remove();home()};
}

function lesson(id){
  const lv=LV(id),steps=lv.steps,boss=!!lv.boss;let si=0,ctl=null,phase='answer',tries=0,streak=0,best=0,hearts=3,ended=false;
  const stats={graded:0,clean:0,mistakes:0,xp:0};
  app.innerHTML=`<div class="lesson" style="--ac:${lv.ch.color}">
   <header class="ltop"><button class="x" aria-label="خروج">✕</button><div class="prog"><i></i></div>${boss?'<span class="lhp"></span>':''}<span class="lst">🔥 <b>0</b></span><span class="lxp">⚡ <b>0</b></span></header>
   <main class="stage"><div class="card"></div></main>
   <footer class="act"><div class="fb"></div><div class="btns"><div class="btnsin"></div></div></footer></div>`;
  const card=$('.card',app),fb=$('.fb',app),btns=$('.btnsin',app),bar=$('.prog i',app),xpEl=$('.lxp b',app),stEl=$('.lst',app),hpEl=$('.lhp',app);
  const drawHP=()=>{if(hpEl)hpEl.textContent='❤'.repeat(hearts)+'♡'.repeat(3-hearts)};drawHP();
  $('.x',app).onclick=home;
  document.onkeydown=e=>{if(e.key==='Enter'&&!document.querySelector('.modal')){const p=$('.pbtn',btns);if(p&&!p.disabled){e.preventDefault();p.click()}}};
  function setBtns(arr){btns.innerHTML='';arr.forEach(([txt,cls,fn,dis])=>{const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;if(dis)b.disabled=true;btns.appendChild(b)})}
  function feedback(kind,title,html,tag){fb.innerHTML=`<div class="fbin ${kind}"><h3>${title}${tag?`<small>${tag}</small>`:''}</h3>${html?`<p>${html}</p>`:''}</div>`}
  function show(){
    const st=steps[si];phase='answer';tries=0;fb.innerHTML='';
    bar.style.width=(si/steps.length*100)+'%';
    card.style.animation='none';void card.offsetWidth;card.style.animation='';
    card.innerHTML=`<div class="kicker">${boss?'🏆 تحدّي الفصل '+lv.ch.n:'الدرس '+lv.id+' · '+lv.title}${st.ch?'<span class="chal">🧠 تفكير عميق · نقاط ×2</span>':''}</div><h2>${st.h}</h2><div class="body">${st.body||''}</div><div class="wid"></div><div class="w"></div>${st.after?`<div class="body after">${st.after}</div>`:''}`;
    window.scrollTo({top:0,behavior:S.motion?'smooth':'auto'});
    window.__cur=st;
    if(st.widget)W[st.widget]($('.wid',card));
    if(st.t==='info'){ctl=null;setBtns([['متابعة','pbtn',next]]);return}
    ctl=R[st.t]($('.w',card),st,refresh);refresh();
  }
  function refresh(){if(phase!=='answer')return;setBtns([['تحقّق','pbtn',check,!ctl.ready()]])}
  function check(){const st=steps[si];const r=ctl.check();const ok=r===true||(r&&r.ok);const hint=(r&&r.hint)||st.hint||'راجع إجابتك وحاول مرة أخرى.';
    tries++;
    if(ok){let gain=tries===1?10:5;if(st.ch)gain*=2;if(tries===1){streak++;best=Math.max(best,streak)}else streak=0;
      let bonus=streak>=3&&tries===1?5:0;gain+=bonus;stats.xp+=gain;xpEl.textContent=stats.xp;stats.graded++;if(tries===1)stats.clean++;
      stEl.querySelector('b').textContent=streak;if(streak>=2){stEl.classList.remove('hot');void stEl.offsetWidth;stEl.classList.add('hot')}
      (streak>=3&&tries===1?SFX.streak:SFX.ok)();
      phase='done';const title=tries===1?(streak>=3?pick(['سلسلة نارية! 🔥','لا يمكن إيقافك! 🔥','تفكير حاد! 🔥']):pick(['ممتاز! 🎉','أحسنت! ✨','إجابة صحيحة! 👏','رائع! 💡'])):'صحيح هذه المرة 👍';
      feedback('ok',title,st.exp,`+${gain} نقطة${bonus?' (منها مكافأة سلسلة)':''}`);
      setBtns([['متابعة','pbtn ok',next]])}
    else{SFX.bad();if(tries===1)stats.mistakes++;streak=0;stEl.querySelector('b').textContent=0;
      if(boss){hearts--;drawHP();setTimeout(()=>SFX.heart(),250);hpEl.classList.remove('hit');void hpEl.offsetWidth;hpEl.classList.add('hit');
        if(hearts<=0){phase='dead';feedback('bad','نفدت القلوب 💔','لا بأس — التحدي صُمّم ليكون صعبًا. راجع دروس الفصل ثم حاول مجددًا.');setBtns([['أعد التحدي','pbtn',()=>lesson(id)],['الخريطة','sbtn',home]]);return}}
      phase='wrong';feedback('bad','ليس تمامًا…',hint,boss?`بقي ${hearts} ❤`:'');
      setBtns([['حاول مجددًا','pbtn',retry],['أظهر الحل','sbtn',reveal]])}}
  function retry(){phase='answer';fb.innerHTML='';ctl.unlock();refresh()}
  function reveal(){const st=steps[si];ctl.reveal();stats.graded++;phase='done';feedback('info','الحل الصحيح',st.exp);setBtns([['متابعة','pbtn',next]])}
  function next(){if(ended)return;SFX.next();si++;if(si>=steps.length){ended=true;bar.style.width='100%';btns.innerHTML='';fb.innerHTML='';setTimeout(()=>finish(id,stats,{best,hearts,boss}),S.motion?350:0)}else show()}
  show();
}

function confetti(){if(!S.motion)return;const c=document.createElement('div');c.className='confetti';const cols=['#f2b01e','#e04848','#3b78e7','#17905a','#8a5cf0'];
  for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=pick(cols);e.style.animationDelay=Math.random()*.8+'s';c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}

function finish(id,stats,o){document.onkeydown=null;
  const lv=LV(id);const m=stats.mistakes;const stars=o.boss?o.hearts:(m===0?3:m<=2?2:1);const acc=stats.graded?Math.round(stats.clean/stats.graded*100):100;
  const prev=S.done[id];const chWas=chDone(lv.ch);const rankWas=rankOf(totalXP()).r[1];
  S.done[id]={stars:Math.max(stars,prev?prev.stars:0),xp:Math.max(stats.xp,prev?prev.xp:0)};save();
  const newBadge=!chWas&&chDone(lv.ch);const rankNow=rankOf(totalXP()).r;const rankUp=rankNow[1]!==rankWas;
  const i=idxOf(id),nextL=ORDER[i+1];const allDone=Object.keys(S.done).length===ORDER.length;
  app.innerHTML=`<div class="result" style="--ac:${lv.ch.color}">
    <div class="rstars">${starsHTML(stars)}</div>
    <h2>${stars===3?'أداء مثالي!':stars===2?'عمل رائع!':'أحسنت، أكملت المستوى!'}</h2>
    <p style="color:var(--muted);margin:0">${lv.boss?'🏆 تحدّي الفصل '+lv.ch.n:'الدرس '+lv.id+': '+lv.title}</p>
    <div class="rgrid"><div><b>⚡ ${stats.xp}</b><small>نقطة</small></div><div><b>${acc}%</b><small>صحيحة من أول محاولة</small></div><div><b>🔥 ${o.best}</b><small>أطول سلسلة</small></div></div>
    ${rankUp?`<div class="newbadge"><div style="font-size:2rem">${rankNow[2]}</div><b>ترقّيت إلى رتبة: ${rankNow[1]}!</b></div>`:''}
    ${newBadge?`<div class="newbadge"><div style="font-size:2rem">${lv.ch.badge[0]}</div><b>حصلت على وسام «${lv.ch.badge[1]}»</b><br><small>أتممت الفصل ${lv.ch.n}: ${lv.ch.name}</small></div>`:''}
    ${stars<3?`<p style="color:var(--muted)">${o.boss?'للحصول على 3 نجوم: أنهِ التحدي دون أن تخسر أي قلب.':'للحصول على 3 نجوم: أجب عن كل الأسئلة صحيحًا من المحاولة الأولى.'}</p>`:''}
    ${allDone?`<div class="cert"><div style="font-size:2.4rem">🎓</div><h3>شهادة إتمام رحلة الكيمياء ٢-١</h3><p style="margin:8px 0">${S.name?`يُشهد بأن الطالب <b>${esc(S.name)}</b> أتمّ`:'أتممت'} جميع مستويات الفصل الدراسي الأول بنجاح<br>⭐ ${Object.values(S.done).reduce((a,d)=>a+d.stars,0)} / ${ORDER.length*3} — ⚡ ${totalXP()} نقطة — ${rankNow[2]} ${rankNow[1]}</p><small style="color:var(--muted)">معلم المادة: عيسى حبيب الخلف — مدرسة الفيصلية الثانوية</small></div>`:''}
    <div class="mfoot" style="flex-direction:column">${nextL?`<button class="pbtn nx">التالي: ${nextL.boss?'🏆 '+nextL.title:nextL.id+' '+nextL.title} ←</button>`:''}<button class="sbtn rp">إعادة المستوى</button><button class="sbtn hm">خريطة المستويات</button></div></div>`;
  window.scrollTo(0,0);SFX.win();if(stars===3||newBadge||allDone)confetti();
  const nx=$('.nx',app);if(nx)nx.onclick=()=>lesson(nextL.id);
  $('.rp',app).onclick=()=>lesson(id);$('.hm',app).onclick=home;
}
home();
</script>
</body>
</html>
