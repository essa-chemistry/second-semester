<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة الكيمياء ٢-١ — الفصل الدراسي الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16161a; --muted:#6a6a75; --line:#e7e6e1; --bg:#f7f6f2; --card:#fff;
  --ok:#17905a; --okbg:#e7f6ee; --bad:#cf3f3f; --badbg:#fcecec; --info:#2f5fd0; --infobg:#eaf0fd;
  --ac:#3b6fe0; --gold:#e9a90b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:19px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit}
sub,sup{font-size:.7em;line-height:0}
.f,.eq{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;unicode-bidi:isolate;direction:ltr;display:inline-block;white-space:nowrap}
.eq{font-size:1.02em;padding:2px 10px;background:#f2f1ec;border-radius:8px;margin:2px 0;max-width:100%;overflow-x:auto;vertical-align:middle}
.nuc{display:inline-flex;align-items:center;direction:ltr;font-family:"Segoe UI",Arial,sans-serif}
.nz{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.6em;line-height:1.1;margin-right:1px}
.nz sup,.nz sub{font-size:1em;line-height:1.1;vertical-align:baseline;position:static}
.nomo *, .nomo *::before, .nomo *::after{animation:none!important;transition:none!important}

/* ---------- HOME ---------- */
.home{max-width:720px;margin:0 auto;padding:22px 18px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;font-weight:700;font-size:15px}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:20px}
.hero{margin:22px 0 8px}
.hero h1{font-size:1.9rem;line-height:1.4;margin:0 0 6px;font-weight:700}
.hero p{margin:0;color:var(--muted)}
.rankcard{background:var(--ink);color:#fff;border-radius:20px;padding:16px 18px;margin:18px 0 8px}
.rankcard .rt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rankcard .rname{font-size:1.25rem;font-weight:700}
.rankcard small{opacity:.75}
.rbar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:10px}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd45c,#ff9d3c);border-radius:99px}
.stats{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;gap:6px;align-items:center;font-weight:600;font-size:.95rem}
.stat small{color:var(--muted);font-weight:500}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:flex;align-items:center;gap:6px;border-radius:99px;padding:2px 12px 2px 4px;font-size:.85rem;background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.badge i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ecebe6;filter:grayscale(1);opacity:.6}
.badge.got{color:var(--ink);border-color:var(--gold);background:#fff8e6}
.badge.got i{background:#ffe7a3;filter:none;opacity:1}
.copyrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chap{margin:34px 0 14px;display:flex;align-items:center;gap:12px}
.chap .cn{flex:0 0 auto;font-weight:700;background:var(--c);color:#fff;border-radius:12px;padding:2px 12px;font-size:.9rem}
.chap h3{margin:0;font-size:1.2rem;flex:1}
.chap span{color:var(--muted);font-size:.9rem;font-family:Segoe UI,Arial,sans-serif}
.path{display:flex;flex-direction:column;gap:16px}
.node{display:flex;align-items:center;gap:16px;background:transparent;border:0;text-align:right;padding:0;width:100%}
.node.z1{padding-right:40px}.node.z2{padding-right:80px}.node.z3{padding-right:40px}
.disc{flex:0 0 auto;width:70px;height:70px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.25rem;font-weight:700;font-family:Segoe UI,Arial,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s;direction:ltr}
.node.boss .disc{background:linear-gradient(160deg,#ffd45c,#e39a06);font-size:1.8rem;width:78px;height:78px;border-radius:24px}
.node:not([disabled]):hover .disc{transform:translateY(-2px)}
.node:not([disabled]):active .disc{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.node[disabled]{cursor:not-allowed}
.node[disabled] .disc{background:#d9d8d2;color:#8f8e88;box-shadow:0 6px 0 #c5c4be}
.ninfo{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:9px 15px}
.ninfo b{display:block;font-size:1.03rem}
.ninfo span{color:var(--muted);font-size:.88rem}
.node.boss .ninfo{border-color:#f3d27a;background:#fffaf0}
.nstars{font-size:.95rem;letter-spacing:2px;color:#f2b01e}
.nstars .off{color:#dddcd6}
.node.current .ninfo{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.tag{display:inline-block;font-size:.72rem;background:var(--c);color:#fff;border-radius:99px;padding:0 10px;margin-inline-start:6px;vertical-align:middle}

/* ---------- LESSON ---------- */
.lesson{min-height:100vh;display:flex;flex-direction:column}
.ltop{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 18px;max-width:760px;width:100%;margin:0 auto}
.x{border:0;background:transparent;font-size:22px;width:40px;height:40px;border-radius:10px;color:var(--muted)}
.x:hover{background:#ecebe6}
.prog{flex:1;height:12px;background:#e4e3dd;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .4s ease}
.lxp,.lst,.lhp{font-weight:700;font-family:Segoe UI,Arial,sans-serif;font-size:15px;white-space:nowrap}
.lst{color:#e2620b}
.lst.hot{animation:pulse .5s ease}
@keyframes pulse{50%{transform:scale(1.35)}}
.lhp{color:#e0344a;letter-spacing:1px}
.lhp.hit{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.stage{flex:1;max-width:760px;width:100%;margin:0 auto;padding:6px 18px 230px}
.card{animation:cardIn .35s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kicker{color:var(--ac);font-weight:700;font-size:.88rem;margin-bottom:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chal{background:#2b2350;color:#ffd45c;border-radius:99px;padding:0 10px;font-size:.78rem}
.card h2{font-size:1.5rem;line-height:1.45;margin:0 0 10px;font-weight:700}
.body p{margin:0 0 12px}
.body ul,.body ol{margin:0 0 12px;padding-inline-start:22px}
.note{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
.key{background:color-mix(in srgb,var(--ac) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--ac) 30%,#fff);border-radius:14px;padding:12px 16px;margin:10px 0}
.dt{border-collapse:collapse;margin:8px 0 12px;background:#fff;border-radius:12px;overflow:hidden;font-size:.95rem;width:100%}
.dt th,.dt td{border:1px solid var(--line);padding:5px 10px;text-align:center}
.dt th{background:#f2f1ec}
.dt td.n{font-family:Segoe UI,Arial,sans-serif;direction:ltr}
.wid{margin-top:12px}
.w{margin-top:14px}

.opts{display:grid;gap:10px}
.opt{text-align:right;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 16px;box-shadow:0 3px 0 var(--line);transition:border-color .15s,transform .1s;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:#cfcec7}
.opt.sel{border-color:var(--ac);box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 45%,#fff)}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:0 3px 0 #b6e2c9}
.opt.bad{border-color:var(--bad);background:var(--badbg);box-shadow:0 3px 0 #f0c0c0}
.opt .bx{flex:0 0 auto;width:22px;height:22px;border:2px solid #c9c8c1;border-radius:6px;margin-top:5px;display:grid;place-items:center;font-size:14px;color:#fff}
.opt.sel .bx{background:var(--ac);border-color:var(--ac)}
.multi-tip{color:var(--muted);font-size:.9rem;margin:-4px 0 8px}

.sort{display:grid;gap:10px}
.srow{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.srow.ok{border-color:var(--ok);background:var(--okbg)}
.srow.bad{border-color:var(--bad);background:var(--badbg)}
.sitem{font-weight:600;margin-bottom:6px}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fafaf8;border-radius:99px;padding:2px 14px;font-size:.92rem}
.chip.sel{background:var(--ac);border-color:var(--ac);color:#fff}

.numwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.num{font-size:1.35rem;width:170px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;text-align:center;direction:ltr;font-family:Segoe UI,Arial,sans-serif;background:#fff}
.num.sm{width:90px}
.num:focus{outline:none;border-color:var(--ac)}
.num.ok{border-color:var(--ok);background:var(--okbg)}
.num.bad{border-color:var(--bad);background:var(--badbg)}
.unit{font-family:Segoe UI,Arial,sans-serif;font-size:1.15rem;color:var(--muted);direction:ltr}
.x10{font-family:Segoe UI,Arial,sans-serif;font-size:1.3rem;display:flex;align-items:flex-start;gap:4px}
.x10 .num{margin-top:-14px}

.slots{min-height:64px;background:#fff;border:2px dashed #cfcec7;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;direction:ltr;justify-content:center}
.slots.rtl{direction:rtl;flex-direction:column;align-items:stretch}
.slots.ok{border-color:var(--ok);border-style:solid;background:var(--okbg)}
.slots.bad{border-color:var(--bad);border-style:solid;background:var(--badbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;direction:ltr;justify-content:center}
.bank.rtl{direction:rtl;flex-direction:column;align-items:stretch}
.tile{font-family:Segoe UI,Arial,sans-serif;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-size:1.1rem;box-shadow:0 3px 0 var(--line);direction:ltr}
.rtl .tile{font-family:inherit;direction:rtl;text-align:right;font-size:1rem}
.slots.rtl .tile::before{content:attr(data-n);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font-size:.8rem;margin-inline-end:8px;font-family:Segoe UI,Arial,sans-serif}
.tile.used{display:none}
.slots .tile{animation:pop .2s ease}
@keyframes pop{from{transform:scale(.7)}to{transform:none}}
.ph{color:#a9a8a1;font-size:.95rem;direction:rtl;text-align:center}

/* balance */
.bal{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px}
.beq{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;direction:ltr;font-family:Segoe UI,Arial,sans-serif;font-size:1.22rem}
.sp{display:flex;align-items:center;gap:4px}
.step{display:flex;flex-direction:column;align-items:center}
.step button{border:1.5px solid var(--line);background:#fafaf8;width:34px;height:24px;line-height:1;border-radius:8px;font-size:14px;padding:0}
.step b{font-size:1.4rem;min-width:28px;text-align:center;color:var(--ac)}
.step b.one{color:#bdbcb5}
.atab{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.acell{border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;font-family:Segoe UI,Arial,sans-serif;font-size:1rem;direction:ltr;display:flex;gap:8px;align-items:center;background:#fafaf8}
.acell.eqd{border-color:var(--ok);background:var(--okbg)}
.acell.neq{border-color:#f0b4b4;background:#fdf3f3}
.mview{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px;direction:ltr}
.mside{min-height:80px;background:#f7f6f2;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center}
.mol{display:flex;flex-wrap:wrap;max-width:96px;gap:1px;padding:3px;border-radius:10px;background:#fff;border:1px solid var(--line);animation:pop .25s ease;justify-content:center}
.at{width:18px;height:18px;border-radius:50%;font-size:8.5px;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;font-weight:700;color:#fff;border:1px solid rgba(0,0,0,.18)}
.marrow{font-size:1.6rem;color:var(--muted)}

/* widgets */
.wbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fafaf8;border-radius:99px;padding:3px 14px;font-size:.95rem}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.rd{background:#f7f6f2;border-radius:12px;padding:8px 12px}
.rd small{display:block;color:var(--muted);font-size:.82rem}
.rd b{font-family:Segoe UI,Arial,sans-serif;font-size:1.3rem;direction:ltr;display:inline-block}
.meter{height:14px;background:#ecebe6;border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#f4f7fd}
.pst{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;gap:10px;flex-wrap:wrap}
.pst b{font-size:1.12rem}
.btn2{border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:4px 16px;font-weight:600}
.btn2.dark{background:var(--ink);color:#fff}
table.log{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
table.log td,table.log th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:center}
table.log td{font-family:Segoe UI,Arial,sans-serif}
.goldbar{height:46px;border-radius:8px;background:linear-gradient(180deg,#f8d867,#d9a514 60%,#b78a0c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .25s}
.goldwrap{background:#f7f6f2;border-radius:12px;padding:16px;margin:10px 0;display:flex;justify-content:flex-start;direction:ltr}
.flaskw{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center}
@media(max-width:520px){.flaskw{grid-template-columns:1fr}.flaskw svg{max-width:170px;margin:auto}}
.balloon{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.35);transition:transform 1.8s ease}
.balloon.big{transform:scale(1)}
.bub{opacity:0}
.reacting .bub{animation:bub 1s infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.escape{opacity:0}
.reacting.open .escape{animation:esc 1.4s infinite}
@keyframes esc{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px)}}
.scale{font-family:"Courier New",monospace;background:#16161a;color:#7dfca0;border-radius:10px;padding:6px 14px;font-size:1.5rem;direction:ltr;display:inline-block;letter-spacing:1px}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:8px;direction:ltr;font-family:Segoe UI,Arial,sans-serif;font-size:.85rem;color:#fff;font-weight:700}
.stack div{display:grid;place-items:center}
.symchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.symchips button{font-family:Segoe UI,Arial,sans-serif;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 16px;font-size:1.15rem;box-shadow:0 3px 0 var(--line)}
.symchips button.on{border-color:var(--ac);box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 45%,#fff)}
.symout{margin-top:12px;min-height:52px;background:#f7f6f2;border-radius:12px;padding:10px 14px}
.rstage{position:relative;height:190px;background:#f7f6f2;border-radius:14px;overflow:hidden;direction:ltr;margin-top:10px}
.ratom{position:absolute;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Segoe UI,Arial,sans-serif;font-weight:700;border:2px solid rgba(0,0,0,.15);transition:left .9s ease,top .9s ease}
.rlbl{position:absolute;font-family:Segoe UI,Arial,sans-serif;font-size:24px;color:var(--muted);transition:opacity .4s}
.rcap{text-align:center;margin-top:8px;min-height:30px;color:var(--muted)}
.series{direction:ltr;font-family:Segoe UI,Arial,sans-serif;font-size:.95rem;background:#f7f6f2;border-radius:10px;padding:8px 12px;display:block;text-align:center;line-height:1.9}
.abuild{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
@media(max-width:560px){.abuild{grid-template-columns:1fr}}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ctr .cb{display:flex;align-items:center;gap:6px;direction:ltr}
.ctr .cb button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fafaf8;font-size:18px;padding:0}
.ctr .cb b{min-width:30px;text-align:center;font-family:Segoe UI,Arial,sans-serif;font-size:1.25rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-inline-end:6px}
.ecard{text-align:center;background:#f7f6f2;border-radius:16px;padding:10px}
.ecard .big{font-size:2.6rem;font-family:Segoe UI,Arial,sans-serif;font-weight:700;line-height:1.1;direction:ltr}
.spin{transform-origin:110px 110px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--ac);display:block;animation:pop .2s ease}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px;direction:ltr}
.flow .bxx{background:#f7f6f2;border-radius:12px;padding:6px 12px;text-align:center;min-width:110px}
.flow .bxx b{display:block;font-family:Segoe UI,Arial,sans-serif;font-size:1.15rem}
.flow .bxx small{color:var(--muted)}
.flow .op{font-family:Segoe UI,Arial,sans-serif;font-size:.8rem;color:var(--ac);text-align:center}
.drawp{stroke-dasharray:900;stroke-dashoffset:900;animation:drawp 1.4s ease forwards}
@keyframes drawp{to{stroke-dashoffset:0}}

/* footer actions */
.act{position:fixed;bottom:0;left:0;right:0;z-index:10}
.fb{max-width:760px;margin:0 auto;padding:0 18px}
.fbin{border-radius:18px 18px 0 0;padding:14px 18px 6px;animation:up .25s ease;max-height:45vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.fbin.ok{background:var(--okbg);color:#0d5e3a}
.fbin.bad{background:var(--badbg);color:#8a2424}
.fbin.info{background:var(--infobg);color:#1d3f8f}
.fbin h3{margin:0 0 4px;font-size:1.15rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbin h3 small{font-family:Segoe UI,Arial,sans-serif;font-size:.8rem;background:rgba(255,255,255,.7);border-radius:99px;padding:0 10px}
.fbin p{margin:0 0 6px;color:var(--ink);font-size:.97rem}
.btns{background:var(--bg);border-top:1.5px solid var(--line)}
.btnsin{max-width:760px;margin:0 auto;padding:12px 18px 16px;display:flex;gap:10px}
.fb:has(.fbin) + .btns{border-top:0}
.pbtn{flex:1;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:1.08rem;background:var(--ink);color:#fff;box-shadow:0 4px 0 #000}
.pbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.pbtn[disabled]{background:#d9d8d2;color:#97968f;box-shadow:0 4px 0 #c6c5bf;cursor:not-allowed}
.pbtn.ok{background:var(--ok);box-shadow:0 4px 0 #0e6a41}
.sbtn{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-weight:600}

/* result */
.result{max-width:560px;margin:0 auto;padding:50px 20px;text-align:center}
.rstars{font-size:3.4rem;letter-spacing:8px;color:#f2b01e}
.rstars .off{color:#dddcd6}
.rstars span{display:inline-block;animation:star .5s ease backwards}
.rstars span:nth-child(2){animation-delay:.15s}.rstars span:nth-child(3){animation-delay:.3s}
@keyframes star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result h2{font-size:1.75rem;margin:10px 0 4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:22px 0}
.rgrid div{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px}
.rgrid b{display:block;font-size:1.45rem;font-family:Segoe UI,Arial,sans-serif}
.rgrid small{color:var(--muted);font-size:.82rem}
.newbadge{background:#fff8e6;border:2px solid var(--gold);border-radius:18px;padding:14px;margin:14px 0;animation:cardIn .5s ease}
.cert{background:#fff;border:3px double var(--ink);border-radius:18px;padding:22px;margin:24px 0}
.cert h3{margin:0;font-size:1.45rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,24,.45);display:grid;place-items:center;z-index:50;padding:18px}
.mbox{background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%;animation:cardIn .25s ease;max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 10px}
.mbox input[type=text]{width:100%;font-size:1.1rem;padding:8px 12px;border:2px solid var(--line);border-radius:12px}
.mbox textarea{width:100%;height:220px;font-size:.9rem;border:2px solid var(--line);border-radius:12px;padding:8px;direction:rtl}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.sw{width:50px;height:28px;border-radius:99px;background:#d9d8d2;border:0;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s}
.sw.on{background:var(--ok)}
.sw.on::after{right:25px}
.mfoot{display:flex;gap:10px;margin-top:16px}
.danger{color:var(--bad);border-color:#f0c0c0!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ STATE ============ */
const KEY='chem21-journey-v1';
let S={done:{},name:'',motion:true,sound:true,unlockAll:false,seenIntro:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyMotion(){document.body.classList.toggle('nomo',!S.motion)}
applyMotion();
const SFX=(()=>{let ctx=null;
  const get=()=>{if(S.sound===false)return null;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}};
  function tone(f,t0,d,type,g,f2){const c=get();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),a=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(g||.1,t+0.012);a.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(a);a.connect(c.destination);o.start(t);o.stop(t+d+0.03)}
  return{tap(){tone(1046,0,.05,'sine',.035)},
    ok(){tone(784,0,.12,'triangle',.11);tone(1175,.08,.24,'triangle',.1)},
    streak(){tone(784,0,.09,'triangle',.09);tone(988,.07,.09,'triangle',.09);tone(1319,.14,.28,'triangle',.11)},
    bad(){tone(311,0,.14,'triangle',.1,262);tone(233,.11,.22,'triangle',.08,196)},
    heart(){tone(196,0,.3,'sawtooth',.05,130)},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.28,'triangle',.1));tone(1568,.42,.5,'sine',.06)},
    next(){tone(660,0,.04,'sine',.03)}}})();
document.addEventListener('pointerdown',e=>{if(e.target.closest('.opt,.chip,.tile,.step button,.cb button,.seg button,.symchips button,.grid button,.sw'))SFX.tap()},true);
const app=document.getElementById('app');
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* formula helpers */
const fx=s=>s.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
const F=s=>`<span class="f">${fx(s)}</span>`;
const E=s=>`<span class="eq">${fx(s).replace(/->/g,'→')}</span>`;
const NU=(A,Z,X)=>`<span class="nuc"><span class="nz"><sup>${A}</sup><sub>${Z}</sub></span>${X}</span>`;
const NE=(...parts)=>`<span class="eq">${parts.join(' ')}</span>`;
const SCI=(m,e)=>`<span class="f">${m} × 10<sup>${e}</sup></span>`;
const TB=(head,rows)=>`<table class="dt"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</table>`;
function parse(f){let i=0;
  const num=()=>{const m=f.slice(i).match(/^\d+/);if(m){i+=m[0].length;return +m[0]}return 1};
  const grp=()=>{const o={};while(i<f.length&&f[i]!==')'){
      if(f[i]==='('){i++;const g=grp();i++;const n=num();for(const k in g)o[k]=(o[k]||0)+g[k]*n}
      else{const m=f.slice(i).match(/^[A-Z][a-z]?/);if(!m){i++;continue}i+=m[0].length;const n=num();o[m[0]]=(o[m[0]]||0)+n}
    }return o};
  return grp();}
const ACOL={H:'#c9ccd3',O:'#e04848',C:'#3a3f4a',N:'#3b78e7',Al:'#8e98a8',Cu:'#d07a1a',Ag:'#a6b2c2',Cl:'#2fb36a',Fe:'#a8611c',Na:'#8a5cf0',S:'#e2b714',Zn:'#6f7a8a',Ca:'#4fa39b',K:'#b65ee0',Mg:'#5aa1d8'};
const atomDot=el=>`<span class="at" style="background:${ACOL[el]||'#777'};${el==='H'?'color:#333':''}">${el}</span>`;
const toNum=v=>{v=String(v).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[−–]/g,'-');return v===''||isNaN(+v)?NaN:+v};
const sciTxt=x=>{if(x===0)return '0';const e=Math.floor(Math.log10(Math.abs(x)));const m=x/Math.pow(10,e);return `${m.toFixed(2)} × 10<sup>${e}</sup>`};
const AM={H:1.008,He:4.003,C:12.01,N:14.01,O:16.00,Na:22.99,Mg:24.31,Al:26.98,S:32.07,Cl:35.45,K:39.10,Ca:40.08,Fe:55.85,Cu:63.55,Zn:65.38,Ag:107.87,Au:196.97};
const ELS=['','H هيدروجين','He هيليوم','Li ليثيوم','Be بيريليوم','B بورون','C كربون','N نيتروجين','O أكسجين','F فلور','Ne نيون','Na صوديوم','Mg مغنيسيوم','Al ألومنيوم','Si سيليكون','P فوسفور','S كبريت','Cl كلور','Ar أرجون','K بوتاسيوم','Ca كالسيوم'];

/* ============ WIDGETS ============ */
const W={};

W.weight=w=>{
  const places=[['الأرض',9.8],['القمر',1.6],['المريخ',3.7],['المشتري',24.8]];
  let g=9.8;
  w.innerHTML=`<div class="wbox">
   <div class="seg">${places.map((p,i)=>`<button data-g="${p[1]}" class="${i?'':'on'}">${p[0]}</button>`).join('')}</div>
   <div style="margin-top:12px">كتلة رائد الفضاء: <b class="f m"></b></div>
   <input type="range" min="20" max="120" value="70">
   <div class="read">
     <div class="rd"><small>الكتلة</small><b class="rm"></b></div>
     <div class="rd"><small>الوزن = الكتلة × تسارع الجاذبية</small><b class="rw"></b><div class="meter"><i></i></div></div>
     <div class="rd"><small>تسارع الجاذبية هنا</small><b class="rg"></b></div>
   </div></div>`;
  const r=$('input',w);
  const up=()=>{const m=+r.value;$('.m',w).textContent=m+' kg';$('.rm',w).textContent=m+' kg';
    $('.rw',w).textContent=(m*g).toFixed(0)+' N';$('.rg',w).textContent=g+' m/s²';$('.meter i',w).style.width=Math.min(100,m*g/(120*24.8)*100)+'%'};
  $$('.seg button',w).forEach(b=>b.onclick=()=>{$$('.seg button',w).forEach(x=>x.classList.remove('on'));b.classList.add('on');g=+b.dataset.g;up()});
  r.oninput=up;up();
};

W.salt=w=>{
  w.innerHTML=`<div class="wbox">
   <p style="margin:0 0 6px">تجربة: أثر كمية الملح في درجة غليان <b class="f">500 mL</b> من الماء.</p>
   <div>كمية الملح المضافة: <b class="f s"></b></div>
   <input type="range" min="0" max="60" step="5" value="0">
   <div class="pst"><span>درجة الغليان المقيسة: <span class="scale t"></span></span><button class="btn2 dark rec">سجّل القراءة</button></div>
   <table class="log"><thead><tr><th>الملح (g)</th><th>درجة الغليان (°C)</th></tr></thead><tbody></tbody></table></div>`;
  const r=$('input',w),tb=$('tbody',w);
  const T=()=>(100+0.035*(+r.value)).toFixed(2);
  const up=()=>{$('.s',w).textContent=r.value+' g';$('.t',w).textContent=T()+' °C'};
  r.oninput=up;up();
  $('.rec',w).onclick=()=>{if(tb.children.length>=6)tb.firstElementChild.remove();tb.insertAdjacentHTML('beforeend',`<tr><td>${r.value}</td><td>${T()}</td></tr>`)};
};

W.particles=w=>{
  w.innerHTML=`<div class="wbox"><canvas width="640" height="300"></canvas>
   <div class="pst"><b class="st"></b><span class="f tt" style="font-size:1.2rem"></span></div>
   <input type="range" min="-40" max="160" value="25">
   <div class="row" style="justify-content:space-between;color:var(--muted);font-size:.85rem"><span>تبريد ❄</span><span>مادة: الماء</span><span>🔥 تسخين</span></div>
   <p class="ds" style="margin:8px 0 0;color:var(--muted)"></p></div>`;
  const cv=$('canvas',w),cx=cv.getContext('2d'),r=$('input',w);
  const Wd=640,H=300,R=11,N=40,cols=8,sp=2*R+2;
  const P=[];for(let k=0;k<N;k++){const c=k%cols,ro=Math.floor(k/cols);
    const lx=Wd/2-(cols-1)*sp/2+c*sp,ly=H-R-6-ro*sp;P.push({x:lx,y:ly,vx:0,vy:0,lx,ly})}
  const info={s:['صلبة','الجسيمات متراصّة ومترابطة، تهتز في أماكنها فقط ← شكل ثابت وحجم ثابت.'],
              l:['سائلة','الجسيمات متقاربة لكنها تنساب بعضها فوق بعض ← حجم ثابت وشكل يأخذ شكل الوعاء.'],
              g:['غازية','الجسيمات متباعدة وسريعة جدًا وتملأ الوعاء كله ← لا شكل ثابت ولا حجم ثابت.']};
  const state=T=>T<0?'s':T<100?'l':'g';
  function update(){const T=+r.value,st=state(T);
    if(st==='s'){const a=0.5+(T+40)/40*2.2;for(const p of P){p.x+=(p.lx+(Math.random()-.5)*a-p.x)*.3;p.y+=(p.ly+(Math.random()-.5)*a-p.y)*.3;p.vx=p.vy=0}return}
    for(const p of P){const kick=st==='l'?0.4+T/100*0.6:1.2;p.vx+=(Math.random()-.5)*kick;p.vy+=(Math.random()-.5)*kick;
      if(st==='l'){p.vy+=0.3;p.vx*=.9;p.vy*=.9}
      else{const tg=2.6+(T-100)/60*2;const s=Math.hypot(p.vx,p.vy)||1;p.vx=p.vx/s*tg;p.vy=p.vy/s*tg}
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<R){p.x=R;p.vx=Math.abs(p.vx)}if(p.x>Wd-R){p.x=Wd-R;p.vx=-Math.abs(p.vx)}
      if(p.y<R){p.y=R;p.vy=Math.abs(p.vy)}if(p.y>H-R){p.y=H-R;p.vy=-Math.abs(p.vy)*(st==='l'?.2:1)}}
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const p=P[i],q=P[j];const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||.01;
      if(d<2*R){const o=(2*R-d)/2,nx=dx/d,ny=dy/d;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
        if(st==='g'){[p.vx,q.vx]=[q.vx,p.vx];[p.vy,q.vy]=[q.vy,p.vy]}}}}
  function draw(){cx.clearRect(0,0,Wd,H);cx.fillStyle='#f4f7fd';cx.fillRect(0,0,Wd,H);
    for(const p of P){const gr=cx.createRadialGradient(p.x-3,p.y-3,2,p.x,p.y,R);gr.addColorStop(0,'#8fb3ff');gr.addColorStop(1,'#2f62d8');
      cx.fillStyle=gr;cx.beginPath();cx.arc(p.x,p.y,R,0,7);cx.fill()}}
  function label(){const T=+r.value,st=state(T);$('.st',w).textContent='الحالة: '+info[st][0];$('.tt',w).textContent=T+' °C';$('.ds',w).textContent=info[st][1]}
  r.oninput=()=>{label();if(!S.motion){for(let k=0;k<160;k++)update();draw()}};
  label();
  if(S.motion){(function tick(){if(!cv.isConnected)return;update();draw();requestAnimationFrame(tick)})()}else{for(let k=0;k<60;k++)update();draw()}
};

W.gold=w=>{
  w.innerHTML=`<div class="wbox">
   <div>قصّ سبيكة الذهب: احتفظ بـ <b class="f pc"></b> منها</div>
   <input type="range" min="10" max="100" value="100">
   <div class="goldwrap"><div class="goldbar"></div></div>
   <div class="read"><div class="rd"><small>الحجم</small><b class="v"></b></div><div class="rd"><small>الكتلة</small><b class="m"></b></div><div class="rd"><small>الكثافة = الكتلة ÷ الحجم</small><b class="d"></b></div></div></div>`;
  const r=$('input',w);
  const up=()=>{const f=+r.value/100,V=10*f,m=19.3*V;$('.pc',w).textContent=r.value+'%';$('.goldbar',w).style.width=(r.value)+'%';
    $('.v',w).textContent=V.toFixed(1)+' cm³';$('.m',w).textContent=m.toFixed(1)+' g';$('.d',w).textContent=(m/V).toFixed(1)+' g/cm³'};
  r.oninput=up;up();
};

W.mass=w=>{
  let closed=false,done=false;
  w.innerHTML=`<div class="wbox"><div class="flaskw">
   <svg viewBox="0 -80 200 300" class="fl">
    <g class="balloon" style="display:none"><ellipse cx="100" cy="-30" rx="30" ry="40" fill="#f06a8a" stroke="#16161a" stroke-width="3"/><rect x="88" y="6" width="24" height="16" rx="4" fill="#f06a8a" stroke="#16161a" stroke-width="3"/></g>
    <g class="escape"><circle cx="92" cy="10" r="5" fill="#bcd3ff"/><circle cx="108" cy="0" r="4" fill="#bcd3ff"/><circle cx="100" cy="-14" r="6" fill="#bcd3ff"/></g>
    <path d="M78 20 h44 v52 l46 108 a16 16 0 0 1 -15 22 h-106 a16 16 0 0 1 -15 -22 l46 -108z" fill="#f4f8ff" stroke="#16161a" stroke-width="3"/>
    <path d="M57 150 h86 l25 30 a16 16 0 0 1 -15 22 h-106 a16 16 0 0 1 -15 -22z" fill="#cfe1ff"/>
    <g class="bubs"><circle class="bub" cx="80" cy="185" r="5" fill="#fff"/><circle class="bub" cx="105" cy="190" r="4" fill="#fff" style="animation-delay:.3s"/><circle class="bub" cx="125" cy="182" r="5" fill="#fff" style="animation-delay:.6s"/><circle class="bub" cx="95" cy="178" r="3" fill="#fff" style="animation-delay:.8s"/></g>
   </svg>
   <div>
    <p style="margin:0 0 8px">قارورة فيها خل، وصودا الخبز جاهزة للإضافة. الكتلة الكلية قبل التفاعل:</p>
    <div class="scale rd2">150.0 g</div>
    <div class="row" style="margin-top:12px"><button class="btn2 cl">سدّ الفوهة ببالون</button><button class="btn2 dark go">اخلط المادتين</button><button class="btn2 rs">إعادة</button></div>
    <p class="msg" style="margin:10px 0 0;color:var(--muted)">جرّب مرة والقارورة مفتوحة، ومرة وهي مغلقة.</p>
   </div></div></div>`;
  const svg=$('svg',w),bal=$('.balloon',w),rd=$('.rd2',w),msg=$('.msg',w),cl=$('.cl',w);
  const refresh=()=>{bal.style.display=closed?'':'none';cl.textContent=closed?'أزل البالون (افتح)':'سدّ الفوهة ببالون';svg.classList.toggle('open',!closed)};
  cl.onclick=()=>{if(done)return;closed=!closed;refresh()};
  $('.go',w).onclick=()=>{if(done)return;done=true;svg.classList.add('reacting');if(closed)bal.classList.add('big');
    const target=closed?150.0:148.9;const t0=performance.now();
    const anim=t=>{const k=Math.min(1,(t-t0)/1800);rd.textContent=(150-(150-target)*k).toFixed(1)+' g';if(k<1&&S.motion)requestAnimationFrame(anim);else{rd.textContent=target.toFixed(1)+' g';
      msg.innerHTML=closed?'<b>الكتلة لم تتغيّر!</b> الغاز الناتج بقي محبوسًا في البالون.':'<b>نقصت الكتلة 1.1 g</b>… أين ذهبت؟ فكّر قبل أن تنتقل.';
      setTimeout(()=>svg.classList.remove('reacting'),1200)}};
    requestAnimationFrame(anim)};
  $('.rs',w).onclick=()=>{done=false;bal.classList.remove('big');svg.classList.remove('reacting');rd.textContent='150.0 g';msg.textContent='جرّب مرة والقارورة مفتوحة، ومرة وهي مغلقة.'};
  refresh();
};

W.prop=w=>{
  const srcs=['ماء مقطّر','ماء مطر نقّي','جليد مُذاب','ماء ناتج من احتراق الهيدروجين'];
  w.innerHTML=`<div class="wbox">
   <div class="seg">${srcs.map((s,i)=>`<button class="${i?'':'on'}">${s}</button>`).join('')}</div>
   <div style="margin-top:12px">كتلة عيّنة الماء النقي <span class="f">H<sub>2</sub>O</span>: <b class="f m"></b></div>

   <div class="stack"><div style="width:11.2%;background:#8a8f99">H</div><div style="width:88.8%;background:#e04848">O 88.8%</div></div></div>`;
  const r=$('input',w);

  $$('.seg button',w).forEach(b=>b.onclick=()=>{$$('.seg button',w).forEach(x=>x.classList.remove('on'));b.classList.add('on');r.value=Math.round(10+Math.random()*190);up()});
  r.oninput=up;up();
};

W.symbols=w=>{
  const sy=[['(s)','صلب'],['(l)','سائل'],['(g)','غاز'],['(aq)','مذاب في الماء (محلول مائي)'],['+','يفصل بين متفاعلين أو بين ناتجين'],['→','«ينتج» — يفصل المتفاعلات عن النواتج'],['Δ','فوق السهم: تُضاف حرارة للمتفاعلات']];

W.replace=w=>{
  w.innerHTML=`<div class="wbox"><div class="seg"><button class="on" data-m="single">إحلال بسيط</button><button data-m="double">إحلال مزدوج</button></div>
   <div class="rstage"></div><div class="rcap"></div>
   <div class="row" style="justify-content:center;margin-top:6px"><button class="btn2 dark play">▶ شغّل التفاعل</button><button class="btn2 reset">إعادة</button></div><p class="eqd" style="text-align:center;margin:8px 0 0"></p></div>`;
  const stg=$('.rstage',w),cap=$('.rcap',w);let mode='single',timers=[];
  const DEF={
    single:{atoms:[['Zn','#6f7a8a'],['Cu','#d07a1a'],['SO4','#8a5cf0']],eq:'Zn(s) + CuSO4(aq) -> ZnSO4(aq) + Cu(s)',cap0:'الخارصين Zn أنشط من النحاس Cu …',capEnd:'دخل Zn مكان Cu تمامًا بجوار SO₄، وخرج Cu وحيدًا: A + BC → AC + B'},
    double:{atoms:[['Ag','#a6b2c2'],['NO3','#3b78e7'],['Na','#8a5cf0'],['Cl','#2fb36a']],eq:'AgNO3(aq) + NaCl(aq) -> AgCl(s) + NaNO3(aq)',capEnd:'تبادل الأيونان الموجبان شريكيهما: AB + CD → AD + CB، وتكوَّن راسب AgCl'}};
  function geom(){const Wd=stg.clientWidth||600;const s=mode==='single'?Math.min(56,Wd*.1):Math.min(52,Wd*.085);return{Wd,s,y:95-s/2}}
  function build(){timers.forEach(clearTimeout);timers=[];const {Wd,s,y}=geom();const d=DEF[mode];
    stg.innerHTML=d.atoms.map((a,i)=>`<div class="ratom" style="width:${s}px;height:${s}px;background:${a[1]};font-size:${a[0].length>2?s*.28:s*.34}px">${fx(a[0])}</div>`).join('')+`<div class="rlbl p1">+</div><div class="rlbl p2">+</div><div class="rlbl ar">→</div>`;
    const A=$$('.ratom',stg);const x0=Wd*.03;
    const set=(el,x,yy)=>{el.style.left=x+'px';el.style.top=yy+'px'};
    const lbl=(c,x,show)=>{const e=$(c,stg);e.style.left=x+'px';e.style.top='77px';e.style.opacity=show?1:0};
    lbl('.ar',Wd/2-10,1);
    if(mode==='single'){set(A[0],x0,y);set(A[1],x0+1.6*s,y);set(A[2],x0+2.6*s,y);lbl('.p1',x0+1.1*s,1);lbl('.p2',Wd*.56+2.35*s,0);cap.textContent=d.cap0}
    else{set(A[0],x0,y);set(A[1],x0+s,y);set(A[2],x0+2.7*s,y);set(A[3],x0+3.7*s,y);lbl('.p1',x0+2.15*s,1);lbl('.p2',Wd*.55+2.15*s,0);cap.innerHTML='&nbsp;'}
    $('.eqd',w).innerHTML=E(d.eq);
  }
  function play(){build();const {Wd,s,y}=geom();const A=$$('.ratom',stg);const set=(el,x,yy)=>{if(x!=null)el.style.left=x+'px';if(yy!=null)el.style.top=yy+'px'};
    const x0=Wd*.03,dt=S.motion?950:0;const at=(f,t)=>timers.push(setTimeout(f,t));
    if(mode==='single'){
      at(()=>{set(A[1],null,y-62);cap.textContent='① ذرة النحاس Cu تغادر المركّب…'},40);
      at(()=>{set(A[0],x0+1.6*s,y);set(A[1],Wd*.6+3.2*s,null);$('.p1',stg).style.opacity=0;cap.textContent='② وذرة الخارصين Zn تأخذ مكانها نفسه بجوار SO₄'},40+dt);
      at(()=>{set(A[0],Wd*.56,y);set(A[2],Wd*.56+s,y);set(A[1],Wd*.56+3.2*s,y);$('.p2',stg).style.opacity=1;cap.textContent=DEF.single.capEnd},40+2*dt);
    }else{
      at(()=>{set(A[1],null,y-60);set(A[3],null,y+60);cap.textContent='① الأيونان السالبان NO₃ و Cl ينفصلان عن شريكيهما…'},40);
      at(()=>{set(A[1],x0+3.7*s,null);set(A[3],x0+s,null);$('.p1',stg).style.opacity=0;cap.textContent='② كلٌّ منهما يتجه إلى مكان الآخر'},40+dt);
      at(()=>{set(A[1],null,y);set(A[3],null,y);cap.textContent='③ يرتبط Cl مع Ag، ويرتبط NO₃ مع Na'},40+2*dt);
      at(()=>{const b=Wd*.55;set(A[0],b,y);set(A[3],b+s,y);set(A[2],b+2.7*s,y);set(A[1],b+3.7*s,y);$('.p2',stg).style.opacity=1;cap.textContent=DEF.double.capEnd},40+3*dt);
    }
  }
  $$('.seg button',w).forEach(b=>b.onclick=()=>{$$('.seg button',w).forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;build()});
  $('.play',w).onclick=play;$('.reset',w).onclick=build;
  requestAnimationFrame(build);
};

W.rutherford=w=>{
  w.innerHTML=`<div class="wbox"><div class="seg"><button class="on" data-m="t">ما توقّعه العلماء (نموذج طومسون)</button><button data-m="r">ما حدث فعلًا</button></div>
   <canvas width="640" height="300" style="margin-top:10px;background:#11131a"></canvas>
   <div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn2 dark fire">أطلق 60 جسيم ألفا</button><button class="btn2 clr">مسح</button></div>
   <div class="read"><div class="rd"><small>مرّت مستقيمة</small><b class="c0">0</b></div><div class="rd"><small>انحرفت</small><b class="c1">0</b></div><div class="rd"><small>ارتدّت للخلف</small><b class="c2">0</b></div></div>
   <p style="margin:8px 0 0;color:var(--muted);font-size:.85rem">* نسبة الارتداد مكبّرة هنا للتوضيح؛ في التجربة الحقيقية ارتدّ جسيم واحد تقريبًا من كل 8000.</p></div>`;
  const cv=$('canvas',w),cx=cv.getContext('2d');let mode='t',parts=[],trails=[],cnt=[0,0,0];
  const FX=330,nuc=[];for(let y=20;y<300;y+=36)nuc.push(y);
  function bg(){cx.fillStyle='#11131a';cx.fillRect(0,0,640,300);cx.fillStyle='#33384a';cx.fillRect(10,130,40,40);cx.fillStyle='#9aa3b8';cx.font='13px Arial';cx.fillText('α',25,155);
    if(mode==='t'){for(const y of nuc){cx.fillStyle='rgba(240,160,80,.25)';cx.beginPath();cx.arc(FX,y,17,0,7);cx.fill();}}
    else{cx.strokeStyle='rgba(240,200,80,.18)';for(const y of nuc){cx.beginPath();cx.arc(FX,y,17,0,7);cx.stroke();cx.fillStyle='#ffb43c';cx.beginPath();cx.arc(FX,y,2.5,0,7);cx.fill()}}
    cx.fillStyle='rgba(255,215,0,.5)';cx.fillRect(FX-1,0,2,300);
    for(const t of trails){cx.strokeStyle=t.c;cx.lineWidth=1.2;cx.beginPath();cx.moveTo(t.pts[0][0],t.pts[0][1]);for(const p of t.pts)cx.lineTo(p[0],p[1]);cx.stroke()}}
  function newP(){const y0=30+Math.random()*240;return{x:55,y:150,tx:FX,ty:y0,vx:0,vy:0,ph:0,pts:[[55,150]],y0}}
  function deflect(p){let th,k=0;
    if(mode==='r'){k=p.kind;th=k===2?Math.PI-Math.random()*.45:k===1?.3+Math.random()*.9:(Math.random()-.5)*.02;th*=Math.random()<.5?-1:1}
    else th=(Math.random()-.5)*.03;
    p.vx=Math.cos(th)*6;p.vy=Math.sin(th)*6;p.k=k;p.ph=1}
  function step(p){if(p.ph===0){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d<6){p.x=p.tx;p.y=p.ty;deflect(p)}else{p.x+=dx/d*6;p.y+=dy/d*6}}
    else{p.x+=p.vx;p.y+=p.vy}p.pts.push([p.x,p.y]);return p.x<0||p.x>640||p.y<0||p.y>300}
  function finishP(p){cnt[p.k]++;trails.push({pts:p.pts,c:p.k===2?'#ff5a5a':p.k===1?'#ffd166':'rgba(120,200,255,.55)'});upd()}
  function upd(){$('.c0',w).textContent=cnt[0];$('.c1',w).textContent=cnt[1];$('.c2',w).textContent=cnt[2]}
  let running=false;
  function loop(){if(!cv.isConnected)return;bg();parts=parts.filter(p=>{const out=step(p)||p.pts.length>400;if(out){finishP(p);return false}cx.fillStyle='#7fd3ff';cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill();return true});
    if(parts.length)requestAnimationFrame(loop);else{running=false;bg()}}
  $('.fire',w).onclick=()=>{const batch=[];for(let i=0;i<60;i++){const p=newP();p.kind=mode==='r'?(i<3?2:i<9?1:0):0;
      if(p.kind){const n=nuc[1+Math.floor(Math.random()*(nuc.length-2))];p.ty=n+(Math.random()-.5)*(p.kind===2?2:8)}batch.push(p)}
    const order=shuffle(batch);
    if(!S.motion){for(const p of order){let g=0;while(!step(p)&&g<500)g++;finishP(p)}bg();return}
    let i=0;const add=()=>{if(i<order.length&&cv.isConnected){parts.push(order[i++]);setTimeout(add,35)}};add();if(!running){running=true;requestAnimationFrame(loop)}};
  $('.clr',w).onclick=()=>{trails=[];cnt=[0,0,0];upd();bg()};
  $$('.seg button',w).forEach(b=>b.onclick=()=>{$$('.seg button',w).forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;trails=[];cnt=[0,0,0];upd();bg()});
  bg();
};

const HPL=6.626e-34,CL=3.00e8;
function wl2rgb(nm){let r=0,g=0,b=0;
  if(nm>=380&&nm<440){r=-(nm-440)/60;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=-(nm-510)/20}else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=-(nm-645)/65}else if(nm<=750){r=1}
  let f=nm<420?.3+.7*(nm-380)/40:nm>700?.3+.7*(750-nm)/50:1;const c=v=>Math.round(255*Math.pow(v*f,.8));
  if(nm<380)return '#7a5cff';if(nm>750)return '#8b1a1a';return `rgb(${c(r)},${c(g)},${c(b)})`}
const regionOf=nm=>nm<10?'الأشعة السينية':nm<380?'الأشعة فوق البنفسجية':nm<=750?'الضوء المرئي':'الأشعة تحت الحمراء';

W.photo=w=>{

  const cv=$('canvas',w),cx=cv.getContext('2d'),rl=$('.rl',w),ri=$('.ri',w);let ph=[],el=[],t=0;
  const up=()=>{const nm=+rl.value,nu=CL/(nm*1e-9);$('.l',w).textContent=nm+' nm';$('.i',w).textContent=ri.value;$('.nu',w).innerHTML=sciTxt(nu)+' Hz';
    $('.st',w).innerHTML=nu>=nu0?'<span style="color:var(--ok)">نعم ✓</span>':'<span style="color:var(--bad)">لا ✗</span>';if(!S.motion)stat()};
  function scene(){cx.fillStyle='#11131a';cx.fillRect(0,0,640,240);cx.fillStyle='#b7bec9';cx.fillRect(520,30,26,180);cx.fillStyle='#9aa3b8';cx.font='13px Arial';cx.fillText('Na',522,226);
    cx.fillStyle='#333a4d';cx.fillRect(20,100,50,40);cx.fillStyle='#fff';cx.fillText('ضوء',30,124)}
  function stat(){scene();const nm=+rl.value,col=wl2rgb(nm);cx.strokeStyle=col;cx.lineWidth=6;cx.globalAlpha=.5+ri.value/20;cx.beginPath();cx.moveTo(70,120);cx.lineTo(520,120);cx.stroke();cx.globalAlpha=1;
    if(CL/(nm*1e-9)>=nu0){cx.fillStyle='#7fd3ff';for(let k=0;k<ri.value;k++){cx.beginPath();cx.arc(470-k*14,60+((k*37)%120),4,0,7);cx.fill()}}}
  function loop(){if(!cv.isConnected)return;t++;const nm=+rl.value,col=wl2rgb(nm),nu=CL/(nm*1e-9);
    if(t%Math.max(2,14-ri.value)===0)ph.push({x:70,y:60+Math.random()*120});
    scene();cx.fillStyle=col;ph=ph.filter(p=>{p.x+=7;if(p.x>=520){if(nu>=nu0){const v=1+(nu-nu0)/1e14*1.6;el.push({x:515,y:p.y,vx:-v,vy:(Math.random()-.5)*v})}return false}cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill();return true});
    cx.fillStyle='#7fd3ff';el=el.filter(e=>{e.x+=e.vx;e.y+=e.vy;cx.beginPath();cx.arc(e.x,e.y,3.5,0,7);cx.fill();return e.x>0&&e.y>0&&e.y<240});
    requestAnimationFrame(loop)}
  rl.oninput=up;ri.oninput=up;up();if(S.motion)loop();else stat();
};

const EL36=['','H هيدروجين','He هيليوم','Li ليثيوم','Be بيريليوم','B بورون','C كربون','N نيتروجين','O أكسجين','F فلور','Ne نيون','Na صوديوم','Mg مغنيسيوم','Al ألومنيوم','Si سيليكون','P فوسفور','S كبريت','Cl كلور','Ar أرجون','K بوتاسيوم','Ca كالسيوم','Sc سكانديوم','Ti تيتانيوم','V فاناديوم','Cr كروم','Mn منجنيز','Fe حديد','Co كوبالت','Ni نيكل','Cu نحاس','Zn خارصين','Ga جاليوم','Ge جرمانيوم','As زرنيخ','Se سيلينيوم','Br بروم','Kr كربتون'];
function econf(Z){const ord=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6]];let left=Z;const res=[];
  for(const [s,m] of ord){if(left<=0)break;const k=Math.min(m,left);res.push([s,k]);left-=k}
  if(Z===24||Z===29){const i4=res.findIndex(x=>x[0]==='4s'),i3=res.findIndex(x=>x[0]==='3d');res[i4][1]=1;res[i3][1]+=1}
  return res}
const supN=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
function confStr(Z,noble){const c=econf(Z);let pre='',skip=0;if(noble){const ng=[[18,'[Ar]'],[10,'[Ne]'],[2,'[He]']].find(g=>g[0]<Z);if(ng){pre=ng[1]+' ';skip=econf(ng[0]).length}}
  return pre+c.slice(skip).map(x=>x[0]+supN(x[1])).join(' ')}
function valenceE(Z){const c=econf(Z);const maxn=Math.max(...c.map(x=>+x[0][0]));return c.filter(x=>+x[0][0]===maxn&&x[0][1]!=='d').reduce((a,x)=>a+x[1],0)}
function dotSym(sym,n,big){const pos=[[0,1],[1,2],[2,1],[1,0]];const cnt=[0,0,0,0];for(let i=0;i<n;i++)cnt[i%4]++;
  const cell=(r,c)=>{const k=pos.findIndex(p=>p[0]===r&&p[1]===c);if(k<0)return r===1&&c===1?`<b>${sym}</b>`:'';return '•'.repeat(cnt[k])};
  return `<span style="display:inline-grid;grid-template-columns:auto auto auto;align-items:center;justify-items:center;font-family:Segoe UI,Arial;line-height:1;font-size:${big?'1.6rem':'1.1rem'};direction:ltr;gap:0 2px">${[0,1,2].map(r=>[0,1,2].map(c=>`<span style="${(r===1&&c!==1)?'writing-mode:vertical-lr;letter-spacing:-2px':''}">${cell(r,c)}</span>`).join('')).join('')}</span>`}

  r.oninput=up;up();
};

  function draw(){cx.clearRect(0,0,640,230);cx.strokeStyle='#bdbcb5';cx.lineWidth=2;cx.strokeRect(1,1,638,228);

    let l=0,r=0;P.forEach(p=>{cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();if(p.m<20&&p.x>320)r++;if(p.m>20&&p.x<320)l++});
    cx.fillStyle='#55585e';cx.font='14px Arial';cx.textAlign='left';cx.fillText('NH₃ → '+r,12,222);cx.textAlign='right';cx.fillText(l+' ← HCl',628,222)}
  function loop(){if(!cv.isConnected)return;const k=Math.sqrt(+rt.value/300);
    P.forEach(p=>{const v=k*(p.m<20?2.4:1.64)*(0.7+0.6*((p.x*7+p.y*13)%10)/10);p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;
      if(p.y<p.r||p.y>230-p.r){p.a=-p.a;p.y=Math.max(p.r,Math.min(230-p.r,p.y))}
      const lo=wall&&p.m<20?0:wall?324:0,hi=wall&&p.m<20?316:640;
      if(p.x<lo+p.r||p.x>hi-p.r){p.a=Math.PI-p.a;p.x=Math.max(lo+p.r,Math.min(hi-p.r,p.x))}});
    draw();requestAnimationFrame(loop)}
  $('.rm',w).onclick=()=>{wall=false;if(!S.motion)draw()};$('.rs',w).onclick=()=>{reset();up()};
  rt.oninput=up;reset();up();if(S.motion)loop();else draw();
};

W.phase=w=>{
  const Tt=273.16,Pt=0.006,Tb=373.15,Tc=647.14,Pc=217.75;
  const lnPlv=T=>{const pts=[[1/Tt,Math.log(Pt)],[1/Tb,0],[1/Tc,Math.log(Pc)]];const x=1/T;const [a,b]=x>=pts[1][0]?[pts[0],pts[1]]:[pts[1],pts[2]];return a[1]+(x-a[0])*(b[1]-a[1])/(b[0]-a[0])};
  const lnPsub=T=>Math.log(Pt)-6140*(1/T-1/Tt);const Tm=P=>273.16-0.0074*(P-Pt);
  const state=(Tk,P)=>{if(Tk>Tc&&P>Pc)return['فوق النقطة الحرجة','#8a63c9'];
    if(P<Pt)return Math.log(P)>lnPsub(Tk)&&Tk<Tt?['صلب','#3b78e7']:['غاز','#e0612b'];
    if(Tk<Tm(P))return['صلب','#3b78e7'];if(Tk<=Tc&&Math.log(P)>=lnPlv(Tk))return['سائل','#17905a'];return['غاز','#e0612b']};
  w.innerHTML=`<div class="wbox"><p style="margin:0 0 6px">مخطط الحالة للماء (رسم توضيحي، محور الضغط لوغاريتمي)</p>
   <svg viewBox="0 0 600 300" style="width:100%;background:#fbfaf7;border-radius:12px;direction:ltr"></svg>
   <div style="margin-top:8px">درجة الحرارة: <b class="f tt"></b></div><input type="range" class="rt" min="-40" max="420" step="1" value="25">
   <div>الضغط: <b class="f pp"></b></div><input type="range" class="rp" min="-3" max="2.6" step="0.01" value="0">
   <div class="read"><div class="rd"><small>حالة الماء</small><b class="ss" style="font-family:inherit"></b></div></div></div>`;
  const sv=$('svg',w),rt=$('.rt',w),rp=$('.rp',w);const X=t=>60+(t+40)/460*520,Y=lp=>260-(lp+3)/5.6*240;
  let curve='',sub='',melt='';for(let t=0.01;t<=373.99;t+=2)curve+=`${X(t)},${Y(lnPlv(t+273.15)/Math.LN10)} `;curve+=`${X(373.99)},${Y(Math.log10(Pc))}`;
  for(let t=-40;t<=0.01;t+=1)sub+=`${X(t)},${Y(lnPsub(t+273.15)/Math.LN10)} `;
  for(let lp=Math.log10(Pt);lp<=2.6;lp+=0.1){const P=10**lp;melt+=`${X(Tm(P)-273.15)},${Y(lp)} `}
  const base=`<line x1="60" y1="260" x2="580" y2="260" stroke="#55585e" stroke-width="2"/><line x1="60" y1="260" x2="60" y2="20" stroke="#55585e" stroke-width="2"/>
    ${[0,100,200,300,400].map(v=>`<text x="${X(v)}" y="276" font-size="12" text-anchor="middle" font-family="Arial" fill="#888">${v}</text>`).join('')}
    ${[[-3,'0.001'],[-2,'0.01'],[-1,'0.1'],[0,'1'],[1,'10'],[2,'100']].map(([v,l])=>`<text x="54" y="${Y(v)+4}" font-size="12" text-anchor="end" font-family="Arial" fill="#888">${l}</text><line x1="60" x2="580" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceae3" stroke-dasharray="3 4"/>`).join('')}
    <text x="320" y="296" font-size="13" text-anchor="middle" font-family="Arial" fill="#55585e">T (°C)</text><text x="16" y="140" font-size="13" font-family="Arial" fill="#55585e" transform="rotate(-90 16 140)">P (atm)</text>
    <polyline points="${curve}" fill="none" stroke="#3b78e7" stroke-width="3"/><polyline points="${sub}" fill="none" stroke="#e0a106" stroke-width="3"/><polyline points="${melt}" fill="none" stroke="#cf3f3f" stroke-width="3"/>
    <circle cx="${X(0.01)}" cy="${Y(Math.log10(Pt))}" r="5" fill="#222"/><text x="${X(0.01)+8}" y="${Y(Math.log10(Pt))+16}" font-size="12" font-family="Arial" fill="#222">A</text>
    <circle cx="${X(373.99)}" cy="${Y(Math.log10(Pc))}" r="5" fill="#222"/><text x="${X(373.99)+8}" y="${Y(Math.log10(Pc))+4}" font-size="12" font-family="Arial" fill="#222">B</text>
    <text x="${X(-25)}" y="${Y(1.4)}" font-size="16" font-family="Arial" fill="#3b78e7">صلب</text><text x="${X(150)}" y="${Y(1.6)}" font-size="16" font-family="Arial" fill="#17905a">سائل</text><text x="${X(250)}" y="${Y(-1.6)}" font-size="16" font-family="Arial" fill="#e0612b">غاز</text>`;
  const up=()=>{const t=+rt.value,lp=+rp.value,P=10**lp;const [s,c]=state(t+273.15,P);
    $('.tt',w).textContent=t+' °C';$('.pp',w).textContent=(P<0.1?P.toPrecision(2):P<10?P.toFixed(2):P.toFixed(0))+' atm';
    $('.ss',w).innerHTML=`<span style="color:${c}">${s}</span>`;
    sv.innerHTML=base+`<circle cx="${X(t)}" cy="${Y(lp)}" r="9" fill="${c}" stroke="#fff" stroke-width="3"/>`};
  rt.oninput=up;rp.oninput=up;up();
};
