{id:'1-2',title:'نظرية الكم والذرة',sub:'نموذج بور، دي برولي وهايزنبرج، المستويات والمستويات الفرعية',steps:[
 {t:'info',h:'نموذج بور للهيدروجين',body:'<p>اقترح بور أن الإلكترون يدور في <b>مستويات طاقة محددة</b> فقط. أقل مستوى (n = 1) هو <b>الحالة المستقرة</b>. عندما يهبط الإلكترون من مستوى أعلى إلى أدنى يطلق فوتونًا طاقته تساوي فرق الطاقة بين المستويين.</p><p>جرّب: أطلق الإلكترون من مستويات مختلفة إلى n = 2 وابنِ طيف الهيدروجين المرئي:</p>',widget:'bohr'},
 {t:'mcq',ch:1,h:'لماذا ألوان مختلفة؟',body:'<p>انتقال الإلكترون من n = 3 إلى n = 2 يعطي ضوءًا أحمر، ومن n = 4 إلى n = 2 يعطي ضوءًا أزرق مخضرًّا. لماذا؟</p>',opts:['فرق الطاقة في الانتقال الثاني أكبر، فالفوتون أعلى ترددًا وأقصر طولًا موجيًا','الإلكترون في الانتقال الثاني أسرع','الانتقال الثاني يحدث في ذرة مختلفة','الفوتون الأحمر يحمل طاقة أكبر'],a:0,exp:'المستويات تتقارب كلما ارتفعنا، لكن الهبوط من 4 إلى 2 يقطع مسافة طاقة أكبر من 3 إلى 2. طاقة أكبر ← تردد أعلى ← لون نحو الأزرق.'},
 {t:'mcq',h:'الحالة المثارة',body:'<p>ماذا يحدث عندما تمتص ذرة هيدروجين في حالتها المستقرة كمية مناسبة من الطاقة؟</p>',opts:['ينتقل إلكترونها إلى مستوى طاقة أعلى (حالة مثارة)','يطلق إلكترونها فوتونًا فورًا','تفقد الذرة بروتونًا','يقترب الإلكترون من النواة'],a:0,exp:'امتصاص الطاقة يرفع الإلكترون، والعودة إلى الأسفل تطلق الطاقة على صورة فوتون.'},
 {t:'mcq',ch:1,h:'حدود نموذج بور',body:'<p>نجح نموذج بور في تفسير طيف الهيدروجين بدقة. لماذا احتاج العلماء إلى نموذج جديد؟</p>',opts:['لأنه فشل في تفسير أطياف الذرات التي فيها أكثر من إلكترون','لأنه لم يفسّر طيف الهيدروجين','لأنه أنكر وجود النواة','لأنه افترض أن الضوء موجة فقط'],a:0,exp:'النموذج العلمي يُختبر بقدرته على التفسير. بور فسّر الهيدروجين فقط، فجاء النموذج الميكانيكي الكمي ليفسّر جميع الذرات.'},
 {t:'mcq',h:'مبدأ هايزنبرج',body:'<p>ما الذي ينص عليه مبدأ عدم التأكد لهايزنبرج؟</p>',opts:['لا يمكن تحديد سرعة الإلكترون وموقعه بدقة في الوقت نفسه','الإلكترون يدور في مسار دائري محدد','الضوء موجة فقط','لكل إلكترون أربعة أعداد كم متطابقة'],a:0,exp:'أي محاولة لرصد الإلكترون (بفوتون مثلًا) تغيّر حركته. لذلك نتحدث عن <b>احتمال</b> وجود الإلكترون في منطقة، لا عن مسار محدد.'},
 {t:'sort',h:'كم مستوى ثانويًا (أوربيتالًا)؟',body:'<p>كم أوربيتالًا في كل مستوى طاقة فرعي؟</p>',cats:['1','3','5','7'],items:[['المستوى الفرعي s',0],['المستوى الفرعي p',1],['المستوى الفرعي d',2],['المستوى الفرعي f',3]],exp:'s: 1، p: 3، d: 5، f: 7. وكل أوربيتال يتسع لإلكترونين على الأكثر.'},
 {t:'num',ch:1,h:'سعة المستوى الثالث',body:'<p>المستوى الرئيس n = 3 يحتوي على المستويات الفرعية 3s و 3p و 3d. ما أكبر عدد من الإلكترونات يتسع له؟</p>',a:18,tol:0,unit:'إلكترون',exp:'3s (1 أوربيتال) + 3p (3) + 3d (5) = 9 أوربيتالات × 2 = <b>18</b> = 2n²',hint:'اجمع عدد الأوربيتالات ثم اضرب في 2.'},
 {t:'mcq',h:'ما الأوربيتال؟',body:'<p>في النموذج الميكانيكي الكمي، الأوربيتال الذري هو:</p>',opts:['منطقة ثلاثية الأبعاد حول النواة يكون احتمال وجود الإلكترون فيها كبيرًا','مسار دائري محدد يدور فيه الإلكترون','جسيم داخل النواة','مستوى الطاقة الأول فقط'],a:0,exp:'لا مسارات محددة في النموذج الحديث؛ بل «سحابة» احتمالية لها أشكال (s كروي، p على شكل فصين…).'}
]},
{id:'1-3',title:'التوزيع الإلكتروني',sub:'مبدأ أوفباو، باولي، هوند، ترميز الغاز النبيل، إلكترونات التكافؤ',steps:[
 {t:'info',h:'املأ الأوربيتالات',body:'<div class="key"><b>مبدأ أوفباو</b>: يشغل الإلكترون الأوربيتال الأقل طاقة أولًا.<br><b>مبدأ باولي</b>: الأوربيتال يتسع لإلكترونين فقط متعاكسين في الدوران ↑↓.<br><b>قاعدة هوند</b>: في أوربيتالات المستوى الفرعي الواحد تُوزَّع الإلكترونات منفردة أولًا ↑ ↑ ↑ ثم تزدوج.</div><p>حرّك المؤشر من Z = 1 إلى 36 وراقب ترتيب الامتلاء:</p>',widget:'config'},
 {t:'mcq',ch:1,h:'أين الخطأ؟',body:'<p>أيّ رسم صحيح لإلكترونات المستوى الفرعي <span class="f">2p</span> في ذرة النيتروجين (3 إلكترونات)؟</p>',keep:1,opts:['<span class="f">[↑] [↑] [↑]</span>','<span class="f">[↑↓] [↑] [ &nbsp;]</span>','<span class="f">[↑↑] [↑] [ &nbsp;]</span>','<span class="f">[↑↓↑] [ &nbsp;] [ &nbsp;]</span>'],a:0,exp:'قاعدة هوند: الإلكترونات تتوزع منفردة على الأوربيتالات المتساوية الطاقة أولًا. الخيار الثالث يخالف باولي (دورانان متماثلان)، والرابع ثلاثة إلكترونات في أوربيتال واحد!'},
 {t:'build',h:'اكتب التوزيع الإلكتروني للكبريت',body:'<p>الكبريت S عدده الذري 16. ركّب توزيعه الإلكتروني بالترتيب (بين البطاقات بطاقات زائدة):</p>',tiles:['1s²','2s²','2p⁶','3s²','3p⁴','3p⁶','3d²'],answers:[['1s²','2s²','2p⁶','3s²','3p⁴']],exp:'2 + 2 + 6 + 2 + 4 = 16 ✓. وإلكترونات التكافؤ (في المستوى 3) = 6.'},
 {t:'mcq',ch:1,h:'لماذا 4s قبل 3d؟',body:'<p>في البوتاسيوم (Z = 19) يدخل الإلكترون الأخير إلى <span class="f">4s</span> لا إلى <span class="f">3d</span>، رغم أن 3 أصغر من 4. لماذا؟</p>',opts:['لأن طاقة المستوى الفرعي 4s أقل من طاقة 3d، والإلكترون يشغل الأقل طاقة أولًا','لأن 3d ممتلئ دائمًا','لأن مبدأ باولي يمنع دخول 3d','لأن 4s أقرب إلى النواة من 3d'],a:0,exp:'مبدأ أوفباو يعتمد على <b>الطاقة</b> لا على رقم المستوى. مستويات الطاقة الفرعية تتداخل بدءًا من المستوى الثالث.'},
 {t:'mcq',h:'ترميز الغاز النبيل',body:'<p>الكالسيوم Ca عدده الذري 20. ما توزيعه بترميز الغاز النبيل؟</p>',opts:['<span class="f">[Ar] 4s²</span>','<span class="f">[Ne] 3s²</span>','<span class="f">[Ar] 3d²</span>','<span class="f">[Kr] 4s²</span>'],a:0,exp:'الأرجون (18) هو الغاز النبيل السابق؛ يبقى إلكترونان يدخلان 4s.'},
 {t:'num',h:'إلكترونات التكافؤ',body:'<p>كم إلكترون تكافؤ في ذرة الفوسفور <span class="f">P</span> (Z = 15، التوزيع <span class="f">1s² 2s² 2p⁶ 3s² 3p³</span>)؟</p>',a:5,tol:0,unit:'',exp:'إلكترونات التكافؤ هي إلكترونات أعلى مستوى طاقة رئيس (n = 3): 3s² + 3p³ = <b>5</b>'},
 {t:'mcq',ch:1,h:'النحاس المتمرّد',body:'<p>حسب ترتيب أوفباو نتوقع للنحاس (Z = 29): <span class="f">[Ar] 4s² 3d⁹</span>، لكن التوزيع الفعلي مختلف. ما هو؟ ولماذا؟</p>',opts:['<span class="f">[Ar] 4s¹ 3d¹⁰</span> — لأن المستوى الفرعي d الممتلئ أكثر استقرارًا','<span class="f">[Ar] 4s² 3d⁸ 4p¹</span> — لأن 4p أقل طاقة','<span class="f">[Ar] 3d¹¹</span> — لأن d يتسع لـ 11','<span class="f">[Ar] 4s⁰ 3d⁹ 4p²</span>'],a:0,exp:'ينتقل إلكترون من 4s إلى 3d ليصبح المستوى الفرعي d ممتلئًا (10). وبالمثل الكروم: [Ar] 4s¹ 3d⁵ (نصف ممتلئ).'},
 {t:'mcq',h:'التمثيل النقطي',body:'<p>كم نقطة تحيط برمز الأكسجين <span class="f">O</span> (Z = 8) في التمثيل النقطي للإلكترونات؟</p>',opts:['6','8','2','4'],a:0,exp:'التوزيع 1s² 2s² 2p⁴ ← إلكترونات التكافؤ 2 + 4 = 6 نقاط.'}
]},
{id:'b1',boss:true,title:'تحدّي الفصل الأول',sub:'الضوء والكم والتوزيع — 3 قلوب',steps:[
 {t:'sci',h:'من الطاقة إلى الطول الموجي',body:'<p>فوتون طاقته <span class="f">3.31 × 10<sup>−19</sup> J</span>. ما طوله الموجي بالمتر؟ (<span class="f">h = 6.626 × 10<sup>−34</sup> J·s</span>، <span class="f">c = 3.00 × 10<sup>8</sup> m/s</span>)</p>',a:6.005e-7,tol:0.015,unit:'m',exp:'ν = E ÷ h = 5.00 × 10¹⁴ Hz ← λ = c ÷ ν = <b>6.00 × 10<sup>−7</sup> m</b> (600 nm: ضوء برتقالي)'},
 {t:'mcq',h:'تجربة الضوء الأزرق',body:'<p>سقط ضوء أزرق على فلز فحرّر إلكترونات. ماذا يحدث إذا ضاعفنا <b>شدة</b> الضوء الأزرق نفسه؟</p>',opts:['يزداد عدد الإلكترونات المتحررة، وتبقى طاقة كل إلكترون كما هي','تتضاعف طاقة كل إلكترون','يتوقف تحرر الإلكترونات','يتحول الضوء إلى بنفسجي'],a:0,exp:'الشدة = عدد الفوتونات. فوتونات أكثر ← إلكترونات أكثر، لكن طاقة كل فوتون (hν) لم تتغير.'},
 {t:'mcq',h:'عنصر مجهول',body:'<p>عنصر توزيعه الإلكتروني ينتهي بـ <span class="f">3p⁵</span>. أي العبارات صحيحة؟</p>',opts:['فيه 7 إلكترونات تكافؤ وعدده الذري 17','فيه 5 إلكترونات تكافؤ وعدده الذري 15','فيه 7 إلكترونات تكافؤ وعدده الذري 15','فيه 5 إلكترونات تكافؤ وعدده الذري 17'],a:0,exp:'1s² 2s² 2p⁶ 3s² 3p⁵ = 17 (الكلور)، وإلكترونات التكافؤ 3s² 3p⁵ = 7.'},
 {t:'mcq',h:'أيّها مستحيل؟',body:'<p>أي التوزيعات الآتية <b>مستحيل</b>؟</p>',opts:['<span class="f">1s² 2s² 2p⁷</span>','<span class="f">1s² 2s² 2p⁶ 3s¹</span>','<span class="f">1s² 2s¹</span>','<span class="f">1s² 2s² 2p³</span>'],a:0,exp:'المستوى الفرعي p فيه 3 أوربيتالات فقط، فيتسع لـ 6 إلكترونات على الأكثر.'},
 {t:'mcq',h:'طاقة الانتقالات',body:'<p>أي انتقال للإلكترون في ذرة الهيدروجين يطلق الفوتون ذا <b>الطاقة الأكبر</b>؟</p>',opts:['من n = 2 إلى n = 1','من n = 3 إلى n = 2','من n = 6 إلى n = 5','من n = 4 إلى n = 3'],a:0,exp:'الفجوة بين n = 1 و n = 2 هي الأكبر؛ لذلك تقع سلسلة ليمان في المنطقة فوق البنفسجية.'},
 {t:'num',h:'عدّ الإلكترونات المنفردة',body:'<p>كم إلكترونًا <b>منفردًا</b> (غير مزدوج) في ذرة الحديد <span class="f">Fe: [Ar] 4s² 3d⁶</span>؟</p>',a:4,tol:0,unit:'',exp:'3d⁶ في 5 أوربيتالات: ↑↓ ↑ ↑ ↑ ↑ ← <b>4</b> إلكترونات منفردة (و 4s² مزدوجان).',hint:'وزّع 6 إلكترونات على 5 أوربيتالات حسب قاعدة هوند.'}
]}
]},
/* ======================= الفصل 2: الجدول الدوري ======================= */
{n:2,name:'الجدول الدوري والتدرج في خواص العناصر',color:'#0f9fb8',badge:['🗺️','قارئ الجدول'],levels:[
{id:'2-1',title:'تطور الجدول الدوري الحديث',sub:'نيولاندز ومندليف وموزلي، القانون الدوري، الفلزات واللافلزات',steps:[
 {t:'info',h:'كيف وُلد الجدول؟',body:'<ul><li><b>نيولاندز</b>: لاحظ تكرار الخواص كل ثمانية عناصر (قانون الثمانيات).</li><li><b>مندليف</b>: رتّب العناصر حسب الكتلة الذرية وجمع المتشابهة في أعمدة، وترك فراغات تنبأ بخواص عناصرها قبل اكتشافها.</li><li><b>موزلي</b>: رتّب العناصر حسب <b>العدد الذري</b>، فاكتمل الجدول الحديث.</li></ul><div class="key"><b>القانون الدوري</b>: عند ترتيب العناصر حسب الزيادة في أعدادها الذرية يحدث تكرار دوري في خواصها.</div>'},
 {t:'sort',h:'من صاحب الإسهام؟',body:'',cats:['نيولاندز','مندليف','موزلي'],items:[['لاحظ تكرار الخواص كل ثمانية عناصر',0],['ترك فراغات لعناصر لم تُكتشف وتنبأ بخواصها',1],['رتّب العناصر حسب العدد الذري',2]],exp:'كل عالِم بنى على عمل من سبقه حتى وصلنا إلى الجدول الحديث.'},
 {t:'mcq',ch:1,h:'قرار مندليف الجريء',body:'<p>الكتلة الذرية للتيلوريوم Te (127.6) أكبر من اليود I (126.9)، ومع ذلك وضع مندليف التيلوريوم <b>قبل</b> اليود. لماذا؟</p>',opts:['لأن خواص اليود تشبه الهالوجينات (الكلور والبروم)، فقدّم تشابه الخواص على ترتيب الكتل','لأنه أخطأ في قياس الكتل','لأن اليود غاز','لأنه رتّب العناصر أبجديًا'],a:0,exp:'لاحقًا حلّ موزلي اللغز: العدد الذري لـ Te هو 52 ولـ I هو 53؛ فالترتيب حسب العدد الذري يوافق الخواص تمامًا.'},
 {t:'mcq',ch:1,h:'لماذا صدّق العلماء مندليف؟',body:'<p>ما الذي جعل جدول مندليف مقبولًا لدى العلماء أكثر من غيره؟</p>',opts:['تنبأ بخواص عناصر لم تكن مكتشفة، ثم اكتُشفت فعلًا مطابقة لتنبؤاته (مثل الجرمانيوم)','أنه أول جدول في التاريخ','أنه رتّب العناصر حسب العدد الذري','أن جدوله لم يكن فيه أي فراغ'],a:0,exp:'القدرة على التنبؤ الصحيح أقوى دليل على صحة النموذج العلمي.'},
 {t:'info',h:'استكشف الجدول',body:'<p>اضغط أي عنصر لتعرف موقعه وتصنيفه:</p>',widget:'ptable'},
 {t:'sort',h:'فلز أم لافلز أم شبه فلز؟',body:'<p>استعن بالجدول السابق إن احتجت:</p>',cats:['فلز','لافلز','شبه فلز'],items:[['الصوديوم Na',0],['السيليكون Si',2],['الكبريت S',1],['الحديد Fe',0],['الجرمانيوم Ge',2],['البروم Br',1]],exp:'أشباه الفلزات (مثل Si و Ge) تقع على الخط المتعرج بين الفلزات واللافلزات، ولها خواص من الطرفين — لذلك تُستخدم في صناعة الشرائح الإلكترونية.'},
 {t:'sort',h:'أسماء المجموعات',body:'',cats:['الفلزات القلوية','القلوية الأرضية','الهالوجينات','الغازات النبيلة'],items:[['المجموعة 1',0],['المجموعة 2',1],['المجموعة 17',2],['المجموعة 18',3]],exp:'العناصر الانتقالية تشغل المجموعات 3 إلى 12.'}
]},
{id:'2-2',title:'تصنيف العناصر',sub:'التوزيع الإلكتروني والموقع: الدورة والمجموعة والفئة',steps:[
 {t:'info',h:'التوزيع يحدد الموقع',body:'<div class="key"><b>الدورة</b> = رقم أعلى مستوى طاقة رئيس.<br><b>الفئة</b> (s, p, d, f) = المستوى الفرعي الذي يمتلئ أخيرًا.<br><b>المجموعة</b>: في الفئة s = عدد إلكترونات التكافؤ، وفي الفئة p = عدد إلكترونات التكافؤ + 10.</div><p>غيّر العرض إلى «الفئات s p d» وتأمّل الأشكال:</p>',widget:'pblock'},
 {t:'mcq',ch:1,h:'حدّد العنوان',body:'<p>عنصر توزيعه الإلكتروني <span class="f">[Ne] 3s² 3p³</span>. أين يقع؟</p>',opts:['الدورة 3، المجموعة 15، الفئة p','الدورة 3، المجموعة 5، الفئة p','الدورة 2، المجموعة 15، الفئة s','الدورة 5، المجموعة 3، الفئة d'],a:0,exp:'أعلى مستوى n = 3 ← الدورة 3. آخر ما امتلأ 3p ← الفئة p. إلكترونات التكافؤ 2 + 3 = 5 ← المجموعة 5 + 10 = 15 (الفوسفور).',hint:'طبّق القواعد الثلاث: أعلى n، آخر مستوى فرعي، وعدد إلكترونات التكافؤ.'},
 {t:'num',ch:1,h:'من العنوان إلى العنصر',body:'<p>عنصر يقع في <b>الدورة 4</b> و<b>المجموعة 2</b>. ما عدده الذري؟</p>',a:20,tol:0,unit:'',exp:'الدورة 4 والمجموعة 2 ← توزيعه [Ar] 4s² ← 18 + 2 = <b>20</b> (الكالسيوم).'},
 {t:'mcq',h:'سرّ تشابه المجموعة',body:'<p>لماذا تتشابه عناصر المجموعة الواحدة في خواصها الكيميائية؟</p>',opts:['لأن لها التوزيع نفسه لإلكترونات التكافؤ','لأن لها الكتلة الذرية نفسها','لأن لها عدد المستويات نفسه','لأن لها عدد النيوترونات نفسه'],a:0,exp:'إلكترونات التكافؤ هي التي تشارك في التفاعلات؛ فإذا تشابه توزيعها تشابه السلوك الكيميائي.'},
 {t:'sort',h:'إلى أي فئة؟',body:'',cats:['s','p','d','f'],items:[['<span class="f">[Kr] 5s¹</span>',0],['<span class="f">[Ne] 3s² 3p⁵</span>',1],['<span class="f">[Ar] 4s² 3d⁶</span>',2],['<span class="f">[Xe] 6s² 4f³</span>',3]],exp:'انظر إلى آخر مستوى فرعي يدخله الإلكترون.'},
 {t:'mcq',ch:1,h:'لماذا عشرة أعمدة؟',body:'<p>لماذا تتكوّن الفئة d من عشر مجموعات بالضبط، بينما الفئة p من ست مجموعات؟</p>',opts:['لأن المستوى الفرعي d فيه 5 أوربيتالات تتسع لـ 10 إلكترونات، و p فيه 3 أوربيتالات تتسع لـ 6','لأن عناصر d أثقل','بالمصادفة التاريخية','لأن مندليف رتّبها هكذا'],a:0,exp:'شكل الجدول الدوري نفسه «صورة» لسعة المستويات الفرعية: s = 2 عمود، p = 6، d = 10، f = 14.'},
 {t:'mcq',ch:1,h:'لغز الهيليوم',body:'<p>توزيع الهيليوم <span class="f">1s²</span> (فئة s)، ومع ذلك يوضع في المجموعة 18 مع الغازات النبيلة (فئة p). لماذا؟</p>',opts:['لأن مستواه الخارجي ممتلئ مثل الغازات النبيلة، فخواصه مشابهة لها (خامل)','لأنه أخف العناصر','لأنه غاز','لأن له إلكترونين مثل الفلزات القلوية الأرضية'],a:0,exp:'الخواص هي المعيار الأهم: مستوى الهيليوم الوحيد ممتلئ تمامًا، فهو مستقر وخامل كالغازات النبيلة.'}
]},
{id:'2-3',title:'تدرج خواص العناصر',sub:'نصف القطر الذري والأيوني، طاقة التأين، الكهروسالبية',steps:[
 {t:'info',h:'اكتشف الأنماط بنفسك',body:'<p>بدّل بين «نصف القطر» و«طاقة التأين» و«الكهروسالبية»، وابحث عن النمط: عبر الدورة (من اليسار إلى اليمين) وفي المجموعة (من الأعلى إلى الأسفل).</p>',widget:'ptrend'},
 {t:'mcq',ch:1,h:'لماذا تصغر الذرة عبر الدورة؟',body:'<p>نصف قطر الصوديوم 186 pm ونصف قطر الكلور 100 pm، مع أن الكلور فيه إلكترونات أكثر. ما التفسير؟</p>',opts:['تزداد الشحنة الموجبة للنواة عبر الدورة، والإلكترونات تضاف إلى المستوى نفسه، فتنجذب أقوى نحو النواة','الكلور فيه مستويات طاقة أقل','الإلكترونات الإضافية تتنافر فتصغر الذرة','الكلور غاز فذرته أصغر'],a:0,exp:'عدد المستويات ثابت عبر الدورة (3 مستويات لـ Na و Cl)، لكن البروتونات تزداد من 11 إلى 17 فتشد الإلكترونات أكثر.'},
 {t:'mcq',h:'الأكبر حجمًا',body:'<p>أي الذرات الآتية لها أكبر نصف قطر؟</p>',opts:['K','Na','Mg','Cl'],a:0,exp:'البوتاسيوم في الدورة 4 (مستوى طاقة إضافي) وفي أقصى اليسار.'},
 {t:'mcq',ch:1,h:'الأيون والذرة',body:'<p>قارن الحجم: ذرة Na مع أيون <span class="f">Na⁺</span>، وذرة Cl مع أيون <span class="f">Cl⁻</span>.</p>',opts:['Na⁺ أصغر من Na، و Cl⁻ أكبر من Cl','Na⁺ أكبر من Na، و Cl⁻ أصغر من Cl','كلا الأيونين أصغر من ذرتيهما','لا يتغير الحجم عند تكوين الأيونات'],a:0,exp:'Na يفقد مستواه الخارجي كله فيصغر كثيرًا. Cl يكتسب إلكترونًا فيزداد التنافر بين الإلكترونات فيكبر.'},
 {t:'mcq',ch:1,h:'محقّق طاقات التأين',body:`<p>طاقات التأين المتتالية لعنصر X في الدورة الثالثة (kJ/mol):</p>${TB(['الأولى','الثانية','الثالثة','الرابعة'],[['738','1451','7733','10540']])}<p>إلى أي مجموعة ينتمي X؟</p>`,opts:['المجموعة 2','المجموعة 1','المجموعة 3','المجموعة 13'],a:0,exp:'القفزة الهائلة بعد الطاقة الثانية تعني أن الإلكترون الثالث يُنزع من مستوى داخلي مكتمل. إذن للعنصر إلكترونا تكافؤ ← المجموعة 2 (المغنيسيوم).',hint:'ابحث عن القفزة الكبيرة: بعد أي إلكترون صار النزع صعبًا جدًا؟'},
 {t:'build',h:'رتّب حسب طاقة التأين الأولى',body:'<p>رتّب من <b>الأقل</b> إلى <b>الأعلى</b> طاقة تأين أولى:</p>',tiles:['K','Na','Mg','Cl'],answers:[['K','Na','Mg','Cl']],exp:'طاقة التأين تقل في المجموعة (K &lt; Na) وتزداد عبر الدورة (Na &lt; Mg &lt; Cl). الإلكترون البعيد عن النواة أسهل في النزع.'},
 {t:'mcq',h:'الأعلى كهروسالبية',body:'<p>أي العناصر الآتية له أعلى كهروسالبية؟</p>',opts:['F','Cl','O','Na'],a:0,exp:'الفلور أعلى العناصر كهروسالبية (3.98): صغير جدًا وشحنة نواته الفعالة كبيرة.'},
 {t:'mcq',ch:1,h:'الغائبون عن الجدول',body:'<p>في كثير من جداول الكهروسالبية لا تُعطى قيم للهيليوم والنيون والأرجون. لماذا؟</p>',opts:['لأنها نادرًا ما تكوّن مركبات، فلا تجذب إلكترونات في روابط','لأن قيمها كبيرة جدًا','لأنها فلزات','لأنها لم تُكتشف بعد'],a:0,exp:'الكهروسالبية مقياس لجذب الذرة للإلكترونات في <b>رابطة</b>. الغازات النبيلة مستقرة بمستويات ممتلئة فلا تكوّن روابط عادة.'}
]},
{id:'b2',boss:true,title:'تحدّي الفصل الثاني',sub:'الجدول الدوري وتدرّج الخواص — 3 قلوب',steps:[
 {t:'mcq',h:'عنصر من الدورة الرابعة',body:'<p>عنصر توزيعه <span class="f">[Ar] 4s² 3d¹⁰ 4p⁵</span>. أي وصف صحيح؟</p>',opts:['هالوجين في الدورة 4، المجموعة 17','غاز نبيل في الدورة 4','عنصر انتقالي في المجموعة 7','فلز قلوي في الدورة 4'],a:0,exp:'4s² 4p⁵ ← 7 إلكترونات تكافؤ في الفئة p ← المجموعة 17 (البروم).'},
 {t:'build',h:'رتّب حسب نصف القطر',body:'<p>رتّب من <b>الأصغر</b> إلى <b>الأكبر</b> نصف قطر:</p>',tiles:['F','O','S','Na'],answers:[['F','O','S','Na']],exp:'F &lt; O (عبر الدورة الثانية)، ثم S في الدورة الثالثة أكبر، و Na في أقصى يسار الدورة الثالثة الأكبر.'},
 {t:'mcq',h:'أيونات متساوية الإلكترونات',body:'<p>الأيونات <span class="f">O²⁻</span> و <span class="f">F⁻</span> و <span class="f">Na⁺</span> و <span class="f">Mg²⁺</span> لها جميعًا 10 إلكترونات. أيها الأصغر حجمًا؟</p>',opts:['Mg²⁺','O²⁻','F⁻','Na⁺'],a:0,exp:'العدد نفسه من الإلكترونات، لكن Mg²⁺ فيه أكبر عدد من البروتونات (12) فيجذبها أقوى ويكون أصغر.'},
 {t:'mcq',h:'قفزة مبكرة',body:`<p>طاقات التأين لعنصر (kJ/mol): ${TB(['الأولى','الثانية','الثالثة'],[['496','4562','6910']])} أي عنصر هو على الأرجح؟</p>`,opts:['الصوديوم Na','المغنيسيوم Mg','الألومنيوم Al','الكلور Cl'],a:0,exp:'القفزة بعد الطاقة الأولى مباشرة ← إلكترون تكافؤ واحد ← فلز قلوي.'},
 {t:'mcq',h:'تدرج الكهروسالبية',body:'<p>كيف تتغير الكهروسالبية؟</p>',opts:['تزداد عبر الدورة من اليسار إلى اليمين، وتقل في المجموعة من الأعلى إلى الأسفل','تقل عبر الدورة وتزداد في المجموعة','تزداد في الاتجاهين','لا نمط لها'],a:0,exp:'نمط الكهروسالبية يشبه نمط طاقة التأين ويعاكس نمط نصف القطر.'},
 {t:'mcq',h:'لماذا لا يكوّن الصوديوم Na²⁺؟',body:'<p>اعتمادًا على طاقات التأين، لماذا يكوّن الصوديوم أيون Na⁺ فقط؟</p>',opts:['لأن نزع الإلكترون الثاني يكون من مستوى داخلي مكتمل ويحتاج طاقة ضخمة','لأن الصوديوم لا يملك إلكترونًا ثانيًا','لأن Na²⁺ أكبر من Na⁺','لأن قاعدة هوند تمنع ذلك'],a:0,exp:'بعد فقد إلكترون واحد يصل الصوديوم إلى توزيع النيون المستقر، وكسر هذا الاستقرار مكلف جدًا.'}
]}
]},
/* ======================= الفصل 3: المركبات الأيونية والفلزات ======================= */
{n:3,name:'المركبات الأيونية والفلزات',color:'#e0641c',badge:['🧂','صانع البلورات'],levels:[
{id:'3-1',title:'تكوّن الأيون',sub:'الأيونات الموجبة والسالبة وقاعدة الثمانية',steps:[
 {t:'info',h:'رحلة نحو الاستقرار',body:'<p>تميل الذرات إلى الوصول إلى توزيع الغاز النبيل (ثمانية إلكترونات في المستوى الخارجي) <b>بأقل طاقة ممكنة</b>: الفلزات تفقد إلكترونات، واللافلزات تكتسب.</p>',widget:'ionform'},
 {t:'mcq',h:'أيون المغنيسيوم',body:'<p>المغنيسيوم Mg (المجموعة 2، التوزيع <span class="f">[Ne] 3s²</span>). ما الأيون الذي يكوّنه؟</p>',opts:['<span class="f">Mg²⁺</span>','<span class="f">Mg⁺</span>','<span class="f">Mg²⁻</span>','<span class="f">Mg⁶⁻</span>'],a:0,exp:'يفقد إلكتروني 3s فيصبح توزيعه مثل النيون.'},
 {t:'mcq',ch:1,h:'لماذا لا يفقد الأكسجين ستة؟',body:'<p>الأكسجين فيه 6 إلكترونات تكافؤ. نظريًا يمكنه فقدها كلها ليصل إلى توزيع الهيليوم الداخلي. لماذا يكتسب إلكترونين بدلًا من ذلك؟</p>',opts:['لأن اكتساب إلكترونين يحتاج طاقة أقل بكثير من نزع ستة إلكترونات تجذبها النواة بقوة','لأن الأكسجين غاز','لأن الإلكترونات الستة غير موجودة فعلًا','لأن قاعدة الثمانية تمنع الفقد'],a:0,exp:'طاقات التأين للأكسجين مرتفعة جدًا، أما جذبه لإلكترونات إضافية فقوي (كهروسالبية عالية). الذرة تسلك أسهل الطرق إلى الاستقرار.'},
 {t:'sort',h:'ما شحنة الأيون؟',body:'',cats:['+1','+2','+3','−1','−2','−3'],items:[['البوتاسيوم K',0],['الكالسيوم Ca',1],['الألومنيوم Al',2],['البروم Br',3],['الكبريت S',4],['النيتروجين N',5]],exp:'من رقم المجموعة: 1 ← +1، 2 ← +2، 13 ← +3، 15 ← −3، 16 ← −2، 17 ← −1.'},
 {t:'mcq',ch:1,h:'توائم إلكترونية',body:'<p>أي الأيونات الآتية له توزيع النيون <span class="f">1s² 2s² 2p⁶</span>؟</p>',opts:['<span class="f">N³⁻</span>','<span class="f">Cl⁻</span>','<span class="f">K⁺</span>','<span class="f">S²⁻</span>'],a:0,exp:'N (7 إلكترونات) + 3 = 10 إلكترونات مثل النيون. أما Cl⁻ و K⁺ و S²⁻ فلها توزيع الأرجون (18).'},
 {t:'mcq',h:'شبه الغاز النبيل',body:'<p>عندما يكوّن الخارصين أيون <span class="f">Zn²⁺</span> يفقد إلكتروني 4s. ما توزيعه الإلكتروني؟</p>',opts:['<span class="f">[Ar] 3d¹⁰</span> (توزيع شبه الغاز النبيل)','<span class="f">[Ar] 4s²</span>','<span class="f">[Ar] 3d⁸ 4s²</span>','<span class="f">[Kr]</span>'],a:0,exp:'الفلزات الانتقالية تفقد إلكترونات 4s أولًا. المستوى الخارجي الجديد (3s² 3p⁶ 3d¹⁰) ممتلئ ومستقر.'}
]},
{id:'3-2',title:'الروابط الأيونية والمركبات الأيونية',sub:'الشبكة البلورية، الخواص، طاقة الشبكة',steps:[
 {t:'info',h:'تجاذب لا ينتهي',body:'<div class="key"><b>الرابطة الأيونية</b>: قوة التجاذب الكهروستاتيكي بين أيونات مختلفة الشحنة.</div><p>في المركب الأيوني تترتب الأيونات في <b>شبكة بلورية</b> ثلاثية الأبعاد: كل أيون موجب محاط بأيونات سالبة والعكس.</p><div class="key"><b>طاقة الشبكة البلورية</b>: الطاقة اللازمة لفصل أيونات مول واحد من المركب الأيوني. تزداد بزيادة شحنة الأيونات وصغر حجمها.</div>'},
 {t:'multi',h:'خواص المركبات الأيونية',body:'<p>اختر كل الخواص التي تنطبق على المركبات الأيونية:</p>',opts:['درجات انصهار وغليان مرتفعة','صلبة وقاسية لكنها هشّة','توصل الكهرباء وهي صلبة','توصل الكهرباء عند صهرها أو إذابتها في الماء','قابلة للطرق والسحب'],a:[0,1,3],exp:'الأيونات في الصلب مثبتة في الشبكة فلا توصل، وعند الصهر أو الإذابة تتحرر وتنقل الشحنة.'},
 {t:'mcq',ch:1,h:'لماذا تتكسر البلورة؟',body:'<p>إذا طرقت بلورة ملح بمطرقة فإنها تتحطم بدل أن تنبعج. ما التفسير؟</p>',opts:['تنزاح طبقات الأيونات فتتقابل أيونات متشابهة الشحنة فتتنافر وتنشق البلورة','لأن الروابط الأيونية ضعيفة','لأن الملح يحتوي على ماء','لأن الإلكترونات تتحرر'],a:0,exp:'إزاحة صغيرة كافية لوضع + أمام + و − أمام −، فيتحول التجاذب إلى تنافر.'},
 {t:'mcq',ch:1,h:'ملح صلب وملح مصهور',body:'<p>بلورة كلوريد الصوديوم الصلبة لا توصل التيار الكهربائي، لكن الملح نفسه عند صهره يوصل. لماذا؟</p>',opts:['في الحالة المنصهرة تصبح الأيونات حرة الحركة فتنقل الشحنة','الحرارة تولّد إلكترونات جديدة','الملح المصهور يتحول إلى فلز','التوصيل سببه الماء المختلط بالملح'],a:0,exp:'التوصيل يحتاج جسيمات مشحونة <b>متحركة</b>. الأيونات موجودة في الحالتين، لكنها لا تتحرك إلا بعد كسر الشبكة.'},
 {t:'mcq',ch:1,h:'أيهما أقوى؟',body:'<p>أيّ المركبين له طاقة شبكة بلورية أكبر: <span class="f">MgO</span> (أيونات 2+ و 2−) أم <span class="f">NaCl</span> (أيونات 1+ و 1−)؟ وماذا تتوقع عن درجة انصهاره؟</p>',opts:['MgO، لأن شحنات أيوناته أكبر؛ لذلك درجة انصهاره أعلى بكثير','NaCl، لأنه أكثر شيوعًا','متساويان لأن كليهما أيوني','NaCl، لأن أيوناته أكبر حجمًا'],a:0,exp:'التجاذب يزداد بزيادة الشحنة: MgO ينصهر قرابة 2800 °C بينما NaCl عند 801 °C.'},
 {t:'mcq',h:'الإلكتروليت',body:'<p>المركب الأيوني الذي يوصل محلوله المائي التيار الكهربائي يسمى:</p>',opts:['إلكتروليت','سبيكة','مركب جزيئي','شبه فلز'],a:0,exp:'محاليل الإلكتروليتات توصل الكهرباء بسبب أيوناتها الحرة — مثل الأملاح في سوائل الجسم.'}
]},
{id:'3-3',title:'صيغ المركبات الأيونية وأسماؤها',sub:'وحدة الصيغة، الأيونات المتعددة الذرات، التسمية',steps:[
 {t:'info',h:'مختبر الصيغ',body:'<p>اختر أيونًا موجبًا وأيونًا سالبًا، وراقب كيف تتعادل الشحنات لتكوين <b>وحدة الصيغة</b>:</p>',widget:'crisscross',after:'<div class="key">قاعدة: مجموع الشحنات الموجبة = مجموع الشحنات السالبة. ونسمّي المركب بذكر اسم الأيون السالب ثم الموجب.</div>'},
 {t:'mcq',h:'أكسيد الألومنيوم',body:'<p>ما صيغة المركب الناتج من <span class="f">Al³⁺</span> و <span class="f">O²⁻</span>؟</p>',opts:[F('Al2O3'),F('AlO'),F('Al3O2'),F('AlO3')],a:0,exp:'2 × (+3) = +6 و 3 × (−2) = −6 ← Al₂O₃'},
 {t:'build',ch:1,h:'ركّب الصيغة',body:'<p>ركّب صيغة <b>فوسفات الكالسيوم</b> من الأيونين <span class="f">Ca²⁺</span> و <span class="f">PO₄³⁻</span>:</p>',tiles:['Ca3','(PO4)2','Ca2','(PO4)3','PO4'],answers:[['Ca3','(PO4)2']],exp:'3 × (+2) = +6 و 2 × (−3) = −6 ← Ca₃(PO₄)₂. والقوسان ضروريان لأن الرقم 2 يخص المجموعة PO₄ كلها.'},
 {t:'mcq',ch:1,h:'لماذا القوسان؟',body:`<p>كتب طالب صيغة هيدروكسيد المغنيسيوم هكذا: ${F('MgOH2')}. ما المشكلة؟</p>`,opts:[`الصيغة تعني ذرة O واحدة وذرتي H، والصحيح ${F('Mg(OH)2')} لأن الأيون OH⁻ كله يتكرر مرتين`,'لا مشكلة، الصيغتان متطابقتان','يجب أن تكون MgOH','يجب أن تكون Mg₂OH'],a:0,exp:'الرقم السفلي خارج القوس يضاعف كل ما بداخله: Mg(OH)₂ فيه ذرتا O وذرتا H.'},
 {t:'mcq',ch:1,h:'استنتج الشحنة من الصيغة',body:`<p>ما الاسم الصحيح للمركب ${F('Fe2O3')}؟ (تذكّر: شحنة أيون الأكسيد −2، وللحديد شحنتان محتملتان +2 و +3)</p>`,opts:['أكسيد الحديد III','أكسيد الحديد II','أكسيد الحديد','ثالث أكسيد ثنائي الحديد'],a:0,exp:'3 × (−2) = −6، توزَّع على ذرتي حديد ← كل ذرة +3. نكتب الشحنة برقم روماني للفلزات التي لها أكثر من شحنة.',hint:'مجموع شحنات الأكسجين ÷ عدد ذرات الحديد = شحنة كل أيون حديد.'},
 {t:'sort',h:'أسماء الأيونات الأكسجينية',body:'',cats:['نترات','نتريت','كبريتات','كبريتيت','هيبوكلوريت','بيركلورات'],items:[['<span class="f">NO₃⁻</span>',0],['<span class="f">NO₂⁻</span>',1],['<span class="f">SO₄²⁻</span>',2],['<span class="f">SO₃²⁻</span>',3],['<span class="f">ClO⁻</span>',4],['<span class="f">ClO₄⁻</span>',5]],exp:'الأيون الأكثر أكسجينًا ينتهي بـ «ات» والأقل بـ «يت». وللكلور أربعة: هيبوكلوريت ClO⁻، كلوريت ClO₂⁻، كلورات ClO₃⁻، بيركلورات ClO₄⁻.'},
 {t:'mcq',h:'سمِّ المركب',body:`<p>ما اسم ${F('CuCl2')}؟</p>`,opts:['كلوريد النحاس II','كلوريد النحاس I','ثنائي كلوريد النحاس','كلورات النحاس'],a:0,exp:'أيونا كلوريد (−1 لكل منهما) ← النحاس +2 ← النحاس II.'}
]},
{id:'3-4',title:'الروابط الفلزية وخواص الفلزات',sub:'نموذج بحر الإلكترونات، الخواص، السبائك',steps:[
 {t:'info',h:'بحر من الإلكترونات',body:'<div class="key"><b>نموذج بحر الإلكترونات</b>: ذرات الفلز تتشارك إلكترونات تكافئها في «بحر» من <b>الإلكترونات الحرة غير المتمركزة</b> تتحرك بين الأيونات الموجبة.<br><b>الرابطة الفلزية</b>: قوة التجاذب بين الأيونات الموجبة والإلكترونات الحرة المحيطة بها.</div><div class="key"><b>السبيكة</b>: مخلوط من عناصر لها خواص فلزية. <b>إحلالية</b>: ذرات متقاربة الحجم تحل محل بعضها (النحاس الأصفر). <b>بينية</b>: ذرات صغيرة تملأ الفراغات بين الذرات الكبيرة (الفولاذ الكربوني).</div>'},
 {t:'mcq',ch:1,h:'فلز ينبعج… وملح يتكسّر',body:'<p>لماذا يمكن طرق الفلز وتشكيله، بينما تتحطم البلورة الأيونية؟</p>',opts:['في الفلز تنزلق الأيونات الموجبة عبر بحر الإلكترونات دون أن تتقابل شحنات متشابهة فتتنافر','لأن الروابط الفلزية أضعف من الأيونية دائمًا','لأن الفلزات لا تحتوي على أيونات','لأن الفلزات سائلة داخليًا'],a:0,exp:'بحر الإلكترونات «يلصق» الأيونات أينما تحركت. أما في البلورة الأيونية فالإزاحة تضع أيونات متشابهة متقابلة.'},
 {t:'mcq',h:'سر التوصيل',body:'<p>لماذا توصل الفلزات الكهرباء والحرارة جيدًا؟</p>',opts:['لأن الإلكترونات غير المتمركزة تتحرك بحرية عبر الفلز','لأن الأيونات الموجبة تتحرك بسرعة','لأن الفلزات تحتوي على ماء','لأن الفلزات لها كهروسالبية عالية'],a:0,exp:'الإلكترونات الحرة تنقل الشحنة والطاقة بسرعة من طرف إلى آخر.'},
 {t:'mcq',ch:1,h:'لماذا ينصهر الحديد عند حرارة أعلى؟',body:'<p>ينصهر الصوديوم عند 98 °C، بينما ينصهر الحديد عند 1538 °C. ما التفسير الأقرب وفق نموذج بحر الإلكترونات؟</p>',opts:['الحديد يساهم بعدد أكبر من الإلكترونات غير المتمركزة (بما فيها إلكترونات d)، فالرابطة الفلزية أقوى','الصوديوم أثقل من الحديد','الحديد ليس فلزًا','الصوديوم فيه روابط أيونية'],a:0,exp:'كلما زاد عدد الإلكترونات الحرة وشحنة الأيونات زادت قوة التجاذب، فيحتاج فصل الذرات (الانصهار) طاقة أكبر.'},
 {t:'sort',h:'إحلالية أم بينية؟',body:'',cats:['سبيكة إحلالية','سبيكة بينية'],items:[['النحاس الأصفر (نحاس + خارصين)',0],['الفولاذ الكربوني (حديد + كربون)',1],['الفضة الإسترلينية (فضة + نحاس)',0]],exp:'ذرات الكربون صغيرة جدًا مقارنة بالحديد فتسكن الفراغات بينها، أما النحاس والخارصين (أو الفضة والنحاس) فمتقاربة الحجم.'},
 {t:'mcq',ch:1,h:'لماذا السبيكة أقسى؟',body:'<p>الفولاذ أقسى من الحديد النقي. لماذا؟</p>',opts:['ذرات الكربون الصغيرة بين ذرات الحديد تعيق انزلاق الطبقات فوق بعضها','الكربون يحوّل الحديد إلى مركب أيوني','الفولاذ يحتوي على إلكترونات أكثر حرية','الكربون يزيل الإلكترونات الحرة'],a:0,exp:'وجود ذرات مختلفة الحجم يكسر انتظام الطبقات، فيصعب انزلاقها؛ لذلك تكون السبائك عادة أقسى وأقوى.'}
]},
{id:'b3',boss:true,title:'تحدّي الفصل الثالث',sub:'الأيونات والصيغ والفلزات — 3 قلوب',steps:[
 {t:'mcq',h:'صيغة كبريتات الأمونيوم',body:'<p>ما صيغة المركب المكوّن من <span class="f">NH₄⁺</span> و <span class="f">SO₄²⁻</span>؟</p>',opts:[F('(NH4)2SO4'),F('NH4SO4'),F('NH4(SO4)2'),F('NH42SO4')],a:0,exp:'أيونا أمونيوم (+2) يعادلان أيون كبريتات واحدًا (−2)، والقوسان لأن 2 يخص NH₄ كله.'},
 {t:'num',h:'عدد الذرات',body:`<p>كم ذرة في وحدة صيغة واحدة من ${F('Ca3(PO4)2')}؟</p>`,a:13,tol:0,unit:'ذرة',exp:'3 Ca + 2 P + 8 O = <b>13</b>'},
 {t:'mcq',h:'أي مادة توصل؟',body:'<p>أي المواد الآتية توصل الكهرباء في الحالة الصلبة؟</p>',opts:['النحاس','كلوريد الصوديوم','أكسيد المغنيسيوم','السكر'],a:0,exp:'الفلزات وحدها فيها إلكترونات حرة في الحالة الصلبة.'},
 {t:'mcq',h:'شحنة مجهولة',body:`<p>المركب ${F('X2(SO4)3')} يحتوي على الأيون <span class="f">SO₄²⁻</span>. ما شحنة أيون X؟</p>`,opts:['+3','+2','+6','+1'],a:0,exp:'3 × (−2) = −6 موزعة على ذرتين ← كل X شحنته +3 (مثل Al³⁺ أو Fe³⁺).'},
 {t:'mcq',h:'ترتيب طاقة الشبكة',body:'<p>أي المركبات الآتية يُتوقع أن يكون له <b>أعلى</b> طاقة شبكة بلورية؟</p>',opts:[F('MgO'),F('NaCl'),F('KBr'),F('NaBr')],a:0,exp:'أعلى شحنات (2+ و 2−) وأيونات صغيرة نسبيًا.'},
 {t:'mcq',h:'سمِّ بدقة',body:`<p>ما اسم ${F('Fe(NO3)2')}؟</p>`,opts:['نترات الحديد II','نترات الحديد III','نتريت الحديد II','ثنائي نترات الحديد'],a:0,exp:'أيونا نترات (−1 لكل منهما) ← الحديد +2 ← نترات الحديد II.'}
]}
]},
/* ======================= الفصل 4: الروابط التساهمية ======================= */
{n:4,name:'الروابط التساهمية',color:'#d9468f',badge:['🔗','مهندس الجزيئات'],levels:[
{id:'4-1',title:'الرابطة التساهمية',sub:'المشاركة، الروابط الأحادية والثنائية والثلاثية، سيجما وباي، طاقة الرابطة',steps:[
 {t:'info',h:'المشاركة بدل الانتقال',body:'<div class="key"><b>الرابطة التساهمية</b>: رابطة تنشأ عن مشاركة ذرتين (غالبًا لافلزين) بزوج أو أكثر من إلكترونات التكافؤ.</div><ul><li>أحادية (زوج واحد) = رابطة سيجما σ واحدة.</li><li>ثنائية (زوجان) = σ + π.</li><li>ثلاثية (ثلاثة أزواج) = σ + 2π.</li></ul><p>كلما زاد عدد الأزواج المشتركة: <b>قصر طول الرابطة وزادت قوتها</b>.</p><div class="key"><b>طاقة تفكك الرابطة</b>: الطاقة اللازمة لكسر رابطة تساهمية. كسر الروابط يمتص طاقة، وتكوينها يطلق طاقة.</div>'},
 {t:'sort',h:'نوع الرابطة',body:'',cats:['أحادية','ثنائية','ثلاثية'],items:[['<span class="f">H–H</span> في H₂',0],['<span class="f">O=O</span> في O₂',1],['<span class="f">N≡N</span> في N₂',2],['<span class="f">Cl–Cl</span> في Cl₂',0]],exp:'H و Cl يحتاج كل منهما إلكترونًا واحدًا، و O يحتاج اثنين، و N يحتاج ثلاثة لإكمال الثمانية.'},
 {t:'mcq',h:'سيجما وباي',body:'<p>كم رابطة σ وكم رابطة π في جزيء النيتروجين <span class="f">N≡N</span>؟</p>',opts:['1 σ و 2 π','3 σ','2 σ و 1 π','3 π'],a:0,exp:'أول رابطة بين ذرتين دائمًا σ، وأي روابط إضافية تكون π.'},
 {t:'mcq',ch:1,h:'الأقصر والأقوى',body:`${TB(['الرابطة','الطول (pm)','طاقة التفكك (kJ/mol)'],[['C–C','154','348'],['C=C','134','614'],['C≡C','120','839']])}<p>ما العلاقة التي يدعمها الجدول؟</p>`,opts:['كلما زاد عدد الأزواج المشتركة قصرت الرابطة وزادت الطاقة اللازمة لكسرها','الرابطة الأطول هي الأقوى','عدد الأزواج لا يؤثر في القوة','الرابطة الثلاثية أطول من الأحادية'],a:0,exp:'ثلاثة أزواج تشد الذرتين أقرب وبقوة أكبر؛ لذلك جزيء N≡N مستقر جدًا وخامل نسبيًا.'},
 {t:'mcq',ch:1,h:'طارد أم ماص؟',body:'<p>في تفاعل ما، الطاقة اللازمة لكسر روابط المتفاعلات <b>أقل</b> من الطاقة المنطلقة عند تكوين روابط النواتج. كيف يُصنّف التفاعل؟</p>',opts:['طارد للحرارة','ماص للحرارة','لا طارد ولا ماص','لا يمكن الحكم'],a:0,exp:'المحصلة: طاقة منطلقة أكبر من الممتصة ← فائض طاقة يخرج إلى المحيط.'},
 {t:'num',ch:1,h:'عدّ روابط باي',body:'<p>جزيء ثاني أكسيد الكربون <span class="f">O=C=O</span>: كم رابطة π فيه؟</p>',a:2,tol:0,unit:'',exp:'رابطتان ثنائيتان، في كل منهما σ و π ← 2σ و <b>2π</b>.'},
 {t:'mcq',h:'لماذا الغازات النبيلة وحيدة؟',body:'<p>لماذا توجد الغازات النبيلة ذرات منفردة نادرًا ما تكوّن روابط تساهمية؟</p>',opts:['لأن مستوياتها الخارجية ممتلئة أصلًا، فلا تكسب استقرارًا بالمشاركة','لأنها فلزات','لأن ذراتها كبيرة جدًا','لأنها لا تحتوي على إلكترونات'],a:0,exp:'الدافع لتكوين الروابط هو الوصول إلى الاستقرار، وهي مستقرة بالفعل.'}
]},
{id:'4-2',title:'تسمية الجزيئات',sub:'البادئات في المركبات الجزيئية الثنائية، تسمية الأحماض',steps:[
 {t:'info',h:'بادئات العدد',body:`<p>اللافلزات يمكن أن تتحد بنسب مختلفة (CO و CO₂)، لذلك نستخدم بادئات تبيّن عدد الذرات:</p>${TB(['العدد','1','2','3','4','5','6'],[['البادئة','أول / أحادي','ثاني / ثنائي','ثالث / ثلاثي','رابع / رباعي','خامس / خماسي','سادس / سداسي']])}<p>أمثلة: ${F('CO')} أول أكسيد الكربون، ${F('CO2')} ثاني أكسيد الكربون، ${F('N2O5')} خامس أكسيد ثنائي النيتروجين.</p><div class="key"><b>الأحماض</b>: الأيون المنتهي بـ «ات» ← حمض ينتهي بـ «يك» (نترات ← حمض النيتريك)، و«يت» ← «وز» (نتريت ← حمض النيتروز). والأحماض الثنائية: HCl(aq) حمض الهيدروكلوريك.</div>`},
 {t:'mcq',h:'سمِّ الجزيء',body:`<p>ما اسم ${F('CCl4')}؟</p>`,opts:['رابع كلوريد الكربون','كلوريد الكربون','كلوريد الكربون IV','رباعي كربون الكلور'],a:0,exp:'4 ذرات كلور ← «رابع كلوريد»، وذرة كربون واحدة.'},
 {t:'mcq',h:'من الاسم إلى الصيغة',body:'<p>ما صيغة «ثالث أكسيد الكبريت»؟</p>',opts:[F('SO3'),F('S3O'),F('SO2'),F('S2O3')],a:0,exp:'ذرة كبريت واحدة وثلاث ذرات أكسجين.'},
 {t:'mcq',ch:1,h:'لماذا بادئات هنا فقط؟',body:`<p>نسمّي ${F('MgCl2')} «كلوريد المغنيسيوم» دون بادئة، لكن ${F('SCl2')} «ثاني كلوريد الكبريت». لماذا؟</p>`,opts:['لأن شحنة Mg²⁺ ثابتة فالنسبة معروفة، أما اللافلزات فتتحد بنسب متعددة فلا بد من تحديد العدد','لأن المغنيسيوم أثقل','لأن SCl₂ مركب أيوني','لا يوجد سبب، مجرد عرف'],a:0,exp:'في المركب الأيوني تحدد الشحنات النسبة تلقائيًا. أما الكبريت والكلور فقد يكوّنان SCl₂ و S₂Cl₂… فالاسم يجب أن يميّزها.'},
 {t:'sort',h:'سمِّ الأحماض',body:'',cats:['حمض النيتريك','حمض النيتروز','حمض الكبريتيك','حمض الهيدروكلوريك'],items:[[F('HNO3'),0],[F('HNO2'),1],[F('H2SO4'),2],['<span class="f">HCl(aq)</span>',3]],exp:'NO₃⁻ نترات ← نيتريك. NO₂⁻ نتريت ← نيتروز. SO₄²⁻ كبريتات ← كبريتيك. وHCl حمض ثنائي (لا أكسجين فيه) ← هيدرو…يك.'},
 {t:'mcq',ch:1,h:'طبّق القاعدة على أيون جديد',body:`<p>الأيون ${'<span class="f">ClO₂⁻</span>'} اسمه «كلوريت». ما اسم الحمض ${F('HClO2')}؟</p>`,opts:['حمض الكلوروز','حمض الكلوريك','حمض الهيدروكلوريك','حمض البيركلوريك'],a:0,exp:'«يت» ← «وز». أما HClO₃ (من كلورات) فهو حمض الكلوريك.'},
 {t:'mcq',h:'اسم صعب',body:`<p>ما اسم ${F('N2O4')}؟</p>`,opts:['رابع أكسيد ثنائي النيتروجين','ثاني أكسيد النيتروجين','أكسيد النيتروجين IV','رابع نيتريد الأكسجين'],a:0,exp:'4 ذرات أكسجين ← رابع أكسيد، وذرتا نيتروجين ← ثنائي النيتروجين.'}
]},
{id:'4-3',title:'التراكيب الجزيئية',sub:'تراكيب لويس، الرنين، الاستثناءات، الرابطة التناسقية',steps:[
 {t:'info',h:'خطوات رسم تركيب لويس',body:'<ol><li>احسب مجموع إلكترونات التكافؤ (أضف إلكترونًا لكل شحنة سالبة واطرح لكل موجبة).</li><li>اختر الذرة المركزية (الأقل كهروسالبية غالبًا، وليست الهيدروجين).</li><li>صِل الذرات بروابط أحادية، ثم وزّع الباقي لإكمال الثمانيات.</li><li>إذا لم تكتمل ثمانية الذرة المركزية حوّل أزواجًا غير رابطة إلى روابط ثنائية أو ثلاثية.</li></ol><div class="key"><b>الرنين</b>: وجود أكثر من تركيب لويس صحيح للجزيء؛ والتركيب الحقيقي متوسط لها.<br><b>الرابطة التساهمية التناسقية</b>: تقدّم فيها ذرة واحدة زوج الإلكترونات كاملًا.</div>'},
 {t:'num',ch:1,h:'إلكترونات أيون الأمونيوم',body:'<p>كم إلكترون تكافؤ يجب توزيعه في تركيب لويس لأيون الأمونيوم <span class="f">NH₄⁺</span>؟ (N: 5 إلكترونات تكافؤ، H: 1)</p>',a:8,tol:0,unit:'',exp:'5 + 4 × 1 − 1 (الشحنة الموجبة) = <b>8</b> إلكترونات = 4 روابط.',hint:'لا تنسَ الشحنة: الأيون الموجب فقد إلكترونًا.'},
 {t:'mcq',h:'تركيب CO₂',body:'<p>أي تركيب لويس صحيح لثاني أكسيد الكربون (16 إلكترون تكافؤ)؟</p>',opts:['O=C=O مع زوجين غير رابطين على كل أكسجين','O–C–O مع ثلاثة أزواج غير رابطة على كل أكسجين','O≡C–O','C=O=O'],a:0,exp:'التركيب الثاني يترك الكربون بأربعة إلكترونات فقط. في الأول: كل ذرة حولها 8 ✓، والمجموع 16 ✓.'},
 {t:'mcq',ch:1,h:'أطوال متساوية… لماذا؟',body:'<p>يُرسم أيون النترات <span class="f">NO₃⁻</span> برابطة ثنائية واحدة ورابطتين أحاديتين، لكن القياسات تُظهر أن الروابط الثلاث متساوية الطول. لماذا؟</p>',opts:['الرنين: الرابطة الثنائية ليست ثابتة في مكان واحد، والتركيب الحقيقي متوسط للتراكيب الثلاثة','أخطأت القياسات','الروابط الثلاث ثنائية فعلًا','الروابط الثلاث أحادية فعلًا'],a:0,exp:'كل رابطة N–O في الحقيقة «بين الأحادية والثنائية» — هذا معنى الرنين.'},
 {t:'sort',h:'استثناءات قاعدة الثمانية',body:'',cats:['أقل من ثمانية','أكثر من ثمانية','عدد فردي من الإلكترونات'],items:[[F('BF3')+' (B حوله 6)',0],[F('PCl5')+' (P حوله 10)',1],[F('NO2')+' (17 إلكترون تكافؤ)',2]],exp:'البورون يكتفي بستة، والعناصر من الدورة الثالثة فما بعدها يمكن أن تتجاوز الثمانية (لديها d)، والعدد الفردي يترك إلكترونًا منفردًا.'},
 {t:'mcq',ch:1,h:'من قدّم الزوج؟',body:'<p>يتكوّن أيون الأمونيوم عندما يرتبط <span class="f">NH₃</span> مع <span class="f">H⁺</span>. ما نوع الرابطة الجديدة؟</p>',opts:['تساهمية تناسقية: النيتروجين قدّم زوجه غير الرابط كاملًا','أيونية','فلزية','تساهمية عادية: كل ذرة قدّمت إلكترونًا'],a:0,exp:'H⁺ لا يملك أي إلكترون، فالزوج كله جاء من N. بعد تكوينها لا تختلف عن روابط N–H الأخرى.'}
]},
{id:'4-4',title:'أشكال الجزيئات',sub:'نظرية VSEPR، زوايا الروابط، التهجين',steps:[
 {t:'info',h:'الأزواج تتنافر',body:'<div class="key"><b>نظرية VSEPR</b>: أزواج الإلكترونات حول الذرة المركزية (الرابطة وغير الرابطة) تتنافر وتبتعد أقصى ما يمكن، وهذا يحدد شكل الجزيء.</div><p>استكشف الجزيئات وقارن الزوايا:</p>',widget:'vsepr',after:'<div class="key"><b>التهجين</b>: خلط أوربيتالات ذرية لتكوين أوربيتالات مهجنة متماثلة: sp (خطي)، sp² (مثلث مستوٍ)، sp³ (رباعي الأوجه).</div>'},
 {t:'mcq',ch:1,h:'لماذا 104.5° لا 109.5°؟',body:'<p>حول ذرة الأكسجين في الماء أربعة أزواج إلكترونات (كالميثان)، لكن زاوية H–O–H هي 104.5° لا 109.5°. لماذا؟</p>',opts:['الأزواج غير الرابطة تشغل حيزًا أكبر وتتنافر بقوة أكبر فتضغط الروابط نحو بعضها','الهيدروجين يجذب الهيدروجين الآخر','الأكسجين أصغر من الكربون','الماء سائل والميثان غاز'],a:0,exp:'ترتيب التنافر: غير رابط–غير رابط &gt; غير رابط–رابط &gt; رابط–رابط. لهذا: CH₄ 109.5° &gt; NH₃ 107° &gt; H₂O 104.5°.'},
 {t:'sort',h:'ما الشكل؟',body:'',cats:['خطي','مثلث مستوٍ','رباعي الأوجه','هرم ثلاثي','منحنٍ'],items:[[F('CO2'),0],[F('BF3'),1],[F('CH4'),2],[F('NH3'),3],[F('H2O'),4]],exp:'الشكل يصف مواقع <b>الذرات</b> فقط، لكن الأزواج غير الرابطة تؤثر فيه.'},
 {t:'mcq',ch:1,h:'ثلاث ذرات… شكلان مختلفان',body:`<p>كل من ${F('NH3')} و ${F('BF3')} فيه ثلاث ذرات مرتبطة بالذرة المركزية، لكن الأول هرمي والثاني مستوٍ. لماذا؟</p>`,opts:['لأن النيتروجين عليه زوج غير رابط يدفع الروابط إلى الأسفل، بينما البورون ليس عليه أزواج غير رابطة','لأن الهيدروجين أصغر من الفلور','لأن BF₃ أيوني','لأن NH₃ فيه روابط ثنائية'],a:0,exp:'NH₃: 4 مناطق إلكترونية (3 رابطة + 1 غير رابطة) ← ترتيب رباعي وشكل هرمي. BF₃: 3 مناطق فقط ← مثلث مستوٍ.'},
 {t:'mcq',h:'تهجين الكربون',body:`<p>ما نوع تهجين ذرة الكربون في ${F('CH4')}؟</p>`,opts:['sp³','sp²','sp','sp³d'],a:0,exp:'أوربيتال s واحد + ثلاثة p ← أربعة أوربيتالات sp³ متجهة نحو رؤوس رباعي الأوجه.'},
 {t:'mcq',ch:1,h:'تهجين في جزيء خطي',body:`<p>ما تهجين ذرة الكربون في ${F('CO2')} الخطي؟</p>`,opts:['sp','sp²','sp³','لا تهجين'],a:0,exp:'منطقتان إلكترونيتان فقط حول الكربون (رابطتان ثنائيتان) ← sp وزاوية 180°.'}
]},
{id:'4-5',title:'الكهروسالبية والقطبية',sub:'الروابط القطبية، قطبية الجزيئات، القوى بين الجزيئات',steps:[
 {t:'info',h:'شدّ الحبل على الإلكترونات',body:'<p>اختر ذرتين وراقب: إلى أين تنجذب سحابة الإلكترونات؟ وما نوع الرابطة؟</p>',widget:'polarity',after:'<div class="key">قطبية <b>الجزيء</b> تعتمد على قطبية الروابط <b>و</b>شكل الجزيء معًا: إذا كان الجزيء متماثلًا تلغي الأقطاب بعضها.</div>'},
 {t:'sort',h:'صنّف الروابط',body:`<p>قيم الكهروسالبية: H 2.20، C 2.55، O 3.44، Cl 3.16، Na 0.93</p>`,cats:['تساهمية غير قطبية','تساهمية قطبية','أيونية غالبًا'],items:[['<span class="f">H–H</span>',0],['<span class="f">C–H</span>',0],['<span class="f">H–Cl</span>',1],['<span class="f">O–H</span>',1],['<span class="f">Na–Cl</span>',2]],exp:'C–H: 0.35 (&lt; 0.4). H–Cl: 0.96 و O–H: 1.24 (بين 0.4 و 1.7). Na–Cl: 2.23 (&gt; 1.7).'},
 {t:'mcq',ch:1,h:'روابط قطبية… وجزيء غير قطبي!',body:`<p>رابطتا C=O في ${F('CO2')} قطبيتان، ومع ذلك الجزيء غير قطبي. كيف؟</p>`,opts:['لأن الجزيء خطي متماثل، فالقطبان متساويان ومتعاكسان فيلغي أحدهما الآخر','لأن الكربون والأكسجين لهما الكهروسالبية نفسها','لأن الروابط الثنائية لا تكون قطبية','لأنه غاز'],a:0,exp:'كأن فريقين متساويين يشدّان حبلًا في اتجاهين متعاكسين: المحصلة صفر. أما H₂O المنحني فلا يتماثل، فهو قطبي.'},
 {t:'mcq',h:'أيها قطبي؟',body:'<p>أي الجزيئات الآتية قطبي؟</p>',opts:[F('H2O'),F('CH4'),F('CO2'),F('CCl4')],a:0,exp:'الثلاثة الأخرى متماثلة الشكل (رباعي الأوجه أو خطي) فتلغي أقطابها.'},
 {t:'mcq',ch:1,h:'الزيت والماء',body:'<p>لماذا لا يذوب الزيت (جزيئات غير قطبية) في الماء (جزيئات قطبية)، بينما يذوب السكر (قطبي)؟</p>',opts:['«الشبيه يذيب الشبيه»: الجزيئات القطبية تنجذب للقطبية، ولا تجد الجزيئات غير القطبية ما يجذبها إلى الماء','لأن الزيت أثقل من الماء','لأن الزيت مركب أيوني','لأن السكر لا يحتوي على روابط'],a:0,exp:'جزيئات الماء تتجاذب بقوة فيما بينها، ولا تتخلى عن ذلك لجزيئات غير قطبية لا تقدم تجاذبًا مماثلًا.'},
 {t:'mcq',ch:1,h:'لغز درجة الغليان',body:'<p>كتلة جزيء H₂S (34 u) أكبر من H₂O (18 u)، ومع ذلك يغلي الماء عند 100 °C بينما يغلي H₂S عند −60 °C تقريبًا. لماذا؟</p>',opts:['بين جزيئات الماء روابط هيدروجينية قوية (H مرتبط بـ O عالي الكهروسالبية)، تحتاج طاقة كبيرة للتغلب عليها','لأن H₂S جزيء غير قطبي تمامًا','لأن الماء مركب أيوني','لأن الكبريت أخف من الأكسجين'],a:0,exp:'الرابطة الهيدروجينية قوة بين الجزيئات تنشأ عندما يرتبط H بذرة صغيرة عالية الكهروسالبية (F أو O أو N). لولاها لكان الماء غازًا عند درجة حرارة الغرفة!'},
 {t:'mcq',h:'الألماس',body:'<p>لماذا للألماس درجة انصهار مرتفعة جدًا رغم أنه مكوّن من روابط تساهمية؟</p>',opts:['لأنه مادة صلبة شبكية تساهمية: كل ذرة كربون مرتبطة تساهميًا بأربع ذرات في شبكة متصلة','لأنه مركب أيوني','لأن بين جزيئاته قوى ضعيفة','لأنه فلز'],a:0,exp:'الانصهار هنا يتطلب كسر روابط تساهمية قوية لا مجرد التغلب على قوى بين جزيئات.'}
]},
{id:'b4',boss:true,title:'تحدّي الفصل الرابع',sub:'الروابط والتسمية والأشكال والقطبية — 3 قلوب',steps:[
 {t:'mcq',h:'شكل وقطبية',body:`<p>ما شكل ${F('NH3')} وهل هو قطبي؟</p>`,opts:['هرم ثلاثي، قطبي','مثلث مستوٍ، غير قطبي','هرم ثلاثي، غير قطبي','رباعي الأوجه، غير قطبي'],a:0,exp:'الزوج غير الرابط يجعل الشكل هرميًا غير متماثل، فلا تلغي الأقطاب بعضها.'},
 {t:'num',h:'إلكترونات التكافؤ',body:'<p>كم إلكترون تكافؤ في أيون الكربونات <span class="f">CO₃²⁻</span>؟ (C: 4، O: 6)</p>',a:24,tol:0,unit:'',exp:'4 + 3 × 6 + 2 = <b>24</b>'},
 {t:'mcq',h:'تسمية',body:`<p>ما اسم ${F('PCl5')}؟</p>`,opts:['خامس كلوريد الفوسفور','كلوريد الفوسفور V','خماسي فوسفيد الكلور','كلوريد الفوسفور'],a:0,exp:'مركب جزيئي ثنائي: 5 ذرات كلور ← خامس كلوريد.'},
 {t:'mcq',h:'زاوية متوقعة',body:'<p>جزيء الفورمالدهيد <span class="f">H₂C=O</span> (حول الكربون ثلاث مناطق إلكترونية ولا أزواج غير رابطة). ما الزاوية التقريبية حول الكربون؟</p>',opts:['120°','109.5°','180°','90°'],a:0,exp:'ثلاث مناطق ← مثلث مستوٍ ← 120° تقريبًا، وتهجين sp².'},
 {t:'mcq',h:'الأقصر',body:'<p>أي الروابط الآتية هي الأقصر؟</p>',opts:['<span class="f">C≡O</span>','<span class="f">C=O</span>','<span class="f">C–O</span>','متساوية الطول'],a:0,exp:'الرابطة الثلاثية أقصر وأقوى.'},
 {t:'mcq',h:'نوع الرابطة',body:'<p>الكهروسالبية: K = 0.82 و F = 3.98. ما نوع الرابطة بينهما؟</p>',opts:['أيونية غالبًا','تساهمية غير قطبية','تساهمية قطبية','فلزية'],a:0,exp:'ΔEN = 3.16 أكبر بكثير من 1.7.'}
]}
]},
/* ======================= الفصل 5: الحسابات الكيميائية ======================= */
{n:5,name:'الحسابات الكيميائية',color:'#12a37a',badge:['⚖️','سيّد الحسابات'],levels:[
{id:'5-1',title:'الصيغة الأولية والصيغة الجزيئية',sub:'من النسبة المئوية إلى الصيغة',steps:[
 {t:'info',h:'من التحليل إلى الصيغة',body:'<div class="key"><b>الصيغة الأولية</b>: أبسط نسبة عددية صحيحة بين ذرات المركب.<br><b>الصيغة الجزيئية</b>: العدد الفعلي للذرات = (الصيغة الأولية) × n</div><p>الخطوات: افترض 100 g ← النسب المئوية تصبح جرامات ← حوّلها إلى مولات ← اقسم على أصغرها ← حوّل إلى أعداد صحيحة.</p><p>n = الكتلة المولية للمركب ÷ الكتلة المولية للصيغة الأولية</p>'},
 {t:'mcq',h:'أبسط نسبة',body:`<p>ما الصيغة الأولية للجلوكوز ${F('C6H12O6')}؟</p>`,opts:[F('CH2O'),F('C6H12O6'),F('C2H4O2'),F('CHO')],a:0,exp:'نقسم 6 : 12 : 6 على 6 ← 1 : 2 : 1.'},
 {t:'mcq',ch:1,h:'صيغة أولية واحدة… مادتان',body:`<p>للأسيتيلين ${F('C2H2')} والبنزين ${F('C6H6')} الصيغة الأولية نفسها CH. ماذا يعني ذلك؟</p>`,opts:['لهما النسبة المئوية الكتلية نفسها للكربون والهيدروجين، لكنهما مادتان مختلفتان بكتل مولية مختلفة','أنهما المادة نفسها','أن لهما الكتلة المولية نفسها','أن الصيغة الأولية خطأ'],a:0,exp:'الصيغة الأولية لا تكفي لتحديد المادة؛ نحتاج الكتلة المولية لنعرف n.'},
 {t:'mcq',ch:1,h:'حلّل المركب',body:'<p>مركب يحتوي على 40.0% C و 6.71% H و 53.3% O. ما صيغته الأولية؟ (C = 12.01، H = 1.008، O = 16.00 g/mol)</p>',opts:[F('CH2O'),F('CHO'),F('C2H3O'),F('CH3O2')],a:0,exp:'في 100 g: C = 40.0 ÷ 12.01 = 3.33 mol، H = 6.71 ÷ 1.008 = 6.66 mol، O = 53.3 ÷ 16.00 = 3.33 mol. نقسم على 3.33 ← 1 : 2 : 1 ← CH₂O',hint:'حوّل كل نسبة (كجرامات من 100 g) إلى مولات، ثم اقسم على أصغر قيمة.'},
 {t:'num',h:'من الأولية إلى الجزيئية',body:`<p>الصيغة الأولية لمركب ${F('CH2O')} (كتلتها المولية 30.03 g/mol)، والكتلة المولية للمركب 180.18 g/mol. ما قيمة n؟</p>`,a:6,tol:0,unit:'',exp:'n = 180.18 ÷ 30.03 = <b>6</b> ← الصيغة الجزيئية C₆H₁₂O₆'},
 {t:'mcq',ch:1,h:'نسبة غير صحيحة',body:'<p>عند حساب صيغة أكسيد حديد خرجت النسبة: Fe : O = 1 : 1.5. ما الصيغة الأولية؟</p>',opts:[F('Fe2O3'),F('FeO'),F('FeO2'),F('Fe3O2')],a:0,exp:'لا نقرّب 1.5 إلى 2! نضرب الطرفين في 2 ← 2 : 3 ← Fe₂O₃.'},
 {t:'mcq',ch:1,h:'ماذا تضرب؟',body:'<p>خرجت النسبة في مسألة: X : Y = 1 : 1.33. بأي عدد تضرب للحصول على أعداد صحيحة؟</p>',opts:['3 (لتصبح 3 : 4)','2','4','لا شيء، نقرّب إلى 1 : 1'],a:0,exp:'1.33 ≈ 4/3، فالضرب في 3 يعطي 3 : 3.99 ≈ 3 : 4.'}
]},
{id:'5-2',title:'صيغ الأملاح المائية',sub:'ماء التبلر، التسمية، حساب عدد جزيئات الماء',steps:[
 {t:'info',h:'ماء محبوس في البلورة',body:'<div class="key"><b>الملح المائي</b>: مركب أيوني ترتبط بوحدة صيغته جزيئات ماء بعدد محدد (ماء التبلر).</div><p>مثال: <span class="f">CuSO₄·5H₂O</span> كبريتات النحاس II خماسية الماء (زرقاء). بالتسخين يفقد الماء ويصبح <span class="f">CuSO₄</span> اللامائي (أبيض).</p><p>لحساب عدد جزيئات الماء x: مولات الماء ÷ مولات الملح اللامائي.</p>'},
 {t:'mcq',h:'سمِّ الملح المائي',body:'<p>ما اسم <span class="f">MgSO₄·7H₂O</span>؟</p>',opts:['كبريتات المغنيسيوم سباعية الماء','كبريتات المغنيسيوم المائية','سابع كبريتات المغنيسيوم','كبريتات المغنيسيوم'],a:0,exp:'اسم الملح + عدد جزيئات الماء بالبادئة: سباعية الماء.'},
 {t:'num',h:'الكتلة المولية لملح مائي',body:'<p>احسب الكتلة المولية لـ <span class="f">CuSO₄·5H₂O</span>. (Cu = 63.55، S = 32.07، O = 16.00، H = 1.008 g/mol)</p>',a:249.7,tol:0.15,unit:'g/mol',exp:'CuSO₄ = 63.55 + 32.07 + 4 × 16.00 = 159.62. و 5H₂O = 5 × 18.02 = 90.08. المجموع = <b>249.70 g/mol</b>'},
 {t:'num',ch:1,h:'كم جزيء ماء؟',body:'<p>سُخّنت <span class="f">2.50 g</span> من كلوريد الباريوم المائي <span class="f">BaCl₂·xH₂O</span> حتى ثبتت الكتلة عند <span class="f">2.13 g</span> من BaCl₂ اللامائي. ما قيمة x؟ (BaCl₂ = 208.23 g/mol، H₂O = 18.02 g/mol)</p>',a:2,tol:0,unit:'',exp:'كتلة الماء = 2.50 − 2.13 = 0.37 g ← 0.37 ÷ 18.02 = 0.0205 mol. مولات BaCl₂ = 2.13 ÷ 208.23 = 0.0102 mol. النسبة = 0.0205 ÷ 0.0102 ≈ <b>2</b> ← BaCl₂·2H₂O',hint:'الفرق في الكتلة هو الماء المفقود. حوّل كليهما إلى مولات وقارن.'},
 {t:'mcq',ch:1,h:'كاشف الرطوبة',body:'<p>عند تسخين كبريتات النحاس II الزرقاء تتحول إلى مسحوق أبيض، وإذا أُضيف إليها ماء عادت زرقاء. كيف يُستفاد من ذلك؟</p>',opts:['للكشف عن وجود الماء: المسحوق الأبيض يزرقّ عند ملامسة الماء','لصنع النحاس النقي','لتلوين الملابس','لقياس الحموضة'],a:0,exp:'اللون الأزرق يرتبط بوجود ماء التبلر حول أيونات النحاس، فالتحول اللوني عكسي ويكشف الرطوبة.'},
 {t:'num',h:'نسبة الماء',body:'<p>ما النسبة المئوية بالكتلة للماء في <span class="f">CuSO₄·5H₂O</span>؟ (الكتلة المولية 249.70 g/mol، وكتلة 5H₂O = 90.08 g)</p>',a:36.1,tol:0.15,unit:'%',exp:'90.08 ÷ 249.70 × 100 = <b>36.1%</b>'},
 {t:'mcq',h:'مُجفِّف',body:'<p>لماذا يوضع كلوريد الكالسيوم اللامائي في بعض العبوات والأوعية المغلقة؟</p>',opts:['لأنه يمتص الرطوبة من الهواء متحولًا إلى ملح مائي، فيحمي المحتويات','لأنه يطلق الماء ببطء','لأنه يقتل البكتيريا فقط','لأنه يزيد الرطوبة'],a:0,exp:'الأملاح اللامائية «عطشى» للماء؛ تسحبه من الهواء وتحتفظ به في بلوراتها.'}
]},
{id:'5-3',title:'المقصود بالحسابات الكيميائية',sub:'تفسير المعادلة الموزونة، النسب المولية، حفظ الكتلة',steps:[
 {t:'info',h:'المعادلة وصفة دقيقة',body:'<p>المعادلة الموزونة تخبرنا بنسب <b>الجسيمات</b> و<b>المولات</b> بين المواد. غيّر الكمية وراقب ما يُحفظ وما لا يُحفظ:</p>',widget:'moleratio',after:'<div class="key"><b>النسبة المولية</b>: نسبة بين عدد مولات أي مادتين في المعادلة الموزونة.</div>'},
 {t:'num',h:'كم نسبة مولية؟',body:`<p>كم نسبة مولية يمكن كتابتها للمعادلة ${E('4Fe + 3O2 -> 2Fe2O3')}؟</p>`,a:6,tol:0,unit:'',exp:'3 مواد ← كل زوج يعطي نسبتين: n(n − 1) = 3 × 2 = <b>6</b>'},
 {t:'mcq',h:'اختر النسبة',body:`<p>في ${E('4Fe + 3O2 -> 2Fe2O3')}، ما النسبة المولية بين O₂ و Fe₂O₃؟</p>`,opts:['3 : 2','4 : 3','2 : 3','4 : 2'],a:0,exp:'من المعاملات مباشرة: 3 mol O₂ لكل 2 mol Fe₂O₃.'},
 {t:'mcq',ch:1,h:'هل خُرق القانون؟',body:`<p>في ${E('N2 + 3H2 -> 2NH3')} تتفاعل 4 mol من المتفاعلات لتعطي 2 mol فقط من النواتج. هل خُرق قانون حفظ الكتلة؟</p>`,opts:['لا؛ المولات لا تُحفظ بالضرورة، أما الكتلة وعدد الذرات من كل عنصر فمحفوظان','نعم؛ لأن عدد المولات نقص','نعم؛ لأن الكتلة نقصت إلى النصف','لا؛ لأن المعادلة غير موزونة'],a:0,exp:'ذرات أكثر تتجمع في جزيئات أقل. جرّب الأداة: كتلة المتفاعلات = كتلة النواتج دائمًا.'},
 {t:'num',h:'تحقق من الكتل',body:`<p>في ${E('N2 + 3H2 -> 2NH3')}: تفاعل 28.02 g من N₂ مع 6.05 g من H₂ تمامًا. ما كتلة NH₃ الناتجة؟</p>`,a:34.07,tol:0.05,unit:'g',exp:'حفظ الكتلة: 28.02 + 6.05 = <b>34.07 g</b> (= 2 × 17.03 ✓)'},
 {t:'num',ch:1,h:'من مولات إلى مولات',body:`<p>في ${E('N2 + 3H2 -> 2NH3')}: كم مولًا من NH₃ ينتج من 6.0 mol من H₂ (مع كمية كافية من N₂)؟</p>`,a:4,tol:0.01,unit:'mol',exp:'6.0 mol H₂ × (2 mol NH₃ ÷ 3 mol H₂) = <b>4.0 mol</b>'}
]},
{id:'5-4',title:'حسابات المعادلات الكيميائية',sub:'مول ← مول، مول ← كتلة، كتلة ← كتلة',steps:[
 {t:'info',h:'الجسر الذهبي',body:'<div class="key" style="text-align:center">كتلة المادة المعلومة ← (÷ الكتلة المولية) ← مولاتها ← (× النسبة المولية) ← مولات المطلوبة ← (× الكتلة المولية) ← كتلتها</div><p>المول هو الجسر الوحيد بين المواد المختلفة؛ لا يجوز الانتقال من جرامات مادة إلى جرامات أخرى مباشرة.</p>'},
 {t:'num',h:'مول ← مول',body:`<p>${E('2H2 + O2 -> 2H2O')}: كم مولًا من الماء ينتج من 5.0 mol من O₂ (مع هيدروجين كافٍ)؟</p>`,a:10,tol:0.01,unit:'mol',exp:'5.0 × (2 ÷ 1) = <b>10 mol</b>'},
 {t:'num',h:'مول ← كتلة',body:`<p>${E('2Na + Cl2 -> 2NaCl')}: ما كتلة NaCl الناتجة من 0.50 mol من Na؟ (NaCl = 58.44 g/mol)</p>`,a:29.22,tol:0.05,unit:'g',exp:'مولات NaCl = 0.50 (النسبة 2 : 2) ← 0.50 × 58.44 = <b>29.2 g</b>'},
 {t:'num',ch:1,h:'كتلة ← كتلة',body:`<p>${E('2KClO3 -> 2KCl + 3O2')}: ما كتلة الأكسجين الناتجة من تفكك 24.5 g من KClO₃؟ (KClO₃ = 122.55 g/mol، O₂ = 32.00 g/mol)</p>`,a:9.6,tol:0.03,unit:'g',exp:'24.5 ÷ 122.55 = 0.200 mol KClO₃ ← × (3 ÷ 2) = 0.300 mol O₂ ← × 32.00 = <b>9.60 g</b>',hint:'ثلاث خطوات: جرامات ← مولات ← نسبة مولية ← جرامات.'},
 {t:'mcq',ch:1,h:'أين الخطأ؟',body:`<p>في ${E('2H2 + O2 -> 2H2O')} قال طالب: «بما أن النسبة 2 : 1، فإن 4 g من H₂ تتفاعل مع 2 g من O₂». ما خطؤه؟</p>`,opts:['النسبة المولية ليست نسبة كتلية؛ 4 g من H₂ = 2 mol تحتاج 1 mol O₂ = 32 g','لا خطأ في كلامه','النسبة الصحيحة 1 : 2','كان يجب جمع الكتل'],a:0,exp:'المعاملات تقارن المولات (أعداد الجسيمات)، وجزيء O₂ أثقل بـ 16 مرة من H₂ تقريبًا.'},
 {t:'num',ch:1,h:'احتراق البروبان',body:`<p>${E('C3H8 + 5O2 -> 3CO2 + 4H2O')}: ما كتلة CO₂ الناتجة من احتراق 44.1 g من البروبان تمامًا؟ (C₃H₈ = 44.10 g/mol، CO₂ = 44.01 g/mol)</p>`,a:132.03,tol:0.4,unit:'g',exp:'44.1 ÷ 44.10 = 1.00 mol ← × 3 = 3.00 mol CO₂ ← × 44.01 = <b>132 g</b>. لاحظ: الكتلة الناتجة ثلاثة أضعاف كتلة الوقود!'}
]},
{id:'5-5',title:'المادة المحددة للتفاعل',sub:'المحددة والفائضة، حساب الناتج',steps:[
 {t:'info',h:'من ينفد أولًا؟',body:'<p>غيّر أعداد الجزيئات وابحث: متى يكون H₂ هو المحدد؟ ومتى O₂؟</p>',widget:'limiting',after:'<div class="key"><b>المادة المحددة</b>: المتفاعل الذي يُستهلك كليًا أولًا فيحدد كمية الناتج. <b>المادة الفائضة</b>: ما يتبقى منه بعد انتهاء التفاعل.</div>'},
 {t:'mcq',ch:1,h:'مصنع الشطائر',body:'<p>لصنع شطيرة تحتاج قطعتي خبز وشريحة جبن واحدة. لديك 10 قطع خبز و 3 شرائح جبن. ما المادة المحددة؟ وكم شطيرة تصنع؟</p>',opts:['الجبن؛ 3 شطائر ويتبقى 4 قطع خبز','الخبز؛ 5 شطائر','الجبن؛ 5 شطائر','الخبز؛ 3 شطائر'],a:0,exp:'رغم أن الخبز أكثر عددًا، فإن الجبن ينفد أولًا. «الأقل كمية» ليس بالضرورة المحدد — المهم النسبة المطلوبة.'},
 {t:'mcq',h:'حدّد المادة المحددة',body:`<p>${E('2H2 + O2 -> 2H2O')}: خلطنا 4 mol من H₂ مع 3 mol من O₂. أي العبارات صحيحة؟</p>`,opts:['H₂ هو المادة المحددة، ويتبقى 1 mol من O₂','O₂ هو المادة المحددة لأنه أقل عددًا','لا توجد مادة محددة','H₂ محدد ويتبقى 2 mol من O₂'],a:0,exp:'4 mol H₂ تحتاج 2 mol O₂ فقط (لدينا 3) ← H₂ ينفد أولًا، ويفيض 1 mol O₂.'},
 {t:'num',h:'كم ماء؟',body:'<p>في التفاعل السابق (4 mol H₂ مع 3 mol O₂)، كم مولًا من الماء ينتج؟</p>',a:4,tol:0.01,unit:'mol',exp:'نحسب من المادة المحددة: 4 mol H₂ × (2 ÷ 2) = <b>4 mol</b> H₂O'},
 {t:'mcq',ch:1,h:'بالجرامات هذه المرة',body:`<p>${E('2Al + 3Cl2 -> 2AlCl3')}: خلطنا 2.70 g من Al (26.98 g/mol) مع 7.09 g من Cl₂ (70.90 g/mol). ما المادة المحددة؟</p>`,opts:['Cl₂','Al','كلاهما يُستهلك تمامًا','لا يمكن تحديدها'],a:0,exp:'Al: 0.100 mol يحتاج 0.100 × 3/2 = 0.150 mol Cl₂، والمتوفر 0.100 mol فقط ← Cl₂ محدد.',hint:'حوّل كليهما إلى مولات، ثم احسب كم يحتاج أحدهما من الآخر حسب المعاملات.'},
 {t:'num',ch:1,h:'كتلة الناتج',body:`<p>في التفاعل السابق (Cl₂ هو المحدد، ومولاته 0.100 mol)، ما كتلة AlCl₃ الناتجة؟ (AlCl₃ = 133.33 g/mol)</p>`,a:8.89,tol:0.05,unit:'g',exp:'0.100 mol Cl₂ × (2 ÷ 3) = 0.0667 mol AlCl₃ ← × 133.33 = <b>8.89 g</b>'},
 {t:'mcq',h:'لماذا الفائض؟',body:'<p>لماذا تُضاف في الصناعة كمية فائضة من أحد المتفاعلات (غالبًا الأرخص)؟</p>',opts:['لضمان استهلاك المتفاعل الأغلى كليًا وزيادة سرعة التفاعل','لأن الفائض يزيد كمية الناتج بلا حدود','لتقليل كمية الناتج','لأن القانون يفرض ذلك'],a:0,exp:'الناتج يحدده المحدد. جعل المادة الثمينة هي المحددة يضمن عدم هدرها.'}
]},
{id:'5-6',title:'نسبة المردود المئوية',sub:'المردود النظري والفعلي',steps:[
 {t:'info',h:'الواقع والنظرية',body:'<div class="key"><b>المردود النظري</b>: أكبر كمية ناتج محسوبة من المادة المحددة.<br><b>المردود الفعلي</b>: الكمية التي نحصل عليها فعلًا من التجربة.<br><b>نسبة المردود المئوية</b> = (المردود الفعلي ÷ المردود النظري) × 100</div>'},
 {t:'num',h:'احسب النسبة',body:'<p>المردود النظري لتجربة <span class="f">20.0 g</span>، وحصل الطالب على <span class="f">15.0 g</span>. ما نسبة المردود المئوية؟</p>',a:75,tol:0.2,unit:'%',exp:'15.0 ÷ 20.0 × 100 = <b>75.0%</b>'},
 {t:'multi',ch:1,h:'أين ذهب الباقي؟',body:'<p>ما الأسباب المحتملة لأن يكون المردود الفعلي أقل من النظري؟</p>',opts:['حدوث تفاعلات جانبية تنتج مواد أخرى','عدم اكتمال التفاعل','فقد جزء من الناتج أثناء الترشيح أو النقل','زيادة المادة المحددة بعد التفاعل'],a:[0,1,2],exp:'المادة المحددة لا تزيد بعد التفاعل! أما الأسباب الثلاثة الأخرى فشائعة في المختبر والصناعة.'},
 {t:'num',ch:1,h:'من البداية إلى النهاية',body:`<p>${E('CaCO3 -> CaO + CO2')}: سُخّن 50.0 g من CaCO₃ (100.09 g/mol) فنتج 22.4 g من CaO (56.08 g/mol). ما نسبة المردود المئوية؟</p>`,a:80,tol:0.4,unit:'%',exp:'المردود النظري: 50.0 ÷ 100.09 = 0.4996 mol ← × 56.08 = 28.0 g. النسبة = 22.4 ÷ 28.0 × 100 = <b>80.0%</b>',hint:'احسب المردود النظري أولًا من كتلة CaCO₃.'},
 {t:'mcq',ch:1,h:'مردود 110%؟!',body:'<p>حسب طالب نسبة المردود فوجدها 110%. ما التفسير الأرجح؟</p>',opts:['الناتج غير نقي أو ما زال رطبًا (فيه ماء أو مواد أخرى)','التفاعل أنتج مادة من العدم','هذا طبيعي في معظم التجارب','المادة المحددة زادت'],a:0,exp:'لا يمكن أن يتجاوز المردود الحقيقي 100% (حفظ الكتلة). القيمة الأكبر تكشف خطأً في التجربة: شوائب أو بقايا مذيب.'},
 {t:'num',h:'خطط لإنتاجك',body:'<p>المردود النظري لتفاعل <span class="f">40.0 g</span>، ونسبة المردود المعتادة في المصنع 85%. كم جرامًا يُتوقع الحصول عليه؟</p>',a:34,tol:0.1,unit:'g',exp:'40.0 × 0.85 = <b>34.0 g</b>'}
]},
{id:'b5',boss:true,title:'تحدّي الفصل الخامس',sub:'الحسابات الكيميائية كلها — 3 قلوب',steps:[
 {t:'mcq',h:'صيغة من التحليل',body:'<p>مركب فيه 85.6% C و 14.4% H، وكتلته المولية 28.05 g/mol. ما صيغته الجزيئية؟ (C = 12.01، H = 1.008)</p>',opts:[F('C2H4'),F('CH2'),F('C3H6'),F('C2H6')],a:0,exp:'C: 7.13 mol، H: 14.3 mol ← 1 : 2 ← CH₂ (14.03 g/mol). n = 28.05 ÷ 14.03 = 2 ← C₂H₄'},
 {t:'num',h:'ملح مائي',body:'<p>عيّنة من <span class="f">CuSO₄·xH₂O</span> كتلتها 4.99 g، وبعد التسخين أصبحت 3.19 g. ما قيمة x؟ (CuSO₄ = 159.62، H₂O = 18.02 g/mol)</p>',a:5,tol:0,unit:'',exp:'الماء: 1.80 g ÷ 18.02 = 0.0999 mol. CuSO₄: 3.19 ÷ 159.62 = 0.0200 mol. النسبة ≈ <b>5</b>'},
 {t:'num',h:'كتلة ← كتلة',body:`<p>${E('N2 + 3H2 -> 2NH3')}: ما كتلة NH₃ الناتجة من 6.05 g من H₂ (مع N₂ كافٍ)؟ (H₂ = 2.016، NH₃ = 17.03 g/mol)</p>`,a:34.07,tol:0.15,unit:'g',exp:'6.05 ÷ 2.016 = 3.00 mol H₂ ← × 2/3 = 2.00 mol NH₃ ← × 17.03 = <b>34.1 g</b>'},
 {t:'mcq',h:'المادة المحددة',body:`<p>${E('2C2H6 + 7O2 -> 4CO2 + 6H2O')}: خلطنا 2.0 mol من C₂H₆ مع 6.0 mol من O₂. ما المادة المحددة؟</p>`,opts:['O₂','C₂H₆','كلاهما بالضبط','لا يحدث تفاعل'],a:0,exp:'2.0 mol C₂H₆ يحتاج 7.0 mol O₂ والمتوفر 6.0 ← O₂ محدد.'},
 {t:'num',h:'المردود',body:'<p>المردود النظري لتفاعل 12.5 g والفعلي 10.0 g. ما نسبة المردود؟</p>',a:80,tol:0.2,unit:'%',exp:'10.0 ÷ 12.5 × 100 = <b>80.0%</b>'},
 {t:'mcq',h:'تفكير أخير',body:'<p>زيادة كمية المادة الفائضة في تفاعل إلى الضعف (مع بقاء المادة المحددة كما هي)، ماذا تفعل بالمردود النظري؟</p>',opts:['لا تغيّره، لأن المادة المحددة هي التي تحدده','تضاعفه','تنقصه إلى النصف','تجعله 100% دائمًا'],a:0,exp:'الناتج لا يتجاوز ما تسمح به المادة المحددة، مهما زاد الفائض.'}
]}
]},
/* ======================= الفصل 6: حالات المادة ======================= */
{n:6,name:'حالات المادة',color:'#e0682b',badge:['🧊','سيّد الحالات'],levels:[
{id:'6-1',title:'الغازات',sub:'نظرية الحركة الجزيئية، الانتشار والتدفق، قانون جراهام، الضغط وقانون دالتون',steps:[
 {t:'info',h:'نظرية الحركة الجزيئية',body:'<div class="key"><b>فرضيات نظرية الحركة الجزيئية للغازات:</b><br>① جسيمات الغاز صغيرة جدًّا ومتباعدة، فلا توجد بينها قوى تجاذب أو تنافر تقريبًا.<br>② حركتها مستمرة وعشوائية في خطوط مستقيمة.<br>③ تصادماتها <b>مرنة</b>: لا تُفقد فيها الطاقة الحركية، بل تنتقل بين الجسيمات.<br>④ <b>درجة الحرارة</b> مقياس لمتوسط الطاقة الحركية للجسيمات: <span class="f">KE = ½ mv²</span></div><p>أزل الحاجز وراقب الغازين، ثم غيّر درجة الحرارة:</p>',widget:'kinetic'},
 {t:'mcq',ch:1,h:'لماذا ينضغط الغاز بسهولة؟',body:'<p>يمكن ضغط بالون مملوء بالهواء، لكن لا يمكن ضغط بالون مملوء بالماء بالقدر نفسه. ما التفسير وفق نظرية الحركة الجزيئية؟</p>',opts:['المسافات بين جسيمات الغاز كبيرة جدًّا مقارنة بحجومها','جسيمات الغاز أصغر من جسيمات الماء دائمًا','جسيمات الغاز لا تتحرك','قوى التجاذب بين جسيمات الغاز كبيرة'],a:0,exp:'معظم حجم الغاز فراغ، فالضغط يقرّب الجسيمات بعضها من بعض. لذلك للغاز كثافة منخفضة وقابلية عالية للانضغاط.'},
 {t:'mcq',h:'التصادم المرن',body:'<p>ماذا يعني أن التصادمات بين جسيمات الغاز <b>مرنة</b>؟</p>',opts:['لا تُفقد الطاقة الحركية، بل تنتقل بين الجسيمات المتصادمة','تتوقف الجسيمات بعد التصادم','تلتصق الجسيمات ببعضها','تفقد الجسيمات طاقتها تدريجيًّا حتى تسكن'],a:0,exp:'لو كانت التصادمات غير مرنة لفقد الغاز طاقته وسكنت جسيماته، وهذا لا يحدث.'},
 {t:'sort',h:'انتشار أم تدفق؟',body:'',cats:['الانتشار','التدفق'],items:[['وصول رائحة الطعام من المطبخ إلى أرجاء المنزل',0],['خروج الهواء من ثقب صغير في إطار السيارة',1],['امتزاج غازين في وعاء بعد إزالة الحاجز بينهما',0],['تسرّب غاز الهيليوم من ثقب دقيق في البالون',1]],exp:'<b>الانتشار</b>: حركة جسيمات مادة خلال مادة أخرى من التركيز العالي إلى المنخفض. <b>التدفق</b>: خروج الغاز من ثقب صغير.'},
 {t:'info',h:'قانون جراهام',body:'<div class="key">معدل سرعة تدفق الغاز (أو انتشاره) يتناسب <b>عكسيًّا</b> مع الجذر التربيعي لكتلته المولية:<br><span class="f">معدل A ÷ معدل B = √(M<sub>B</sub> ÷ M<sub>A</sub>)</span></div><p>فالغاز الأخف ينتشر أسرع؛ لأن جسيماته لها متوسط الطاقة الحركية نفسه عند درجة الحرارة نفسها، فلا بد أن تكون سرعتها أكبر.</p>'},
 {t:'num',h:'الأمونيا وكلوريد الهيدروجين',body:'<p>احسب نسبة معدل انتشار <span class="f">NH₃</span> (17.0 g/mol) إلى معدل انتشار <span class="f">HCl</span> (36.5 g/mol).</p>',a:1.47,tol:0.01,unit:'',exp:'√(36.5 ÷ 17.0) = √2.147 = <b>1.47</b>؛ أي تنتشر الأمونيا أسرع بنحو 1.5 مرة.',hint:'ضع الكتلة المولية للغاز الآخر (HCl) في البسط تحت الجذر.'},
 {t:'mcq',ch:1,h:'أيهما يصل أولًا؟',body:'<p>وُضع قطن مبلل بالأمونيا عند طرف أنبوب زجاجي، وقطن مبلل بحمض HCl عند الطرف الآخر في اللحظة نفسها. أين تتكوّن الحلقة البيضاء من <span class="f">NH₄Cl</span>؟</p>',opts:['أقرب إلى طرف HCl','أقرب إلى طرف الأمونيا','في المنتصف تمامًا','لا تتكوّن حلقة'],a:0,exp:'الأمونيا أخف فتقطع مسافة أكبر في الزمن نفسه؛ فيلتقي الغازان قرب طرف HCl.'},
 {t:'info',h:'ضغط الغاز',body:'<div class="key"><b>الضغط</b>: القوة الواقعة على وحدة المساحة. ويُقاس الضغط الجوي بـ<b>البارومتر</b> الذي صممه تورشلي.<br><span class="f">1 atm = 760 mm Hg = 760 torr = 101.3 kPa</span> &nbsp; و &nbsp; <span class="f">1 Pa = 1 N/m²</span></div><div class="key"><b>قانون دالتون للضغوط الجزئية</b>: الضغط الكلي لخليط غازات يساوي مجموع الضغوط الجزئية للغازات المكوّنة له:<br><span class="f">P<sub>total</sub> = P₁ + P₂ + P₃ + …</span></div>'},
 {t:'num',h:'حوّل الوحدات',body:'<p>ضغط غاز في إطار <span class="f">2.00 atm</span>. كم يساوي بوحدة <span class="f">kPa</span>؟</p>',a:202.6,tol:0.2,unit:'kPa',exp:'2.00 × 101.3 = <b>202.6 kPa</b>'},
 {t:'num',h:'قانون دالتون',body:'<p>الضغط الكلي لخليط من <span class="f">O₂</span> و <span class="f">CO₂</span> و <span class="f">N₂</span> يساوي <span class="f">0.97 atm</span>. فإذا كان الضغط الجزئي لـ CO₂ يساوي 0.70 atm، ولـ N₂ يساوي 0.12 atm، فما الضغط الجزئي لـ O₂؟</p>',a:0.15,tol:0.005,unit:'atm',exp:'P(O₂) = 0.97 − 0.70 − 0.12 = <b>0.15 atm</b>'},
 {t:'num',ch:1,h:'هواء الأرض',body:'<p>يحتوي الهواء على 21% أكسجين. إذا كان الضغط الجوي <span class="f">760 mm Hg</span>، فما الضغط الجزئي للأكسجين؟</p>',a:159.6,tol:0.6,unit:'mm Hg',exp:'0.21 × 760 = <b>160 mm Hg</b> تقريبًا.',hint:'الضغط الجزئي = نسبة الغاز × الضغط الكلي.'}
]},
{id:'6-2',title:'قوى التجاذب',sub:'قوى التشتت، القوى الثنائية القطبية، الرابطة الهيدروجينية',steps:[
 {t:'info',h:'داخل الجزيء… وبين الجزيئات',body:'<div class="key"><b>قوى الترابط داخل الجزيء</b>: الروابط الأيونية والتساهمية والفلزية.<br><b>القوى بين الجزيئات</b>: قوى أضعف تربط الجسيمات بعضها ببعض، ثلاثة أنواع:<br>① <b>قوى التشتت (لندن)</b>: ضعيفة، بين الجزيئات غير القطبية، تنشأ من إزاحة مؤقتة في السحب الإلكترونية، وتزداد بزيادة عدد الإلكترونات.<br>② <b>القوى الثنائية القطبية</b>: بين الجزيئات القطبية ذات الأقطاب الدائمة.<br>③ <b>الرابطة الهيدروجينية</b>: نوع خاص من الثنائية القطبية، بين جزيئات فيها H مرتبط بذرة <b>F أو O أو N</b>.</div><p>القوى بين الجزيئات كلها <b>أضعف</b> من قوى الترابط داخل الجزيئات.</p>'},
 {t:'sort',h:'ما أقوى قوة بين جزيئاتها؟',body:'',cats:['قوى التشتت فقط','ثنائية قطبية','رابطة هيدروجينية'],items:[[F('CH4'),0],[F('O2'),0],[F('HCl'),1],[F('H2O'),2],[F('NH3'),2],[F('HF'),2],[F('I2'),0]],exp:'الجزيئات غير القطبية (CH₄، O₂، I₂) بينها قوى تشتت فقط. HCl قطبي. وفي H₂O و NH₃ و HF يرتبط H بـ O أو N أو F فتتكوّن روابط هيدروجينية.'},
 {t:'mcq',ch:1,h:'الهالوجينات',body:'<p>عند درجة حرارة الغرفة: الفلور والكلور غازان، والبروم سائل، واليود صلب. ما التفسير؟</p>',opts:['تزداد قوى التشتت بزيادة عدد الإلكترونات (حجم الجزيء)','اليود جزيء قطبي','بين جزيئات اليود روابط هيدروجينية','الفلور أثقل من اليود'],a:0,exp:'كلها جزيئات غير قطبية، لكن عدد الإلكترونات يزداد من F₂ إلى I₂ فتقوى قوى التشتت وترتفع درجة الانصهار والغليان.'},
 {t:'mcq',h:'شرط الرابطة الهيدروجينية',body:'<p>أيّ الجزيئات الآتية <b>لا</b> تكوّن روابط هيدروجينية بين جزيئاتها مع أنها تحتوي على هيدروجين؟</p>',opts:[F('CH4'),F('H2O'),F('NH3'),F('HF')],a:0,exp:'في CH₄ يرتبط H بالكربون، وهو ليس عالي الكهروسالبية، ولا يحمل أزواجًا غير رابطة. الرابطة الهيدروجينية تحتاج H مرتبطًا بـ F أو O أو N.'},
 {t:'info',h:'الماء مادة فريدة',body:`<p>جزيئات متقاربة في الكتلة المولية، لكن انظر إلى درجات غليانها:</p>${TB(['المادة','الكتلة المولية','درجة الغليان'],[[F('H2O'),'18.0 g/mol','100 °C'],[F('NH3'),'17.0 g/mol','−33.4 °C'],[F('CH4'),'16.0 g/mol','−164 °C']])}`},
 {t:'mcq',ch:1,h:'فسّر البيانات',body:'<p>لماذا درجة غليان الماء أعلى كثيرًا من درجة غليان الميثان رغم تقارب كتلتيهما المولية؟</p>',opts:['بين جزيئات الماء روابط هيدروجينية قوية، أما الميثان فبين جزيئاته قوى تشتت ضعيفة فقط','لأن الروابط التساهمية في الماء أقوى','لأن الميثان جزيء أيوني','لأن جزيء الماء أكبر حجمًا'],a:0,exp:'الغليان يفصل الجزيئات بعضها عن بعض، ولا يكسر الروابط داخل الجزيء. لذلك تحدد القوى <b>بين</b> الجزيئات درجة الغليان.'},
 {t:'build',rtl:1,h:'رتّب حسب القوة',body:'<p>رتّب من <b>الأضعف</b> إلى <b>الأقوى</b>:</p>',tiles:['قوى التشتت','القوى الثنائية القطبية','الرابطة الهيدروجينية','الرابطة التساهمية'],answers:[['قوى التشتت','القوى الثنائية القطبية','الرابطة الهيدروجينية','الرابطة التساهمية']],exp:'القوى بين الجزيئات الثلاث أضعف من الرابطة التساهمية داخل الجزيء، وأقواها الرابطة الهيدروجينية.'},
 {t:'mcq',h:'سؤال مخادع',body:'<p>عند غليان الماء، ماذا يتكسر؟</p>',opts:['الروابط الهيدروجينية بين الجزيئات','الروابط التساهمية بين O و H','جزيئات الماء إلى H₂ و O₂','لا يتكسر شيء'],a:0,exp:'البخار ما زال جزيئات H₂O. أما تفكيك الماء إلى H₂ و O₂ فتغير كيميائي يحتاج إلى طاقة أكبر بكثير (كالتحليل الكهربائي).'}
]},
{id:'6-3',title:'المواد السائلة والمواد الصلبة',sub:'اللزوجة، التوتر السطحي، الخاصية الشعرية، أنواع المواد الصلبة',steps:[
 {t:'info',h:'خواص السوائل',body:'<div class="key"><b>اللزوجة</b>: مقياس مقاومة السائل للتدفق والانسياب (العسل لزج). تقل بارتفاع درجة الحرارة، وتزداد بزيادة قوى التجاذب وحجم الجزيئات.<br><b>التوتر السطحي</b>: الطاقة اللازمة لزيادة مساحة سطح السائل بمقدار معيّن. للماء توتر سطحي كبير بسبب الروابط الهيدروجينية.<br><b>التماسك</b>: قوة الترابط بين الجسيمات <b>المتماثلة</b>. <b>التلاصق</b>: قوة الترابط بين الجسيمات <b>المختلفة</b>.<br><b>الخاصية الشعرية</b>: ارتفاع الماء في الأنابيب الضيقة لأن تلاصقه بالزجاج أكبر من تماسكه.</div>'},
 {t:'mcq',h:'زيت الطبخ',body:'<p>ينتشر زيت الطبخ في المقلاة بسهولة أكبر بعد تسخينه. ما السبب؟</p>',opts:['تقل لزوجة السائل بارتفاع درجة الحرارة','تزداد لزوجته بالتسخين','يزداد التوتر السطحي','يتحول الزيت إلى غاز'],a:0,exp:'الحرارة تزيد الطاقة الحركية للجزيئات فتتغلب بسهولة أكبر على قوى التجاذب، فيقل الاحتكاك ويسهل الانسياب.'},
 {t:'mcq',ch:1,h:'المنظفات',body:'<p>لماذا يُضاف الصابون إلى الماء عند تنظيف الأوساخ؟</p>',opts:['يخفض التوتر السطحي للماء بتكسير الروابط الهيدروجينية، فيتغلغل الماء في الأوساخ','يرفع التوتر السطحي للماء','يزيد لزوجة الماء','يحوّل الماء إلى مادة صلبة'],a:0,exp:'تسمى المركبات التي تخفض التوتر السطحي للماء <b>عوامل خافضة للتوتر السطحي</b>.'},
 {t:'mcq',ch:1,h:'الماء في الأنبوب الشعري',body:'<p>يرتفع الماء في أنبوب زجاجي ضيق، ويكون سطحه مقعرًا. ما التفسير؟</p>',opts:['قوى التلاصق بين الماء والزجاج أكبر من قوى التماسك بين جزيئات الماء','قوى التماسك أكبر من التلاصق','الماء لا يتأثر بالجاذبية','التوتر السطحي للماء يساوي صفرًا'],a:0,exp:'التلاصق (جسيمات مختلفة: ماء وزجاج) يسحب الماء نحو الجدران وإلى أعلى.'},
 {t:'info',h:'المواد الصلبة',body:`<p><b>المادة الصلبة البلورية</b>: جسيماتها مرتبة في شكل هندسي منتظم. و<b>وحدة البناء</b> أصغر ترتيب للذرات في الشبكة البلورية يحمل التماثل نفسه. أما <b>المواد الصلبة غير المتبلورة</b> (مثل الزجاج والمطاط) فجسيماتها غير مرتبة بنمط متكرر.</p>${TB(['النوع','الجسيمات','الخواص','أمثلة'],[['ذرية','ذرات','لينة، انصهار منخفض، رديئة التوصيل','الغازات النبيلة'],['جزيئية','جزيئات','متوسطة اللين، رديئة التوصيل','I₂، H₂O، CO₂، السكر'],['تساهمية شبكية','ذرات بروابط تساهمية','صلبة جدًّا، انصهار مرتفع','الألماس، الكوارتز SiO₂'],['أيونية','أيونات','صلبة، هشة، انصهار مرتفع','NaCl، KBr، CaCO₃'],['فلزية','ذرات وإلكترونات حرة','قابلة للسحب والطرق، ممتازة التوصيل','جميع الفلزات']])}`},
 {t:'sort',h:'صنّف المادة الصلبة',body:'',cats:['جزيئية','تساهمية شبكية','أيونية','فلزية'],items:[['السكر',0],['الجليد',0],['الألماس',1],['الكوارتز',1],['ملح الطعام',2],['بروميد البوتاسيوم',2],['النحاس',3],['الألومنيوم',3]],exp:'الألماس والكوارتز شبكات ضخمة من الروابط التساهمية، لذلك هما صلبان جدًّا ودرجة انصهارهما مرتفعة.'},
 {t:'mcq',ch:1,h:'الجليد يطفو!',body:'<p>معظم المواد الصلبة أكثر كثافة من سائلها، لكن الجليد يطفو على الماء. لماذا؟</p>',opts:['عند التجمد يكوّن كل جزيء ماء أربع روابط هيدروجينية في شبكة مفتوحة، فتتباعد الجزيئات أكثر من السائل','لأن الجليد يحتوي على هواء دائمًا','لأن جزيئات الجليد أخف من جزيئات الماء','لأن الجليد مادة غير متبلورة'],a:0,exp:'هذه من حكمة الخالق سبحانه: يطفو الجليد فيعزل الماء تحته وتبقى الكائنات البحرية حيّة في الشتاء.'},
 {t:'mcq',h:'التآصل',body:'<p>يوجد الكربون في الحالة الصلبة على هيئة ألماس وجرافيت وبكمنستر فوليرين. ماذا تسمى هذه الظاهرة؟</p>',opts:['التآصل','التسامي','النظائر','التبلور'],a:0,exp:'<b>التآصل</b>: وجود العنصر بأكثر من شكل في الحالة الفيزيائية نفسها. أما النظائر فتختلف في عدد النيوترونات.'}
]},
{id:'6-4',title:'تغيرات الحالة الفيزيائية',sub:'الانصهار والتبخر والتسامي، الضغط البخاري، مخطط الحالة',steps:[
 {t:'info',h:'الطاقة وتغير الحالة',body:'<p>تتغير حالة المادة عند إضافة الطاقة إليها أو انتزاعها منها. حرّك المؤشر ولاحظ ما يحدث لدرجة الحرارة:</p>',widget:'heating'},
 {t:'mcq',ch:1,h:'لماذا تثبت درجة الحرارة؟',body:'<p>في أثناء غليان الماء نستمر في التسخين، لكن درجة الحرارة تبقى 100 °C. أين تذهب الطاقة؟</p>',opts:['في التغلب على قوى التجاذب بين الجزيئات وفصلها','في رفع الطاقة الحركية للجزيئات','في تكسير الروابط التساهمية داخل الجزيء','تضيع في الهواء ولا أثر لها'],a:0,exp:'في مراحل تغير الحالة تُستهلك الطاقة في التغلب على القوى بين الجزيئات، ولهذا يبقى متوسط الطاقة الحركية (درجة الحرارة) ثابتًا.'},
 {t:'sort',h:'ماص أم طارد؟',body:'<p>صنّف العمليات بحسب الطاقة:</p>',cats:['تمتص طاقة','تطلق طاقة'],items:[['الانصهار',0],['التبخر',0],['التسامي',0],['التجمد',1],['التكاثف',1],['الترسب',1]],exp:'التحول نحو حالة جسيماتها أكثر حرية (صلب ← سائل ← غاز) يمتص طاقة، والعكس يطلقها.'},
 {t:'info',h:'مصطلحات مهمة',body:'<div class="key"><b>التبخر</b>: تحول السائل إلى غاز من سطحه فقط، ويحدث عند أي درجة حرارة.<br><b>الضغط البخاري</b>: الضغط الذي يبذله بخار السائل فوق سطحه في وعاء مغلق.<br><b>درجة الغليان</b>: درجة الحرارة التي يتساوى عندها الضغط البخاري للسائل مع الضغط الجوي.<br><b>التسامي</b>: تحول الصلب إلى غاز مباشرة (مثل اليود والثلج الجاف). <b>الترسب</b>: عكسه، تحول الغاز إلى صلب مباشرة (مثل تكوّن الصقيع).</div>'},
 {t:'mcq',ch:1,h:'الطبخ في الجبال',body:'<p>يغلي الماء في المناطق المرتفعة جدًّا عند درجة حرارة أقل من 100 °C. لماذا؟</p>',opts:['الضغط الجوي أقل، فيتساوى الضغط البخاري للماء معه عند درجة حرارة أقل','الماء هناك أنقى','الأكسجين هناك أكثر','لأن الجاذبية أقل بكثير'],a:0,exp:'درجة الغليان تعتمد على الضغط الخارجي؛ وكلما قل الضغط الجوي انخفضت درجة الغليان.'},
 {t:'mcq',h:'تبخر أم غليان؟',body:'<p>ما الفرق بين التبخر والغليان؟</p>',opts:['التبخر من السطح عند أي درجة حرارة، والغليان من داخل السائل كله عند درجة محددة','لا فرق بينهما','الغليان يحدث عند أي درجة حرارة','التبخر يحتاج إلى درجة حرارة أعلى من الغليان'],a:0,exp:'عند الغليان تتكوّن فقاعات البخار تحت سطح السائل ثم ترتفع إلى السطح.'},
 {t:'info',h:'مخطط الحالة',body:'<p><b>مخطط الحالة</b> رسم بياني يبيّن حالة المادة عند درجات الحرارة والضغوط المختلفة. النقطة <b>A</b> هي <b>النقطة الثلاثية</b> (توجد عندها الحالات الثلاث معًا)، والنقطة <b>B</b> هي <b>النقطة الحرجة</b> للماء (373.99 °C و 217.75 atm). حرّك المؤشرين:</p>',widget:'phase'},
 {t:'mcq',h:'من مخطط الحالة',body:'<p>اعتمادًا على مخطط حالة الماء: ما حالة الماء عند درجة حرارة 100.00 °C وضغط 2.00 atm؟</p>',opts:['سائل','غاز','صلب','الحالات الثلاث معًا'],a:0,exp:'عند 1.00 atm يغلي الماء عند 100 °C، فإذا زاد الضغط إلى 2.00 atm ارتفعت درجة الغليان، فيبقى الماء سائلًا عند 100 °C.'},
 {t:'mcq',ch:1,h:'النقطة الحرجة',body:'<p>ماذا يحدث لبخار الماء إذا كانت درجة حرارته أعلى من درجة الحرارة الحرجة (373.99 °C)؟</p>',opts:['لا يمكن تحويله إلى سائل مهما زاد الضغط','يتحول إلى سائل عند ضغط 1 atm','يتحول إلى صلب مباشرة','يتفكك إلى هيدروجين وأكسجين'],a:0,exp:'فوق درجة الحرارة الحرجة لا تستطيع زيادة الضغط وحدها إسالة الغاز.'}
]},
{id:'b6',boss:true,title:'تحدّي الفصل السادس',sub:'الغازات والقوى والسوائل والصلبة وتغيرات الحالة — 3 قلوب',steps:[
 {t:'num',h:'جراهام',body:'<p>احسب نسبة معدل تدفق <span class="f">N₂</span> (28.0 g/mol) إلى <span class="f">Ne</span> (20.2 g/mol).</p>',a:0.849,tol:0.006,unit:'',exp:'√(20.2 ÷ 28.0) = √0.721 = <b>0.849</b>؛ النيون أخف فيتدفق أسرع.'},
 {t:'num',h:'دالتون',body:'<p>خليط من الهيليوم والهيدروجين ضغطه الكلي <span class="f">600 mm Hg</span>، والضغط الجزئي للهيليوم <span class="f">439 mm Hg</span>. ما الضغط الجزئي للهيدروجين؟</p>',a:161,tol:0.5,unit:'mm Hg',exp:'600 − 439 = <b>161 mm Hg</b>'},
 {t:'mcq',h:'القوى بين الجزيئات',body:'<p>أيّ المواد الآتية لها أعلى درجة غليان؟</p>',opts:[F('H2O'),F('CH4'),F('O2'),F('N2')],a:0,exp:'الروابط الهيدروجينية بين جزيئات الماء أقوى بكثير من قوى التشتت في المواد الأخرى.'},
 {t:'sort',h:'صنّف',body:'',cats:['تساهمية شبكية','أيونية','جزيئية'],items:[['الألماس',0],['CaCO₃',1],['CO₂ الصلب (الثلج الجاف)',2],['SiO₂',0],['NaCl',1]],exp:'الثلج الجاف جزيئات CO₂ مرتبطة بقوى تشتت؛ لذلك يتسامى بسهولة.'},
 {t:'mcq',h:'الصقيع',body:'<p>يتكوّن الصقيع على زجاج السيارة في ليالي الشتاء الباردة من بخار الماء مباشرة. ما اسم هذه العملية؟</p>',opts:['الترسب','التسامي','التكاثف','التجمد'],a:0,exp:'الترسب: تحول الغاز إلى صلب دون المرور بالحالة السائلة، وهو عكس التسامي.'},
 {t:'mcq',h:'سؤال الختام',body:'<p>في وعاء مغلق فيه ماء عند 50 °C، ماذا يحدث للضغط البخاري إذا رفعنا درجة الحرارة إلى 80 °C؟</p>',opts:['يزداد','يقل','يبقى ثابتًا','يصبح صفرًا'],a:0,exp:'بارتفاع درجة الحرارة تمتلك جزيئات أكثر طاقة كافية للتبخر، فيزداد الضغط البخاري حتى يساوي الضغط الجوي عند الغليان.'}
]}
